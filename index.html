<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMOS INFOTEC - V25.1 SEGURA CORRIGIDA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial}body{background:#020617;color:#e2e8f0}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(#0f172a,#020617)}
.card{background:#111d33;width:100%;max-width:420px;padding:30px;border-radius:16px;border:1px solid #1e293b;box-shadow:0 10px 40px #000}
label{font-size:10px;color:#38bdf8;margin-top:12px;display:block;font-weight:bold}
input,select,textarea{width:100%;padding:12px;background:#0f172a;border:1px solid #1e293b;border-radius:8px;color:#fff;margin-top:5px}
.btn{padding:12px;border:0;border-radius:8px;cursor:pointer;font-weight:bold;width:100%;margin-top:12px}
.btn-blue{background:#38bdf8;color:#000}.btn-dark{background:#1e293b;color:#fff}
#app{display:none}.top{background:#020617;padding:12px 18px;display:flex;justify-content:space-between;border-bottom:1px solid #1e293b;position:sticky;top:0}
.menu{display:flex;gap:5px;background:#0f172a;padding:10px;overflow:auto}.menu button{background:#1e293b;color:#94a3b8;border:0;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:11px;white-space:nowrap}.menu button.ativo{background:#38bdf8;color:#000}
.content{padding:16px;max-width:1350px;margin:auto}.box{background:#111d33;padding:20px;border-radius:12px;border:1px solid #1e293b;margin-bottom:14px}
</style>
</head>
<body>
<div class="login" id="loginBox">
<div class="card">
<h2 style="text-align:center;color:#38bdf8">RAMOS INFOTEC</h2>
<p style="text-align:center;color:#22c55e;font-size:11px;margin-bottom:20px">🔒 V25.1 - Login Corrigido</p>
<label>NOME DA EMPRESA</label><input id="loginEmp" placeholder="RAMOS INFOTEC ou ramosinfotec">
<label>USUÁRIO</label><input id="loginUser" placeholder="admin ou ramos.admin">
<label>SENHA</label><input id="loginPass" type="password" placeholder="Sua senha">
<button class="btn btn-blue" onclick="entrar()">ENTRAR</button>
<div id="msg" style="color:#ef4444;text-align:center;margin-top:12px;font-size:11px"></div>
<p style="text-align:center;color:#334155;font-size:9px;margin-top:15px">Sistema seguro - Sem exibição de senhas</p>
</div>
</div>
<div id="app">
<div class="top"><div><b>RAMOS INFOTEC</b> <small id="topEmp" style="color:#38bdf8"></small></div><button class="btn btn-dark" onclick="location.reload()" style="width:auto;padding:6px 12px">Sair</button></div>
<div class="menu"><button onclick="aba('cli')" id="b-cli" class="ativo">Cliente</button><button onclick="aba('usu')" id="b-usu">Usuário+Empresa</button><button onclick="aba('cliVisao')" id="b-cliVisao">Visão Cliente</button></div>
<div class="content">
<div id="cli" class="aba"><div class="box"><h3>Cliente - OK</h3><table><tbody id="tabCli"></tbody></table></div></div>
<div id="usu" class="aba" style="display:none"><div class="box"><h3>Usuário + Empresa + ALTERAR SENHA</h3><label>USUÁRIO</label><input id="uNome"><label>SENHA (não aparece na tabela)</label><input id="uSenha" type="password"><label>EMPRESA</label><select id="uEmpresa"></select><label>PERFIL</label><select id="uPerfil"><option>Administrador</option><option>Cliente - Só Chamados</option></select><button class="btn btn-blue" onclick="usuSalvar()">SALVAR</button><button class="btn btn-dark" onclick="usuAlterarSenha()">ALTERAR SENHA</button><table><thead><tr><th>Usuário</th><th>Empresa</th><th>Perfil</th></tr></thead><tbody id="tabUsu"></tbody></table></div></div>
<div id="cliVisao" class="aba" style="display:none"><div class="box"><h3>Visão Cliente</h3><label>EMPRESA</label><input id="cvEmp" disabled><label>TÍTULO</label><input id="cvTit"><button class="btn btn-blue" onclick="cvAdd()">ADICIONAR</button><table><tbody id="tabCv"></tbody></table></div></div>
</div>
</div>
<script>
let db={cli:JSON.parse(localStorage.getItem('ri25_cli')||'[]'),usu:JSON.parse(localStorage.getItem('ri25_usu')||'[]'),cv:JSON.parse(localStorage.getItem('ri25_cv')||'[]')};
let logado={};
function save(){localStorage.setItem('ri25_cli',JSON.stringify(db.cli));localStorage.setItem('ri25_usu',JSON.stringify(db.usu));localStorage.setItem('ri25_cv',JSON.stringify(db.cv));render()}
function entrar(){
let emp=loginEmp.value.trim().toLowerCase(),u=loginUser.value.trim().toLowerCase(),p=loginPass.value.trim();
if(!emp||!u||!p){msg.innerText='Preencha tudo';return;}
// Se não tem nenhum usuário, libera primeiro acesso com qualquer variação de ramos + admin
if(db.usu.length===0 && (emp.includes('ramos')||emp.includes('infotec')) && (u==='admin'||u==='ramos.admin'||u==='ramosinfotec') && p==='@Xumone@197353'){
logado={nome:'ramos.admin',empresa:'RAMOS INFOTEC',perfil:'Administrador',senha:p};db.usu.push(logado);save();ok();return;
}
let ach=db.usu.find(x=>x.empresa.toLowerCase().includes(emp) && x.nome.toLowerCase()===u && x.senha===p);
if(!ach)ach=db.usu.find(x=>x.nome.toLowerCase()===u && x.senha===p); // busca só por usuario/senha também
if(ach){logado=ach;ok();}else{msg.innerText='Empresa/Usuário/Senha inválidos! Tente: RAMOS INFOTEC / admin / @Xumone@197353';}
}
function ok(){loginBox.style.display='none';app.style.display='block';topEmp.innerText=logado.empresa;cvEmp.value=logado.empresa;render();}
function aba(n){document.querySelectorAll('.aba').forEach(a=>a.style.display='none');document.getElementById(n).style.display='block';document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('ativo'));document.getElementById('b-'+n)?.classList.add('ativo');}
function usuSalvar(){if(!uNome.value||!uSenha.value)return alert('Usuário e senha');db.usu.push({nome:uNome.value,senha:uSenha.value,empresa:uEmpresa.value||logado.empresa,perfil:uPerfil.value});save();alert('Usuário criado! Senha não aparece na tabela por segurança');uNome.value='';uSenha.value='';}
function usuAlterarSenha(){let n=prompt('Usuário para ALTERAR SENHA:');let a=db.usu.find(x=>x.nome.toLowerCase()===n.toLowerCase());if(a){a.senha=prompt('Nova senha para '+n+':');save();alert('Senha alterada com sucesso!');}else alert('Usuário não encontrado');}
function cvAdd(){db.cv.push({tit:cvTit.value,status:'Aberto',emp:cvEmp.value});save();}
function render(){tabCli.innerHTML='';uEmpresa.innerHTML='';tabUsu.innerHTML='';tabCv.innerHTML='';db.cli.forEach(c=>{tabCli.innerHTML+=`<tr><td>${c.emp}</td></tr>`;uEmpresa.innerHTML+=`<option>${c.emp||'RAMOS INFOTEC'}</option>`;});if(uEmpresa.innerHTML==='')uEmpresa.innerHTML='<option>RAMOS INFOTEC</option>';db.usu.forEach(u=>{tabUsu.innerHTML+=`<tr><td>${u.nome}</td><td>${u.empresa}</td><td>${u.perfil}</td></tr>`;});db.cv.forEach(v=>{tabCv.innerHTML+=`<tr><td>${v.tit}</td></tr>`;});}
</script>
</body>
</html>
