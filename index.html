<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RAMOS V17.2 FIX - ABRE DIRETO</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#070d1e;color:#e2e8f0;font-family:Inter}.glass{background:rgba(15,23,42,.98);border:1px solid rgba(0,217,255,.2)}.neon{color:#00D9FF}.btn{background:linear-gradient(90deg,#00D9FF,#0066FF);color:#fff;font-weight:800}.lb{font-size:10px;color:#7dd3fc;font-weight:800;display:block;margin-bottom:3px;text-transform:uppercase}.inp{background:#0f172a;border:1px solid rgba(0,217,255,.28);color:#fff;padding:9px 11px;border-radius:8px;width:100%;font-size:12.5px}.card{background:rgba(15,23,42,.92);border:1px solid rgba(0,217,255,.15);border-radius:12px;padding:13px}.b{padding:7px 14px;border-radius:7px;font-size:11px;font-weight:800;color:#fff;border:none;cursor:pointer}.b-inc{background:#0891b2}.b-alt{background:#2563eb}.b-exc{background:#dc2626}.b-ver{background:#334155}.b-limpar{background:#475569}.b-focal{background:#00D9FF;color:#000}.tab{display:none}.tab.active{display:block!important}.menu-btn{width:100%;text-align:left;padding:9px 11px;border-radius:8px;font-size:12.5px;color:#94a3b8}.menu-btn.active{background:rgba(0,217,255,.15);color:#00D9FF;border:1px solid rgba(0,217,255,.35)}</style></head><body>
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="glass p-7 rounded-2xl w-full max-w-sm text-center"><div class="w-16 h-16 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-xl mx-auto flex items-center justify-center font-black text-xl">RI</div><h1 class="neon font-black mt-3">RAMOS V17.2 FIX</h1><p class="text-[10px] opacity-70 mb-3">ABRE AUTOMATICO - ROBO REAL</p><p id="msg" class="text-[11px] text-yellow-300 mb-3">Entrando automaticamente em 2 segundos...</p><div class="text-left"><label class="lb">Empresa</label><input id="empresa" class="inp mb-2" value="RAMOS"><label class="lb">Usuario</label><input id="usuario" class="inp mb-2" value="admin"><label class="lb">Senha</label><input id="senha" type="password" class="inp mb-4" value="@Xumone@197353"><button onclick="entrar()" class="btn w-full py-3 rounded-xl">ENTRAR AGORA</button></div></div></div>
<div id="app" class="hidden min-h-screen flex"><div class="w-64 glass border-r p-3 flex flex-col"><p class="font-bold neon text-sm">RAMOS V17.2 FIX</p><nav class="space-y-1 flex-1"><button onclick="mostrar('clientes')" class="menu-btn active" id="btn-clientes">👥 Clientes + ANEXO</button><button onclick="mostrar('financeiro')" class="menu-btn" id="btn-financeiro">💰 Financeiro ALTERAR TUDO</button><button onclick="mostrar('robo')" class="menu-btn" id="btn-robo">🤖 Robo REAL CAPTA</button><button onclick="mostrar('chamados')" class="menu-btn" id="btn-chamados">📋 Chamados</button></nav><button onclick="sair()" class="w-full mt-4 py-2 rounded bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold">SAIR</button></div><div class="flex-1 p-4 overflow-auto">
<div id="sec-clientes" class="tab active"><div class="card border border-cyan-400/30"><div class="flex justify-between"><h2 class="neon font-bold text-sm">👥 CLIENTES - ANEXO + CONTATO</h2><button onclick="limparClientes()" class="b b-limpar">🧹 LIMPAR TELA</button></div><div class="grid grid-cols-1 md:grid-cols-3 gap-2 mt-3"><div><label class="lb">Nome Empresa*</label><input id="cNome" class="inp"></div><div><label class="lb">Nome Contato* NOVO</label><input id="cContato" class="inp"></div><div><label class="lb">WhatsApp*</label><input id="cZap" class="inp"></div><div><label class="lb">Telefone Contato NOVO</label><input id="cTel" class="inp"></div><div><label class="lb">Empresa*</label><input id="cEmpresa" class="inp"></div><div><label class="lb">Tipo*</label><select id="cTipo" class="inp"><option>Contrato</option><option>Avulso</option></select></div></div><div class="mt-3 p-3 rounded bg-yellow-500/10 border-2 border-yellow-500/40"><label class="lb">📎 ANEXO CONTRATO</label><input id="cAnexo" type="file" accept=".pdf,.jpg,.png,.docx" class="inp mt-1"><p id="cAnexoNome" class="text-[10px] opacity-70 mt-1">Nenhum arquivo</p></div><div class="flex gap-2 mt-4"><button id="btnCli" onclick="salvarCliente()" class="b b-inc px-8 py-3">INCLUIR</button><button onclick="localizarCliente()" class="b b-ver px-6 py-3">🔍 LOCALIZAR</button></div><div id="listaClientes" class="mt-4 space-y-2"></div></div></div>
<div id="sec-financeiro" class="tab"><div class="card border-2 border-cyan-400/30"><h2 class="neon font-bold text-sm">💰 FINANCEIRO - ALTERAR QUALQUER CAMPO + SEM -2</h2><div class="grid grid-cols-1 md:grid-cols-4 gap-2 mt-3"><div><label class="lb">Nome Boleto*</label><input id="fNome" class="inp"></div><div><label class="lb">Data Boleto*</label><input id="fDataBol" type="date" class="inp"></div><div><label class="lb">Valor Boleto* (trava -2)</label><input id="fBoleto" type="number" min="0" step="0.01" class="inp"></div><div><label class="lb">Empresa</label><input id="fEmp" class="inp"></div></div><div class="flex gap-2 mt-3"><button id="btnFin" onclick="salvarFin()" class="b b-inc px-8 py-3">INCLUIR</button></div><div id="listaFin" class="mt-3 space-y-2"></div></div></div>
<div id="sec-robo" class="tab"><div class="card border-2 border-green-500/50"><h2 class="neon font-bold text-green-400">🤖 ROBO REAL - CAPTA DE VERDADE</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-2 mt-4"><div><label class="lb">Tipo REAL*</label><select id="roboTipo" class="inp"><option>Clinica Medica</option><option>Pet Shop</option><option>Consultorio Medico</option><option>Loja</option><option>Clinica Odontologica</option><option>Academia</option><option>Restaurante</option><option>Advocacia</option></select></div><div class="flex items-end"><button onclick="buscarReal()" class="b b-inc w-full py-3 bg-green-600">🤖 CACAR REAIS AGORA</button></div></div><div class="flex gap-2 mt-3"><button onclick="limparRobo()" class="b b-ver px-4">🧹 LIMPAR TELA</button><span id="roboStatus" class="text-[11px] opacity-70">Pronto</span><span id="roboCount" class="text-[10px] bg-green-500/20 text-green-400 px-2 py-1 rounded">0 captados</span></div><div id="listaRobo" class="mt-4 grid md:grid-cols-2 gap-3"></div></div></div>
<div id="sec-chamados" class="tab"><div class="card"><h2 class="neon font-bold text-sm">📋 CHAMADOS</h2><div id="listaCha" class="mt-3"></div></div></div>
</div></div>
<script>
let clientes=JSON.parse(localStorage.getItem('v17_cli')||'[]');let fins=JSON.parse(localStorage.getItem('v17_fin')||'[]');let editCli=null,editFin=null,anexoTemp=null;
function salvarLS(){localStorage.setItem('v17_cli',JSON.stringify(clientes));localStorage.setItem('v17_fin',JSON.stringify(fins));}
function entrar(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('app').classList.add('flex');renderTudo();}
function sair(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');}
function mostrar(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('active'));document.getElementById('sec-'+id).classList.add('active');let btn=document.getElementById('btn-'+id);if(btn)btn.classList.add('active');}
setTimeout(function(){entrar();},1500);
let inputAnexo=document.getElementById('cAnexo');if(inputAnexo){inputAnexo.addEventListener('change',function(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){anexoTemp={nome:f.name,data:ev.target.result};document.getElementById('cAnexoNome').innerText='Anexado: '+f.name;};r.readAsDataURL(f);});}
function limparClientes(){document.getElementById('cNome').value='';document.getElementById('cContato').value='';document.getElementById('cZap').value='';document.getElementById('cTel').value='';document.getElementById('cEmpresa').value='';document.getElementById('cAnexo').value='';document.getElementById('cAnexoNome').innerText='Nenhum arquivo';anexoTemp=null;editCli=null;document.getElementById('btnCli').innerText='INCLUIR';}
function salvarCliente(){let nome=document.getElementById('cNome').value.trim(),empresa=document.getElementById('cEmpresa').value.trim(),zap=document.getElementById('cZap').value.trim(),tipo=document.getElementById('cTipo').value;if(!nome||!empresa||!zap){alert('Preencha Nome, Empresa e WhatsApp');return;}if(tipo==='Contrato'&&!anexoTemp&&!editCli){alert('Para CONTRATO precisa anexar contrato!');return;}let obj={id:editCli||Date.now(),nome:nome,contato:document.getElementById('cContato').value,empresa:empresa,zap:zap,tel:document.getElementById('cTel').value,tipo:tipo,anexo:anexoTemp};if(editCli){let idx=clientes.findIndex(c=>c.id===editCli);if(idx>=0)clientes[idx]=obj;}else clientes.push(obj);salvarLS();renderClientes();limparClientes();}
function renderClientes(){let div=document.getElementById('listaClientes');if(clientes.length===0){div.innerHTML='<p class="opacity-40 text-xs">Nenhum cliente</p>';return;}let html='';for(let i=clientes.length-1;i>=0;i--){let c=clientes[i];html+='<div class="card py-2 flex justify-between gap-2"><div><b class="text-xs">'+c.nome+'</b> - '+c.empresa+' '+(c.anexo?'📎':'')+'<br><span class="text-[10px] opacity-60">Contato:'+c.contato+' Tel:'+c.tel+' Zap:'+c.zap+'</span></div><div class="flex gap-1"><button onclick="editarCliente('+c.id+')" class="b b-alt">ALTERAR TUDO</button><button onclick="excluirCliente('+c.id+')" class="b b-exc">EXCLUIR</button></div></div>';}div.innerHTML=html;}
function editarCliente(id){let c=clientes.find(x=>x.id===id);document.getElementById('cNome').value=c.nome;document.getElementById('cContato').value=c.contato||'';document.getElementById('cEmpresa').value=c.empresa;document.getElementById('cZap').value=c.zap;document.getElementById('cTel').value=c.tel||'';document.getElementById('cTipo').value=c.tipo;if(c.anexo)document.getElementById('cAnexoNome').innerText='Atual: '+c.anexo.nome;editCli=id;document.getElementById('btnCli').innerText='ATUALIZAR QUALQUER CAMPO';mostrar('clientes');}
function excluirCliente(id){if(!confirm('Excluir?'))return;clientes=clientes.filter(x=>x.id!==id);salvarLS();renderClientes();}
function localizarCliente(){let termo=prompt('LOCALIZAR:');if(!termo)return;termo=termo.toLowerCase();let filtrados=clientes.filter(c=>(c.nome+' '+c.empresa).toLowerCase().includes(termo));let div=document.getElementById('listaClientes');let html='';for(let c of filtrados){html+='<div class="card py-1 text-xs">'+c.nome+' - '+c.empresa+'</div>';}div.innerHTML=html;}
function limparFin(){document.getElementById('fNome').value='';document.getElementById('fDataBol').value='';document.getElementById('fBoleto').value='';document.getElementById('fEmp').value='';editFin=null;document.getElementById('btnFin').innerText='INCLUIR';}
function salvarFin(){let nome=document.getElementById('fNome').value.trim(),boleto=parseFloat(document.getElementById('fBoleto').value||0);if(!nome||boleto<=0){alert('Nome e valor >0 SEM NEGATIVO');return;}let obj={id:editFin||Date.now(),nome:nome,boleto:boleto,empresa:document.getElementById('fEmp').value,dataBol:document.getElementById('fDataBol').value};if(editFin){let idx=fins.findIndex(f=>f.id===editFin);if(idx>=0)fins[idx]=obj;}else fins.push(obj);salvarLS();renderFin();limparFin();}
function renderFin(){let div=document.getElementById('listaFin');if(fins.length===0){div.innerHTML='<p class="opacity-40 text-xs">Nenhum financeiro</p>';return;}let html='';for(let i=fins.length-1;i>=0;i--){let f=fins[i];html+='<div class="card py-2 flex justify-between"><div class="text-xs"><b>'+f.nome+'</b> R$'+f.boleto+' - '+f.empresa+'</div><div class="flex gap-1"><button onclick="editarFin('+f.id+')" class="b b-alt">ALTERAR TUDO</button><button onclick="excluirFin('+f.id+')" class="b b-exc">EXCLUIR</button></div></div>';}div.innerHTML=html;}
function editarFin(id){let f=fins.find(x=>x.id===id);document.getElementById('fNome').value=f.nome;document.getElementById('fBoleto').value=f.boleto;document.getElementById('fEmp').value=f.empresa||'';document.getElementById('fDataBol').value=f.dataBol||'';editFin=id;document.getElementById('btnFin').innerText='ATUALIZAR QUALQUER CAMPO';mostrar('financeiro');}
function excluirFin(id){fins=fins.filter(x=>x.id!==id);salvarLS();renderFin();}
function limparRobo(){document.getElementById('listaRobo').innerHTML='';document.getElementById('roboStatus').innerText='Pronto';document.getElementById('roboCount').innerText='0 captados REAIS';}
async function buscarReal(){let tipo=document.getElementById('roboTipo').value;let status=document.getElementById('roboStatus');let div=document.getElementById('listaRobo');status.innerText='Buscando '+tipo+' REAIS em SP via OSM...';div.innerHTML='<p class="text-xs opacity-60">Conectando API real...</p>';let q='';if(tipo.includes('Medica')) q='[out:json][timeout:25];(node["amenity"="clinic"](around:15000,-23.55052,-46.633308););out 10;';else if(tipo.includes('Pet')) q='[out:json][timeout:25];(node["shop"="pet"](around:15000,-23.55052,-46.633308););out 10;';else if(tipo.includes('Consultorio')) q='[out:json][timeout:25];(node["amenity"="doctors"](around:15000,-23.55052,-46.633308););out 10;';else if(tipo.includes('Loja')) q='[out:json][timeout:25];(node["shop"](around:10000,-23.55052,-46.633308););out 10;';else if(tipo.includes('Odontologica')) q='[out:json][timeout:25];(node["amenity"="dentist"](around:15000,-23.55052,-46.633308););out 10;';else if(tipo.includes('Academia')) q='[out:json][timeout:25];(node["leisure"="fitness_centre"](around:15000,-23.55052,-46.633308););out 10;';else if(tipo.includes('Restaurante')) q='[out:json][timeout:25];(node["amenity"="restaurant"](around:10000,-23.55052,-46.633308););out 10;';else if(tipo.includes('Advocacia')) q='[out:json][timeout:25];(node["office"="lawyer"](around:15000,-23.55052,-46.633308););out 10;';else q='[out:json][timeout:25];(node["shop"](around:10000,-23.55052,-46.633308););out 10;';try{let resp=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q});let data=await resp.json();let els=data.elements||[];if(els.length===0){status.innerText='Nenhum REAL encontrado - Tente Clinica Medica ou Pet';return;}status.innerText=els.length+' CLIENTES REAIS encontrados!';window._realEls=els;let html='';for(let i=0;i<els.length;i++){let el=els[i];let tags=el.tags||{};let nome=tags.name||(tipo+' '+(i+1));let rua=(tags['addr:street']||'')+' '+(tags['addr:housenumber']||'');let tel=tags.phone||tags['contact:phone']||'';html+='<div class="card border border-green-500/40 bg-green-500/5"><b class="text-xs text-green-300">REAL: '+nome+'</b><br><span class="text-[10px] opacity-80">'+rua+'<br>Tel:'+(tel||'Sem tel no OSM')+'</span><div class="flex gap-1 mt-2"><button onclick="salvarReal('+i+')" class="b b-inc flex-1">SALVAR COMO CLIENTE REAL</button></div></div>';}div.innerHTML=html;}catch(e){status.innerText='Erro API: '+e.message;}}
function salvarReal(idx){let el=window._realEls[idx];if(!el)return;let tags=el.tags||{};let nome=tags.name||('Cliente Real '+(idx+1));let rua=(tags['addr:street']||'')+' '+(tags['addr:housenumber']||'');let tel=tags.phone||tags['contact:phone']||'';clientes.push({id:Date.now()+idx,nome:nome,contato:'Responsavel a definir',empresa:nome,zap:tel,tel:tel,tipo:'Avulso',anexo:null});salvarLS();renderClientes();let c=document.getElementById('roboCount');if(c){let n=parseInt(c.innerText)||0;c.innerText=(n+1)+' captados REAIS';}alert('CLIENTE REAL SALVO: '+nome+' - Ja foi para Clientes!');}
function renderTudo(){renderClientes();renderFin();}
</script>
</body>
</html>
