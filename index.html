<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xumone V63.1 - PRODUÇÃO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:#fff}
.login{max-width:400px;margin:50px auto;background:#1e293b;padding:30px;border-radius:12px}
.login h2{text-align:center;margin-bottom:10px}
.login input, .login select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
.login button{width:100%;padding:12px;background:#f59e0b;color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin-top:10px}
.header{background:#1e293b;padding:15px;display:flex;justify-content:space-between}
.card{background:#1e293b;padding:20px;border-radius:12px;margin:15px}
</style>
</head>
<body>
<div id="loginScreen" class="login">
<h2>🔐 Xumone V63.1<br>PRODUÇÃO</h2>
<p style="text-align:center;color:#94a3b8;font-size:13px;margin-bottom:15px">Login corrigido + campo empresa</p>

<select id="empresa">
<option value="">Selecione a Empresa</option>
<option value="Xumone Matriz">Xumone Matriz</option>
<option value="Xumone Filial">Xumone Filial</option>
<option value="Ramos Infotec">Ramos Infotec</option>
</select>

<input id="user" placeholder="Usuário" value="admin">
<input id="pass" type="password" placeholder="Senha" value="@Xumone@197353">

<button onclick="fazerLogin()" style="background:#f59e0b">ENTRAR - V63.1 PRODUÇÃO</button>
<button onclick="limparTudo()" style="background:#ef4444;color:#fff">🧹 LIMPAR CACHE</button>
<p id="msg" style="text-align:center;color:#fbbf24;margin-top:10px"></p>
</div>

<div id="app" style="display:none">
<div class="header">
<span>🚀 V63.1 - <b id="empLogada"></b></span>
<button onclick="logout()" style="padding:8px 15px;background:#f59e0b;border:none;border-radius:6px;font-weight:bold;cursor:pointer">Sair</button>
</div>
<div class="card">
<h3>💰 Financeiro - Selects corrigidos</h3>
<select id="selEmpresa" onchange="mostrar()"><option value="">Empresa</option><option>Xumone Matriz</option><option>Ramos Infotec</option></select>
<select id="selCliente" onchange="mostrar()"><option value="">Cliente</option><option>Cliente A - R$1.500</option><option>Cliente B - R$2.300</option></select>
<select id="selCategoria" onchange="mostrar()"><option value="">Categoria</option><option>Receita</option><option>Despesa</option></select>
<div id="conteudo" style="margin-top:20px;background:#0f172a;padding:15px;border-radius:8px">Selecione para ver...</div>
</div>
</div>

<script>
(function(){if(!localStorage.getItem('v63_fix')){localStorage.clear();sessionStorage.clear();localStorage.setItem('v63_fix','ok');}})();
function fazerLogin(){
  const e=document.getElementById('empresa').value;
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  if(!e){document.getElementById('msg').innerText='❌ Selecione a empresa!';return;}
  if(u==='admin' && p==='@Xumone@197353'){
    localStorage.setItem('logado_v63','true');localStorage.setItem('empresa',e);
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('empLogada').innerText=e;
  }else{document.getElementById('msg').innerText='❌ Senha incorreta!';}
}
function limparTudo(){localStorage.clear();sessionStorage.clear();localStorage.setItem('v63_fix','ok');location.reload();}
function logout(){localStorage.removeItem('logado_v63');location.reload();}
function mostrar(){
  const emp=document.getElementById('selEmpresa').value;
  const cli=document.getElementById('selCliente').value;
  const cat=document.getElementById('selCategoria').value;
  document.getElementById('conteudo').innerHTML=`🏢 ${emp}<br>👤 ${cli}<br>📂 ${cat}<br><br>✅ Carregado!`;
}
if(localStorage.getItem('logado_v63')==='true'){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('empLogada').innerText=localStorage.getItem('empresa');
}
</script>
</body>
</html>
