<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RAMOS V20.3 FINAL</title><style>body{margin:0;background:#070d1e;color:#e2e8f0;font-family:system-ui}.glass{background:#0f172a;border:1px solid #00D9FF55}.neon{color:#00D9FF}.lb{font-size:10px;color:#7dd3fc;font-weight:800;display:block;margin:4px 0 3px}.inp{background:#0f172a;border:1px solid #00D9FF44;color:#fff;padding:12px;border-radius:6px;width:100%}.tab{display:none}.tab.active{display:block!important}.menu-btn{width:100%;text-align:left;padding:8px;border-radius:6px;font-size:11px;color:#94a3b8;background:transparent;border:1px solid transparent;cursor:pointer}.menu-btn.active{background:#00D9FF22;color:#00D9FF;border-color:#00D9FF55}.card{background:#111c33;border:1px solid #00D9FF22;border-radius:10px;padding:10px;margin-bottom:8px}.b{padding:8px 14px;border-radius:6px;font-size:11px;font-weight:800;color:#fff;border:0;cursor:pointer}.b-inc{background:#0891b2}.b-alt{background:#2563eb}.b-exc{background:#dc2626}.b-ver{background:#334155}.b-limpar{background:#475569}</style></head><body>
<div id="login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px"><div class="glass" style="padding:26px;border-radius:16px;width:100%;max-width:400px;text-align:center"><div style="width:60px;height:60px;background:linear-gradient(135deg,#22d3ee,#2563eb);border-radius:12px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px">RI</div><h1 class="neon" style="margin:10px 0 4px">RAMOS V20.3 FINAL</h1><p id="msg" style="font-size:12px;color:#4ade80;background:#111c33;padding:8px;border-radius:6px">Sistema Limpo - Digite</p><div style="text-align:left;margin-top:14px"><label class="lb">Empresa</label><input id="empresa" class="inp" placeholder="RAMOS"><label class="lb">Usuario</label><input id="usuario" class="inp" placeholder="admin"><label class="lb">Senha</label><div style="display:flex;gap:6px"><input id="senha" type="password" class="inp" placeholder="@Xumone@197353"><button onclick="let e=document.getElementById('senha');e.type=e.type=='password'?'text':'password'" class="b b-ver">👁️</button></div></div><button onclick="entrarSeguro()" style="margin-top:14px;width:100%;background:#22c55e;color:#000;font-weight:900;border:0;padding:16px;border-radius:10px;cursor:pointer;font-size:16px">ENTRAR NO SISTEMA</button><button onclick="localStorage.clear();alert('Cache limpo! Recarregue');location.reload()" style="margin-top:8px;width:100%;background:#475569;color:#fff;border:0;padding:8px;border-radius:6px;font-size:10px">LIMPAR CACHE SE NÃO ENTRAR</button></div></div>
<div id="app" style="display:none;min-height:100vh"><div style="width:200px" class="glass"><div style="padding:10px"><p class="neon" style="font-weight:800">RAMOS V20.3</p><p id="uInfo" style="font-size:10px;background:#111c33;padding:6px;border-radius:4px"></p><nav style="display:flex;flex-direction:column;gap:4px;margin-top:10px"><button onclick="abrir('dash')" id="m-dash" class="menu-btn active">Dashboard</button><button onclick="abrir('clientes')" id="m-clientes" class="menu-btn">Clientes</button><button onclick="abrir('chamados')" id="m-chamados" class="menu-btn">Chamados</button><button onclick="abrir('financeiro')" id="m-financeiro" class="menu-btn">Financeiro</button><button onclick="abrir('meufin')" id="m-meufin" class="menu-btn">Meu Privado</button><button onclick="abrir('estoque')" id="m-estoque" class="menu-btn">Estoque</button><button onclick="abrir('remote')" id="m-remote" class="menu-btn">Remoto</button><button onclick="abrir('robo')" id="m-robo" class="menu-btn">Robo</button><button onclick="abrir('relatorios')" id="m-relatorios" class="menu-btn">Relatorios</button><button onclick="abrir('usuarios')" id="m-usuarios" class="menu-btn">Usuarios</button></nav><button onclick="sair()" style="width:100%;margin-top:12px" class="b b-exc">SAIR</button></div></div><div style="flex:1;padding:12px;overflow:auto"><div id="tab-dash" class="tab active"><div id="perfilMsg" style="font-size:12px;background:#0f172a;padding:10px;border-radius:6px;color:#4ade80"></div><div class="card"><h3 class="neon">Dashboard</h3><p style="font-size:12px">Logado com sucesso!</p></div></div><div id="tab-clientes" class="tab"><div class="card"><h3 class="neon">CLIENTES</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><div><label class="lb">Nome Empresa*</label><input id="cNome" class="inp"></div><div><label class="lb">Contato*</label><input id="cContato" class="inp"></div><div><label class="lb">Zap*</label><input id="cZap" class="inp"></div><div><label class="lb">Empresa*</label><input id="cEmpresa" class="inp"></div><div><label class="lb">Tel</label><input id="cTel" class="inp"></div><div><label class="lb">Tipo*</label><select id="cTipo" class="inp"><option>Contrato</option><option>Avulso</option></select></div><div><label class="lb">Estado</label><input id="cEst" class="inp"></div><div><label class="lb">Municipio</label><input id="cMun" class="inp"></div><div><label class="lb">CEP</label><input id="cCep" class="inp"></div><div style="grid-column:span 3"><label class="lb">Endereco</label><input id="cEnd" class="inp"></div></div><div style="display:flex;gap:6px;margin-top:8px"><button onclick="salvarCli()" class="b b-inc">INCLUIR</button><button onclick="limparCli()" class="b b-limpar">LIMPAR TELA</button></div><div id="lCli" style="margin-top:10px"></div></div></div><div id="tab-chamados" class="tab"><div class="card"><h3 class="neon">CHAMADOS</h3><div id="lCha"></div></div></div><div id="tab-financeiro" class="tab"><div class="card"><h3 class="neon">FINANCEIRO</h3><div id="lFin"></div></div></div><div id="tab-meufin" class="tab"><div class="card"><h3 class="neon">MEU PRIVADO</h3><div id="lMeu"></div></div></div><div id="tab-estoque" class="tab"><div class="card"><h3 class="neon">ESTOQUE</h3><div id="lEst"></div></div></div><div id="tab-remote" class="tab"><div class="card"><h3 class="neon">REMOTO</h3><div id="lRem"></div></div></div><div id="tab-robo" class="tab"><div class="card"><h3 style="color:#4ade80">ROBO</h3><div id="lRobo"></div></div></div><div id="tab-relatorios" class="tab"><div class="card"><h3 class="neon">RELATORIOS</h3></div></div><div id="tab-usuarios" class="tab"><div class="card"><h3 class="neon">USUARIOS</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><div><label class="lb">Usuario*</label><input id="uNo" class="inp"></div><div><label class="lb">Empresa*</label><input id="uEm" class="inp"></div><div><label class="lb">Senha*</label><input id="uSenha" class="inp"></div></div><div style="display:flex;gap:6px;margin-top:8px"><button onclick="salvarUsu()" class="b b-inc">CRIAR</button><button onclick="limparUsu()" class="b b-limpar">LIMPAR TELA</button></div><div id="lUsu" style="margin-top:10px"></div></div></div></div></div>
<script>
let C=[],CH=[],F=[],M=[],E=[],R=[],U=[];
try{C=JSON.parse(localStorage.getItem('v23_cli')||'[]')}catch(e){C=[]}
try{U=JSON.parse(localStorage.getItem('v23_usr')||'[]')}catch(e){U=[]}
if(U.length==0){U=[{id:1,nome:'admin',empresa:'RAMOS',senha:'@Xumone@197353',perfil:'master'},{id:2,nome:'teste',empresa:'teste',senha:'123',perfil:'cliente'}];localStorage.setItem('v23_usr',JSON.stringify(U));}
let cur='',emp='',role='';
function save(){localStorage.setItem('v23_cli',JSON.stringify(C));localStorage.setItem('v23_usr',JSON.stringify(U));}
function sair(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}
function entrarSeguro(){
let eRaw=document.getElementById('empresa').value;
let uRaw=document.getElementById('usuario').value;
let sRaw=document.getElementById('senha').value;
let e=eRaw.trim().toLowerCase();
let u=uRaw.trim().toLowerCase();
let s=sRaw.trim();
let msg=document.getElementById('msg');
if(!e||!u||!s){msg.innerText='Preencha tudo!';msg.style.color='#f87171';return;}
if(u==='admin' && e==='ramos' && s==='@Xumone@197353'){
cur='admin';emp='RAMOS';role='master';
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='flex';
document.getElementById('uInfo').innerText=cur+' - '+emp+' MASTER';
document.getElementById('perfilMsg').innerHTML='Bem vindo ADMIN!';
return;
}
if(u==='teste' && e==='teste' && s==='123'){
cur='teste';emp='teste';role='cliente';
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='flex';
document.getElementById('uInfo').innerText=cur+' - '+emp+' CLIENTE';
return;
}
let found=U.find(x=>x.nome.toLowerCase()===u && x.empresa.toLowerCase()===e && x.senha===s);
if(found){
cur=found.nome;emp=found.empresa;role=found.perfil;
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='flex';
document.getElementById('uInfo').innerText=cur+' - '+emp;
return;
}
msg.innerText='ERRO! Voce digitou: Empresa=['+eRaw+'] Usuario=['+uRaw+'] Senha=['+sRaw+'] | Use RAMOS / admin / @Xumone@197353';
msg.style.color='#f87171';
}
function abrir(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('active'));let tab=document.getElementById('tab-'+id);let btn=document.getElementById('m-'+id);if(tab)tab.classList.add('active');if(btn)btn.classList.add('active');}
function limparCli(){['cNome','cContato','cZap','cEmpresa','cTel','cEst','cMun','cCep','cEnd'].forEach(i=>{let el=document.getElementById(i);if(el)el.value='';});}
function salvarCli(){let n=document.getElementById('cNome').value.trim();if(!n)return;C.push({id:Date.now(),nome:n});save();document.getElementById('lCli').innerHTML=C.map(c=>'<div class=card>'+c.nome+'</div>').join('');limparCli();}
function limparUsu(){document.getElementById('uNo').value='';document.getElementById('uEm').value='';document.getElementById('uSenha').value='';}
function salvarUsu(){let n=document.getElementById('uNo').value.trim(),e=document.getElementById('uEm').value.trim(),s=document.getElementById('uSenha').value.trim();if(!n||!e||!s)return;U.push({id:Date.now(),nome:n,empresa:e,senha:s,perfil:'cliente'});save();rUsu();limparUsu();}
function rUsu(){let d=document.getElementById('lUsu');d.innerHTML=U.map(u=>'<div class=card><b>'+u.nome+'</b> - '+u.empresa+' - Senha: ••••</div>').join('');}
rUsu();
</script>
</body></html>
