<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ramos PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-[#060a14] text-slate-200">

<!-- LOGIN -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-[#0f172a] p-8 rounded-2xl max-w-sm w-full border border-cyan-500/30 text-center">
    <img src="./LogoTipo.jpg" class="w-36 mx-auto mb-4 rounded-xl bg-black p-2">
    <h1 class="text-xl font-bold text-cyan-400">Ramos Tecnologia</h1>
    <p class="text-[11px] text-gray-400 mb-6">PRO V2.2 - PIX 11 99626-4221</p>

    <div class="relative">
      <input id="senha" type="password" placeholder="Digite sua senha"
             class="w-full p-3 rounded bg-black border border-cyan-500/20 mb-3 text-white">
    </div>

    <button onclick="logar()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 p-3 rounded font-bold">
      ENTRAR
    </button>
    <p id="erro" class="hidden text-red-400 text-sm mt-3">Senha errada!</p>
  </div>
</div>

<!-- SISTEMA -->
<div id="sistema" class="hidden">
  <nav class="bg-[#0f172a] border-b border-cyan-500/20 p-3 flex justify-between">
    <div class="flex items-center gap-2">
      <img src="./LogoTipo.jpg" class="w-8 h-8 rounded bg-black">
      <b class="text-cyan-400 text-sm">RAMOS PRO V2.2</b>
    </div>
    <button onclick="location.reload()" class="text-xs bg-red-500/20 px-3 py-1 rounded">Sair</button>
  </nav>

  <div class="flex">
    <aside class="w-14 md:w-44 bg-[#0f172a] min-h-screen p-2 space-y-1">
      <button onclick="mostrar('dashboard')" class="w-full text-left p-2 rounded bg-blue-600 text-xs">📊 Dash</button>
      <button onclick="mostrar('cadastro')" class="w-full text-left p-2 rounded hover:bg-white/10 text-xs">👤 Cliente</button>
      <button onclick="mostrar('clientes')" class="w-full text-left p-2 rounded hover:bg-white/10 text-xs">📋 Lista</button>
      <button onclick="mostrar('orcamento')" class="w-full text-left p-2 rounded hover:bg-white/10 text-xs">🧾 Orçamento</button>
      <button onclick="mostrar('remoto')" class="w-full text-left p-2 rounded hover:bg-white/10 text-xs">💻 Remoto</button>
    </aside>

    <main class="flex-1 p-4">
      <!-- DASHBOARD -->
      <div id="view-dashboard">
        <div class="grid grid-cols-1 gap-2">
          <div class="bg-[#0f172a] p-3 rounded">Clientes: <span id="totalClientes" class="text-cyan-400 font-bold">0</span></div>
          <div class="bg-[#0f172a] p-3 rounded">Orçamentos: <span id="totalOrc" class="text-green-400 font-bold">0</span></div>
        </div>
      </div>

      <!-- CADASTRO EM COLUNA -->
      <div id="view-cadastro" class="hidden">
        <div class="bg-[#0f172a] p-4 rounded border border-cyan-500/20 max-w-md">
          <h2 class="font-bold text-cyan-400 mb-3">👤 Cadastro em Coluna</h2>

          <div class="flex flex-col gap-3">
            <input id="c_nome" placeholder="Nome / Razão Social *" class="p-3 rounded bg-black border border-white/10">
            <input id="c_cpf" placeholder="CPF ou CNPJ" class="p-3 rounded bg-black border border-white/10">
            <input id="c_zap" placeholder="WhatsApp" class="p-3 rounded bg-black border border-white/10">
            <input id="c_email" placeholder="E-mail" class="p-3 rounded bg-black border border-white/10">
            <input id="c_end" placeholder="Rua, número" class="p-3 rounded bg-black border border-white/10">
            <input id="c_bairro" placeholder="Bairro" class="p-3 rounded bg-black border border-white/10">
            <input id="c_cidade" placeholder="Cidade" class="p-3 rounded bg-black border border-white/10">
            <input id="c_estado" placeholder="Estado (SP)" class="p-3 rounded bg-black border border-white/10">
            <input id="c_cep" placeholder="CEP" class="p-3 rounded bg-black border border-white/10">
            <select id="c_tipo" class="p-3 rounded bg-black border border-white/10">
              <option value="Avulso">Avulso</option>
              <option value="Contrato">Com Contrato</option>
            </select>
            <input id="c_obs" placeholder="Observação" class="p-3 rounded bg-black border border-white/10">
          </div>

          <button onclick="salvarCliente()" class="mt-4 w-full bg-gradient-to-r from-cyan-500 to-blue-600 p-3 rounded font-bold">
            SALVAR CLIENTE
          </button>
        </div>
      </div>

      <div id="view-clientes" class="hidden"><div id="listaClientes"></div></div>
      <div id="view-orcamento" class="hidden"><p>Orçamento aqui - igual antes</p></div>
      <div id="view-remoto" class="hidden"><p>Remoto aqui</p></div>
    </main>
  </div>
</div>

<script>
const SENHA="@Xumone@531973";
function logar(){
  let s=document.getElementById('senha').value.trim();
  if(s===SENHA){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('sistema').classList.remove('hidden');
  } else {
    document.getElementById('erro').classList.remove('hidden');
  }
}
function mostrar(v){
  ['dashboard','cadastro','clientes','orcamento','remoto'].forEach(x=>{
    let el=document.getElementById('view-'+x);
    if(el) el.classList.add('hidden');
  });
  document.getElementById('view-'+v).classList.remove('hidden');
}
let clientes=JSON.parse(localStorage.getItem('ramos_v2')||'[]');
function salvarCliente(){
  let c={
    nome:document.getElementById('c_nome').value,
    cpf:document.getElementById('c_cpf').value,
    zap:document.getElementById('c_zap').value
  };
  if(!c.nome){alert('Digite o nome');return;}
  clientes.push(c);
  localStorage.setItem('ramos_v2',JSON.stringify(clientes));
  alert('Salvo: '+c.nome);
}
</script>
</body>
</html>
