<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMOS V6.2 FINAL - LOGO + ANEXO + COMENTAR + ESPERA + FECHAR</title>
<style>
:root{--bg:#0a1224;--card:#1a2a4a;--cyan:#00d4ff;--pink:#ff2e8a;--green:#00e676;--yellow:#ffca28;--orange:#ff9100}
*{box-sizing:border-box;font-family:Consolas,monospace}
body{margin:0;background:var(--bg);color:#fff}
header{background:#0f1d3a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.logo{font-weight:900;color:var(--cyan)} .badge{padding:3px 8px;border-radius:12px;font-size:11px;margin-left:6px}
.b-emp{background:var(--yellow);color:#000} .b-dono{background:var(--pink);color:#fff}
.robot-bar{background:#0d1a33;padding:10px 16px;display:flex;gap:10px}
.robot-bar input{flex:1;background:#0a1224;border:1px solid #23395d;border-radius:20px;padding:10px 18px;color:#fff;outline:none}
.btn{border:none;border-radius:20px;padding:8px 14px;font-weight:bold;cursor:pointer;font-size:11px}
.btn-save{background:var(--cyan);color:#000;padding:12px 22px;border-radius:12px;font-size:12px}
.tabs{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}
.tab{background:#132040;border:1px solid #223560;color:#9ab0d0;border-radius:20px;padding:8px 14px;cursor:pointer;font-size:12px}
.tab.active{background:#1a3a6a;color:#fff;border-color:var(--cyan)}
.card{background:var(--card);margin:16px;border-radius:16px;padding:18px;border:1px solid #223560}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
label{font-size:10px;color:#7ea0c8;display:block;margin-bottom:4px}
input,textarea,select{width:100%;background:#0a1224;border:1px solid #24385e;border-radius:10px;padding:10px;color:#fff;outline:none}
.list-item{background:#132040;border:1px solid #223560;border-radius:12px;padding:14px 16px;margin:10px 16px}
.tag{font-size:10px;background:#0a1224;border:1px solid #2a4a7a;padding:2px 6px;border-radius:6px;margin-right:4px}
.x{background:#e53935;border:none;color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer}
.login-box{max-width:380px;margin:80px auto;background:#132040;padding:28px;border-radius:16px;border:1px solid #24406c}
.coment{background:#0a1224;border-left:3px solid #00d4ff;padding:8px 10px;margin:6px 0;border-radius:0 8px 8px 0;font-size:11px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ADMIN_PASS={"dono":"@Xu@408671","admin":"@Xumone@197353"};
let clientes=JSON.parse(localStorage.getItem("ramos_clientes_v62")||'[]');
let usuarios=JSON.parse(localStorage.getItem("ramos_usuarios_v62")||'[]');
let chamados=JSON.parse(localStorage.getItem("ramos_chamados_v62")||'[]');
let contratos=JSON.parse(localStorage.getItem("ramos_contratos_v62")||'[]');
let arquivoTemp=null;
if(clientes.length===0) clientes=[{id:"1",nome:"Guaiauna",whats:"(11) 98888-7777",email:"contato@guaiauna.com",estado:"SP",municipio:"SP",contato:"Carlos"}];
if(usuarios.length===0) usuarios=[{id:"u1",empresa:"Guaiauna",login:"teste",senha:"123",tipo:"cliente",nome:"Teste Guaiauna",telefone:"(11)98888-7777",cargo:"Gerente TI"}];
function save(){localStorage.setItem("ramos_clientes_v62",JSON.stringify(clientes));localStorage.setItem("ramos_usuarios_v62",JSON.stringify(usuarios));localStorage.setItem("ramos_chamados_v62",JSON.stringify(chamados));localStorage.setItem("ramos_contratos_v62",JSON.stringify(contratos));}
  function cabecalhoRel(t){const a=new Date().toLocaleString('pt-BR');return `<div style="background:#fff;color:#000;padding:20px;font-family:Arial"><div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #0f1d3a;padding-bottom:14px;margin-bottom:18px"><div style="background:#0f1d3a;color:#00d4ff;width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px">R</div><div><div style="font-weight:900;color:#0f1d3a;font-size:22px">RAMOS INFOTEC</div><div style="font-size:11px">CNPJ 27.030.839/0001-29 • (11) 98888-7777 • CONTATO@RAMOSINFOTEC.COM.BR</div></div><div style="margin-left:auto;text-align:right"><div style="font-weight:bold">${t}</div><div style="font-size:11px">${a}</div></div></div>`;}
function rodapeRel(){return `<div style="margin-top:32px;border-top:1px solid #ccc;padding-top:10px;font-size:9px;color:#888;text-align:center">RAMOS INFOTEC - V6.2 COM LOGO + ANEXO + COMENTARIOS - ${new Date().toLocaleString('pt-BR')}</div></div>`;}
function imprimirRel(t){let c="";if(t==='Chamados'){c=`<h3>Chamados - ${chamados.length} - COM COMENTARIOS E LOGO</h3><table border=1 cellpadding=6 cellspacing=0 style="width:100%;font-size:11px;border-collapse:collapse"><tr style="background:#0f1d3a;color:#fff"><th>#</th><th>Titulo</th><th>Empresa / Telefone</th><th>Aberto por / Cargo / Hora</th><th>Status</th><th>Comentarios</th></tr>`+chamados.map(ch=>`<tr><td>${ch.id}</td><td>${ch.titulo}<br><small>${ch.descricao||''}</small></td><td>${ch.empresa}<br>${ch.telefone}</td><td>${ch.abertoPor}<br>${ch.cargo||''}<br>${ch.dataAbertura}</td><td>${ch.status}</td><td>${(ch.comentarios||[]).map(cm=>`[${cm.data}] ${cm.autor}: ${cm.texto}`).join('<br>')}</td></tr>`).join('')+`</table>`;}else if(t==='Contratos'){c=`<h3>Contratos ${contratos.length} - COM ANEXO ASSINADO + LOGO</h3>`+contratos.map(ct=>`<div>📄 ${ct.titulo} - ${ct.cliente} - 📎 ${ct.arquivo?.nome} - ${ct.valor}</div>`).join('');}else{c=`<h3>Relatorio ${t} - RAMOS INFOTEC COM LOGO</h3>`;}let w=window.open('','_blank');w.document.write(cabecalhoRel('RELATORIO '+t.toUpperCase())+c+rodapeRel());w.document.close();setTimeout(()=>w.print(),600);}
function handleFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=function(e){arquivoTemp={nome:f.name,tipo:f.type,tamanho:f.size,data:e.target.result,dataUpload:new Date().toLocaleString('pt-BR')};document.getElementById('fileInfo').innerHTML=`✅ ${f.name} (${(f.size/1024).toFixed(1)}KB) OK!`;};r.readAsDataURL(f);}
function addContrato(){let t=document.getElementById('ct_tit').value;let cli=document.getElementById('ct_cli').value;if(!t)return alert('Titulo obrigatorio');if(!arquivoTemp)return alert('Anexe o contrato assinado!');let ct={id:Date.now().toString().slice(-8),titulo:t,cliente:cli,valor:document.getElementById('ct_valor').value,venc:document.getElementById('ct_venc').value,descricao:document.getElementById('ct_desc').value,arquivo:arquivoTemp,criadoPor:sess.user,dataCriacao:new Date().toLocaleString('pt-BR'),status:'Assinado'};contratos.push(ct);arquivoTemp=null;save();render();}
function delContrato(id){contratos=contratos.filter(c=>c.id!==id);save();render();}
function baixarContrato(id){let ct=contratos.find(c=>c.id===id);let a=document.createElement('a');a.href=ct.arquivo.data;a.download=ct.arquivo.nome;a.click();}
function verContrato(id){let ct=contratos.find(c=>c.id===id);let w=window.open('','_blank');w.document.write(`<iframe src="${ct.arquivo.data}" style="width:100%;height:100vh;border:none"></iframe>`);}
function addChamado(){let t=document.getElementById('ch_tit').value;if(!t)return alert('Titulo');let d=document.getElementById('ch_desc').value;let cli=document.getElementById('ch_cli')?document.getElementById('ch_cli').value:sess.empresa;let ch={id:Date.now().toString().slice(-6),titulo:t,descricao:d,empresa:cli,abertoPor:sess.nome||sess.user,telefone:sess.telefone||'',cargo:sess.cargo||'',dataAbertura:new Date().toLocaleString('pt-BR'),status:'ABERTO',comentarios:[]};chamados.push(ch);save();render();}
function delChamado(id){chamados=chamados.filter(c=>c.id!==id);save();render();}
function mudarStatus(id,novo){let ch=chamados.find(c=>c.id===id);ch.status=novo;ch.comentarios.push({autor:sess.user,texto:`Status alterado para ${novo}`,data:new Date().toLocaleString('pt-BR')});save();render();}
function comentar(id){let txt=prompt('Digite seu comentario:');if(!txt)return;let ch=chamados.find(c=>c.id===id);ch.comentarios.push({autor:sess.user+(sess.cargo?` (${sess.cargo})`:''),texto:txt,data:new Date().toLocaleString('pt-BR')});save();render();}
function fecharChamado(id){mudarStatus(id,'FECHADO');}
function esperaChamado(id){mudarStatus(id,'ESPERA');}
function reabrirChamado(id){mudarStatus(id,'ABERTO');}
  let sess=JSON.parse(sessionStorage.getItem("sess")||"null");let aba="Chamados";
function loginScreen(){return `<div class=login-box><h2>RAMOS V6.2 FINAL</h2><p style="font-size:10px;text-align:center;color:#8aa0c0">Empresa: ramosinfotec<br>Usuario: dono<br>Senha: @Xu@408671</p><input id="emp" value="ramosinfotec" placeholder="Empresa"><input id="log" value="dono" placeholder="Usuario"><input id="pas" type="password" value="@Xu@408671" placeholder="Senha"><button class=btn style="width:100%;background:#00d4ff;color:#000;padding:12px" onclick="doLogin()">ENTRAR</button></div>`;}
function doLogin(){let e=document.getElementById('emp').value.trim();let l=document.getElementById('log').value.trim();let p=document.getElementById('pas').value.trim();if((l==='dono'&&p===ADMIN_PASS.dono)||(l==='admin'&&p===ADMIN_PASS.admin)){sess={user:l,tipo:'dono',empresa:e||'ramosinfotec',nome:'RAMOS '+l};sessionStorage.setItem('sess',JSON.stringify(sess));render();return;}let u=usuarios.find(x=>x.login.toLowerCase()===l.toLowerCase()&&x.senha===p);if(u){sess={user:u.login,tipo:u.tipo,empresa:u.empresa,nome:u.nome||u.login,telefone:u.telefone,cargo:u.cargo};sessionStorage.setItem('sess',JSON.stringify(sess));render();}else alert('Login invalido');}
function logout(){sessionStorage.removeItem('sess');sess=null;render();}
function render(){const app=document.getElementById('app');if(!sess){app.innerHTML=loginScreen();return;}let isDono=sess.tipo==='dono';let header=`<header><div><span class=logo>RAMOS V6.2 FINAL</span> <span>💼 ${sess.user} (${sess.tipo})</span> <span class="badge b-emp">🟡 ${sess.empresa}</span></div><div><button class="btn" style="background:#e53935;color:#fff" onclick="logout()">SAIR</button></div></header><div style="padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;background:#0d1a33;margin:8px 16px;border-radius:12px"><button class=btn style="background:#fff;color:#000" onclick="imprimirRel('Chamados')">🖨️ Chamados c/ LOGO + COMENTARIOS</button><button class=btn style="background:#fff;color:#000" onclick="imprimirRel('Contratos')">🖨️ Contratos c/ LOGO + ANEXO</button></div>`;header+=`<div class=tabs><div class="tab ${aba==='Chamados'?'active':''}" onclick="aba='Chamados';render()">🎫 Chamados [FECHAR/COMENTAR/ESPERA]</div><div class="tab ${aba==='Contratos'?'active':''}" onclick="aba='Contratos';render()">📄 Contratos + ANEXO ASSINADO</div><div class="tab ${aba==='Clientes'?'active':''}" onclick="aba='Clientes';render()">👥 Clientes</div><div class="tab ${aba==='Usuarios'?'active':''}" onclick="aba='Usuarios';render()">🔐 Usuarios</div></div>`;let body="";if(aba==='Chamados'){let lista=isDono?chamados:chamados.filter(ch=>ch.empresa.toLowerCase()===sess.empresa.toLowerCase());body+=`<div class=card><div style="color:#00d4ff;font-weight:bold">🎫 CHAMADOS - AGORA COM BOTOES FECHAR, ESPERA, COMENTAR + DADOS COMPLETOS DO CLIENTE</div><div><label>TITULO *</label><input id="ch_tit" placeholder="Ex: PC nao liga"></div><div style="margin-top:8px"><label>DESCRICAO</label><textarea id="ch_desc" rows=3></textarea></div>${isDono?`<div style="margin-top:8px" class=grid><div><label>CLIENTE</label><select id="ch_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div></div>`:''}<br><button class=btn-save onclick="addChamado()">ABRIR CHAMADO</button></div>`;lista.slice().reverse().forEach(ch=>{let cli=clientes.find(c=>c.nome===ch.empresa)||{};body+=`<div class=list-item><div style="width:100%"><div style="display:flex;justify-content:space-between"><b>#${ch.id} ${ch.titulo}</b><div><span class=tag>${ch.status}</span></div></div><div style="font-size:12px;color:#cfe">🏢 ${ch.empresa} | 📞 Tel Cliente: ${cli.whats||ch.telefone||''} | ✉️ ${cli.email||''} | 📍 ${cli.municipio||''}/${cli.estado||''}</div><div style="font-size:11px;color:#9ab">👤 Aberto por: ${ch.abertoPor} ${ch.cargo?'('+ch.cargo+')':''} | 📱 ${ch.telefone} | 🕒 Hora Abertura: ${ch.dataAbertura} | 👤 Contato Resp: ${cli.contato||''}</div><div style="font-size:11px;color:#7ea0c8">📝 ${ch.descricao||''}</div>${(ch.comentarios||[]).length?`<div style="margin-top:10px"><b style="font-size:11px;color:#ffca28">💬 Comentarios / Historico:</b>${ch.comentarios.map(cm=>`<div class=coment><b>${cm.autor}</b> <small>${cm.data}</small><br>${cm.texto}</div>`).join('')}</div>`:''}</div><div style="width:100%;display:flex;gap:6px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap"><button class=btn style="background:#00d4ff;color:#000" onclick="comentar('${ch.id}')">💬 COMENTAR</button><button class=btn style="background:#ff9100;color:#000" onclick="esperaChamado('${ch.id}')">⏸️ ESPERA</button><button class=btn style="background:#00e676;color:#000" onclick="fecharChamado('${ch.id}')">✅ FECHAR</button>${ch.status!=='ABERTO'?`<button class=btn style="background:#ffca28;color:#000" onclick="reabrirChamado('${ch.id}')">🔄 REABRIR</button>`:''}<button class=btn style="background:#fff;color:#000" onclick="imprimirRel('Chamados')">🖨️ LOGO</button><button class=x onclick="delChamado('${ch.id}')">×</button></div></div>`;});}
if(aba==='Contratos'){let lista=isDono?contratos:contratos.filter(c=>c.cliente.toLowerCase()===sess.empresa.toLowerCase());body+=`<div class=card><div style="color:#00d4ff">📄 CONTRATOS - COM BOTAO ANEXAR ARQUIVO ASSINADO + LOGO</div><div class=grid><div><label>TITULO *</label><input id="ct_tit"></div><div><label>CLIENTE</label><select id="ct_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><div><label>VALOR</label><input id="ct_valor"></div><div><label>VENC</label><input id="ct_venc" type="date"></div><div><label>DESC</label><input id="ct_desc"></div><div><label>📎 ANEXAR CONTRATO ASSINADO *</label><input type="file" onchange="handleFile(this)"><div id="fileInfo" style="font-size:11px;color:#ffca28">Nenhum arquivo - clique para anexar</div></div></div><br><button class=btn-save onclick="addContrato()">💾 SALVAR COM ANEXO + LOGO</button></div>`;lista.forEach(ct=>{body+=`<div class=list-item><div><b>${ct.titulo}</b> - ${ct.cliente} - 📎 ${ct.arquivo?.nome}</div><div><button class=btn style="background:#00d4ff;color:#000" onclick="verContrato('${ct.id}')">VER</button><button class=btn style="background:#00e676;color:#000" onclick="baixarContrato('${ct.id}')">BAIXAR</button><button class=x onclick="delContrato('${ct.id}')">×</button></div></div>`;});}
if(aba==='Clientes'){body+=`<div class=card><div style="color:#00d4ff">👥 Clientes ${clientes.length} - Completo: telefone, email, estado, municipio, contato, cargo</div><div class=grid><div><label>NOME</label><input id="c_nome"></div><div><label>WHATS</label><input id="c_whats"></div><div><label>EMAIL</label><input id="c_email"></div><div><label>ESTADO</label><input id="c_estado"></div><div><label>MUNICIPIO</label><input id="c_mun"></div><div><label>CONTATO</label><input id="c_contato"></div><div><label>CARGO</label><input id="c_cargo"></div></div><br><button class=btn-save onclick="addCliente()">Salvar Cliente</button></div>`;clientes.forEach(c=>{body+=`<div class=list-item><div><b>${c.nome}</b> | 📞 ${c.whats} | ✉️ ${c.email} | 📍 ${c.municipio}/${c.estado} | 👤 ${c.contato} (${c.cargo||''})</div><button class=x onclick="delCliente('${c.id}')">×</button></div>`;});}
if(aba==='Usuarios'){body+=`<div class=card><div style="color:#00d4ff">🔐 Usuarios - Com cargo, telefone, estado, municipio, email</div><div class=grid><div><label>EMPRESA</label><select id="u_emp">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><div><label>LOGIN</label><input id="u_login"></div><div><label>SENHA</label><input id="u_senha"></div><div><label>NOME COMPLETO</label><input id="u_nome"></div><div><label>CARGO</label><input id="u_cargo"></div><div><label>TEL</label><input id="u_tel"></div></div><br><button class=btn-save onclick="addUsuario()">Criar Usuario</button></div>`;usuarios.forEach(u=>{body+=`<div class=list-item><div>${u.login} - ${u.empresa} - ${u.cargo} - ${u.telefone}</div><button class=x onclick="delUsuario('${u.id}')">×</button></div>`;});}
app.innerHTML=header+body;}
function addCliente(){let c={id:Date.now().toString(),nome:document.getElementById('c_nome').value,whats:document.getElementById('c_whats').value,email:document.getElementById('c_email').value,estado:document.getElementById('c_estado').value,municipio:document.getElementById('c_mun').value,contato:document.getElementById('c_contato').value,cargo:document.getElementById('c_cargo').value};clientes.push(c);save();render();}
function delCliente(id){clientes=clientes.filter(c=>c.id!==id);save();render();}
function addUsuario(){let u={id:Date.now().toString(),empresa:document.getElementById('u_emp').value,login:document.getElementById('u_login').value,senha:document.getElementById('u_senha').value,tipo:'cliente',nome:document.getElementById('u_nome').value,telefone:document.getElementById('u_tel').value,cargo:document.getElementById('u_cargo').value};usuarios.push(u);save();render();}
function delUsuario(id){usuarios=usuarios.filter(u=>u.id!==id);save();render();}
render();
</script>
</body>
</html>
