<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramos Infotec V80.1 FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#0f172a;color:#e2e8f0}
.login-screen{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e3a8a)}
.login-box{background:#1e293b;padding:35px;border-radius:16px;width:390px}
.login-box h1{color:#38bdf8;text-align:center}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white}
button{width:100%;padding:12px;background:#0284c7;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:10px}
.sidebar{width:250px;background:#1e293b;height:100vh;position:fixed;padding:20px}
.menu-item{padding:12px;border-radius:8px;cursor:pointer;margin:5px 0}
.menu-item:hover{background:#334155;color:#38bdf8}
.main{margin-left:250px;padding:30px}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid #334155}
.hidden{display:none!important}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.badge-pendente{background:#f59e0b;color:#000}
.badge-enviado{background:#22c55e;color:#000}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #334155;font-size:13px}
.lead-msg{background:#0f172a;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:12px;border:1px dashed #475569;margin:10px 0}
</style>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>RAMOSINFOTEC</h1>
    <p style="text-align:center;color:#94a3b8;margin:10px 0">Sistema V80.1 FIX - Zap +55 11 97199-5422</p>
    <input id="user" value="ramosinfotec">
    <input id="pass" type="text" value="ramosinfotec">
    <input id="empresa" value="ramosinfotec">
    <button onclick="login()">ENTRAR NO SISTEMA - CLIQUE AQUI</button>
  </div>
</div>
<div id="app" class="hidden">
  <div class="sidebar">
    <h2>RAMOS INFOTEC</h2>
    <div class="menu-item" onclick="showTab('dashboard')">📊 Dashboard</div>
    <div class="menu-item" onclick="showTab('clientes')">👥 Clientes</div>
    <div class="menu-item" onclick="showTab('chamados')">🎫 Chamados</div>
    <div class="menu-item" onclick="showTab('financeiro')">💰 Financeiro</div>
    <div class="menu-item" onclick="showTab('comercial')" style="background:#0284c7;color:white">🤖 Agente Comercial</div>
    <div class="menu-item" onclick="logout()">🚪 Sair</div>
  </div>
  <div class="main">
    <div id="dashboard" class="tab"><h2>Dashboard V80.1 - OK!</h2><div id="totalClientes"></div></div>
    <div id="clientes" class="tab hidden">Clientes aqui</div>
    <div id="chamados" class="tab hidden">Chamados aqui</div>
    <div id="financeiro" class="tab hidden">Financeiro aqui</div>
    <div id="comercial" class="tab hidden">
      <h2>🤖 Agente Comercial - Zap +55 11 97199-5422</h2>
      <div class="card">
        <input id="lead_cidade" value="São Paulo"><select id="lead_tipo"><option>Contabilidade</option><option>Advocacia</option><option>Pet Shop</option><option>Auto Peças</option><option>Lojas</option></select>
        <button onclick="buscarLeads()">Buscar Clientes</button>
        <div id="msgLonga" class="lead-msg"></div>
        <div id="msgCurta" class="lead-msg"></div>
        <table id="tabelaLeads"><tbody></tbody></table>
      </div>
    </div>
  </div>
</div>
<script>
function login(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}
function showTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function logout(){location.reload();}
const ZAP="+55 11 97199-5422";
const msgLongaTxt=`Olá, tudo bem? Aqui é da Ramos Info Tec! 👋\n\nEmpresa [NOME DA EMPRESA] - vimos potencial aí.\n✅ Suporte, Infra, Pentest\nJá reduzimos 70% das paradas de TI.\nDiagnóstico gratuito?\n🌐 ramosinfotec.com.br\n📱 ${ZAP}\n📧 contato@ramosinfotec.com.br\nResponda QUERO ORÇAMENTO\nAlbert Ramos`;
document.getElementById('msgLonga').innerText=msgLongaTxt;
document.getElementById('msgCurta').innerText=`Olá [NOME]! Ramos Info Tec - TI, infra, Pentest. Orçamento sem compromisso? ramosinfotec.com.br | ${ZAP}`;
</script>
</body>
</html>
