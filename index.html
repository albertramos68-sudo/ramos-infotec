<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMOS V7.0 MASTER - 12 ABAS - SEGURA - FINANCEIRO COMPLETO</title>
<style>
:root{--bg:#070f23;--card:#132040;--cyan:#00d4ff;--green:#00e676;--yellow:#ffca28;--orange:#ff9100;--pink:#ff2e8a;--red:#ff3d57}
*{box-sizing:border-box;font-family:Consolas,monospace}
body{margin:0;background:var(--bg);color:#fff}
header{background:#0f1d3a;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.logo{font-weight:900;color:var(--cyan)}
.badge{padding:3px 8px;border-radius:12px;font-size:10px}
.b-emp{background:var(--yellow);color:#000}.b-dono{background:var(--pink);color:#fff}.b-seg{background:#00e67622;border:1px solid var(--green);color:var(--green)}
.tabs{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap;background:#0d1a33;border-bottom:1px solid #1a2a4a}
.tab{background:#132040;border:1px solid #223560;color:#8aa0c0;border-radius:20px;padding:7px 12px;cursor:pointer;font-size:11px;white-space:nowrap}
.tab.active{background:var(--cyan);color:#000;font-weight:bold}
.tab.bol{background:var(--yellow);color:#000;font-weight:bold}
.tab.rel{background:var(--green);color:#000;font-weight:bold}
.card{background:var(--card);margin:12px;border-radius:16px;padding:16px;border:1px solid #1e3a5f}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
label{font-size:9px;color:#7ea0c8;display:block;margin-bottom:3px;text-transform:uppercase}
input,textarea,select{width:100%;background:#070f23;border:1px solid #24385e;border-radius:10px;padding:10px;color:#fff;outline:none;font-size:12px}
.list-item{background:#0f1d3a;border:1px solid #223560;border-radius:12px;padding:12px 14px;margin:8px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.btn{border:none;border-radius:10px;padding:8px 14px;font-weight:bold;cursor:pointer;font-size:11px}
.btn-cyan{background:var(--cyan);color:#000}.btn-green{background:var(--green);color:#000}.btn-yellow{background:var(--yellow);color:#000}.btn-orange{background:var(--orange);color:#000}.btn-red{background:var(--red);color:#fff}.btn-white{background:#fff;color:#000}
.btn-save{background:var(--cyan);color:#000;padding:12px 22px;border-radius:12px;font-size:12px;font-weight:900}
.login-box{max-width:380px;margin:50px auto;background:#132040;padding:28px;border-radius:20px;border:1px solid #24406c}
.coment{background:#070f23;border-left:3px solid var(--cyan);padding:6px 10px;margin:5px 0;border-radius:0 8px 8px 0;font-size:11px}
.tag{font-size:10px;background:#070f23;border:1px solid #2a4a7a;padding:2px 6px;border-radius:6px}
.x{background:var(--red);border:none;color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ADMINS={"admin":"@Xumone@197353","dono":"@Xu@408671"};
let clientes=JSON.parse(localStorage.getItem("ramos_clientes_v7")||'[]');
let usuarios=JSON.parse(localStorage.getItem("ramos_usuarios_v7")||'[]');
let chamados=JSON.parse(localStorage.getItem("ramos_chamados_v7")||'[]');
let contratos=JSON.parse(localStorage.getItem("ramos_contratos_v7")||'[]');
let notas=JSON.parse(localStorage.getItem("ramos_notas_v7")||'[]');
let boletos=JSON.parse(localStorage.getItem("ramos_boletos_v7")||'[]');
let orcamentos=JSON.parse(localStorage.getItem("ramos_orcamentos_v7")||'[]');
let remotos=JSON.parse(localStorage.getItem("ramos_remotos_v7")||'[]');
let financeiro=JSON.parse(localStorage.getItem("ramos_financeiro_v7")||'[]');
let pessoal=JSON.parse(localStorage.getItem("ramos_pessoal_v7")||'[]');
let arquivoTemp=null;
if(clientes.length===0){
 clientes=[{id:"1",nome:"Simone Gome Ramos",whats:"(11) 98888-7777",email:"simone@email.com",estado:"SP",municipio:"Sao Paulo",contato:"Simone",cargo:"Cliente",cpf:"00.000.000/0001-91"},{id:"2",nome:"Guaiauna",whats:"(11) 97777-6666",email:"guaiauna@ex.com",estado:"SP",municipio:"SP",contato:"Carlos",cargo:"Gerente"}];
 usuarios=[{id:"u1",empresa:"Guaiauna",login:"teste",senha:"123",tipo:"cliente",nome:"Teste",telefone:"(11)98888-7777",cargo:"TI"}];
 chamados=[{id:"1001",titulo:"Ex: PC nao liga",descricao:"PC nao inicia",empresa:"Simone Gome Ramos",abertoPor:"admin",cargo:"ADMIN",dataAbertura:new Date().toLocaleString('pt-BR'),status:"ABERTO",prioridade:"Baixa",categoria:"Suporte Tecnico",comentarios:[]}];
 financeiro=[{id:"f1",cliente:"Simone Gome Ramos",desc:"Mensalidade",tipo:"entrada",valor:"1500",vencimento:"2026-10-10",pagamento:"2026-10-09",acrescimo:"0",multa:"0",valorTotal:"1500",valorPago:"1500",status:"Pago"}];
}
  function save(){localStorage.setItem("ramos_clientes_v7",JSON.stringify(clientes));localStorage.setItem("ramos_usuarios_v7",JSON.stringify(usuarios));localStorage.setItem("ramos_chamados_v7",JSON.stringify(chamados));localStorage.setItem("ramos_contratos_v7",JSON.stringify(contratos));localStorage.setItem("ramos_notas_v7",JSON.stringify(notas));localStorage.setItem("ramos_boletos_v7",JSON.stringify(boletos));localStorage.setItem("ramos_orcamentos_v7",JSON.stringify(orcamentos));localStorage.setItem("ramos_remotos_v7",JSON.stringify(remotos));localStorage.setItem("ramos_financeiro_v7",JSON.stringify(financeiro));localStorage.setItem("ramos_pessoal_v7",JSON.stringify(pessoal));}
function cabecalho(t){return `<div style="background:#fff;color:#000;padding:20px;font-family:Arial"><div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #0f1d3a;padding-bottom:14px;margin-bottom:18px"><div style="background:#0f1d3a;color:#00d4ff;width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px">R</div><div><div style="font-weight:900;color:#0f1d3a;font-size:22px">RAMOS INFOTEC</div><div style="font-size:11px">CNPJ 45.114.523/0001-05 - V7 MASTER SEGURA</div></div><div style="margin-left:auto;text-align:right"><div style="font-weight:bold">${t}</div><div style="font-size:11px">${new Date().toLocaleString('pt-BR')}</div></div></div>`;}
function rodape(){return `<div style="margin-top:32px;border-top:1px solid #ccc;padding-top:10px;font-size:9px;color:#888;text-align:center">RAMOS V7.0 MASTER - ${new Date().toLocaleString('pt-BR')}</div></div>`;}
function imprimir(t){let c="";if(t==='Financeiro'){c=`<h3>Financeiro Completo - ${financeiro.length}</h3><table border=1 cellpadding=5 style="width:100%;font-size:10px;border-collapse:collapse"><tr style="background:#0f1d3a;color:#fff"><th>Cliente</th><th>Desc</th><th>Tipo</th><th>Valor</th><th>Vencimento</th><th>Pagamento</th><th>Acrescimo</th><th>Multa</th><th>Total</th><th>Total Pago</th><th>Status</th></tr>`+financeiro.map(f=>`<tr><td>${f.cliente}</td><td>${f.desc}</td><td>${f.tipo}</td><td>R$ ${f.valor}</td><td>${f.vencimento}</td><td>${f.pagamento}</td><td>R$ ${f.acrescimo}</td><td>R$ ${f.multa}</td><td>R$ ${f.valorTotal}</td><td>R$ ${f.valorPago}</td><td>${f.status}</td></tr>`).join('')+`</table>`;}else if(t==='Chamados'){c=`<h3>Chamados ${chamados.length}</h3><table border=1 cellpadding=5 style="width:100%;font-size:10px;border-collapse:collapse"><tr style="background:#0f1d3a;color:#fff"><th>#</th><th>Titulo</th><th>Empresa</th><th>Aberto por</th><th>Data/Hora</th><th>Status</th><th>Comentarios</th></tr>`+chamados.map(ch=>`<tr><td>${ch.id}</td><td>${ch.titulo}</td><td>${ch.empresa}</td><td>${ch.abertoPor}</td><td>${ch.dataAbertura}</td><td>${ch.status}</td><td>${(ch.comentarios||[]).map(x=>x.texto).join('; ')}</td></tr>`).join('')+`</table>`;}else c=`<h3>Relatorio ${t}</h3>`;let w=window.open('','_blank');w.document.write(cabecalho(t)+c+rodape());w.document.close();setTimeout(()=>w.print(),600);}
function handleFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{arquivoTemp={nome:f.name,data:e.target.result};document.getElementById('fileInfo').innerHTML=`OK ${f.name}`;};r.readAsDataURL(f);}
function addChamado(){let t=document.getElementById('ch_tit').value;if(!t)return alert('Titulo');let ch={id:Date.now().toString().slice(-5),titulo:t,prioridade:document.getElementById('ch_pri').value,categoria:document.getElementById('ch_cat').value,descricao:document.getElementById('ch_desc').value,empresa:document.getElementById('ch_cli')?.value||sess.empresa,abertoPor:sess.user,cargo:sess.cargo||'ADMIN',dataAbertura:new Date().toLocaleString('pt-BR'),status:'ABERTO',comentarios:[]};chamados.push(ch);save();render();}
function mudarStatus(id,s){let ch=chamados.find(c=>c.id===id);ch.status=s;ch.comentarios.push({autor:sess.user,texto:`Status -> ${s}`,data:new Date().toLocaleString('pt-BR')});save();render();}
function comentar(id){let txt=prompt('Comentario:');if(!txt)return;let ch=chamados.find(c=>c.id===id);ch.comentarios.push({autor:sess.user,texto:txt,data:new Date().toLocaleString('pt-BR')});save();render();}
function delChamado(id){chamados=chamados.filter(c=>c.id!==id);save();render();}
function addFinanceiro(){let v=parseFloat(document.getElementById('f_val').value)||0;let ac=parseFloat(document.getElementById('f_acre').value)||0;let mu=parseFloat(document.getElementById('f_multa').value)||0;let total=v+ac+mu;let f={id:Date.now().toString(),cliente:document.getElementById('f_cli').value,desc:document.getElementById('f_desc').value,tipo:document.getElementById('f_tipo').value,valor:document.getElementById('f_val').value,vencimento:document.getElementById('f_venc').value,pagamento:document.getElementById('f_pag').value,acrescimo:document.getElementById('f_acre').value,multa:document.getElementById('f_multa').value,valorTotal:document.getElementById('f_total').value||total.toString(),valorPago:document.getElementById('f_pago').value,status:document.getElementById('f_status').value};financeiro.push(f);save();render();}
function calcTotal(){let v=parseFloat(document.getElementById('f_val').value)||0;let ac=parseFloat(document.getElementById('f_acre').value)||0;let mu=parseFloat(document.getElementById('f_multa').value)||0;document.getElementById('f_total').value=(v+ac+mu).toFixed(2);}
function delFinanceiro(id){financeiro=financeiro.filter(f=>f.id!==id);save();render();}
function addCliente(){let c={id:Date.now().toString(),nome:document.getElementById('c_nome').value,whats:document.getElementById('c_whats').value,email:document.getElementById('c_email').value,estado:document.getElementById('c_est').value,municipio:document.getElementById('c_mun').value,contato:document.getElementById('c_cont').value,cargo:document.getElementById('c_cargo').value,cpf:document.getElementById('c_cpf').value};clientes.push(c);save();render();}
function delCliente(id){clientes=clientes.filter(c=>c.id!==id);save();render();}
function addUsuario(){let u={id:Date.now().toString(),empresa:document.getElementById('u_emp').value,login:document.getElementById('u_log').value,senha:document.getElementById('u_sen').value,nome:document.getElementById('u_nome').value,cargo:document.getElementById('u_cargo').value,telefone:document.getElementById('u_tel').value,tipo:'cliente'};usuarios.push(u);save();render();}
function delUsuario(id){usuarios=usuarios.filter(u=>u.id!==id);save();render();}
  function addNota(){let n={id:Date.now().toString(),cliente:document.getElementById('n_cli').value,valor:document.getElementById('n_val').value,data:document.getElementById('n_data').value,desc:document.getElementById('n_desc').value,forma:document.getElementById('n_forma').value};notas.push(n);save();render();}
function delNota(id){notas=notas.filter(n=>n.id!==id);save();render();}
function addBoleto(){let b={id:Date.now().toString(),cliente:document.getElementById('b_cli').value,valor:document.getElementById('b_val').value};boletos.push(b);save();render();}
function addOrc(){let o={id:Date.now().toString(),cliente:document.getElementById('o_cli').value,servico:document.getElementById('o_serv').value,visita:document.getElementById('o_vis').value,trabalho:document.getElementById('o_trab').value,total:document.getElementById('o_total').value};orcamentos.push(o);save();render();}
function addRemoto(){let r={id:Date.now().toString(),cliente:document.getElementById('r_cli').value,idRem:document.getElementById('r_id').value,senha:document.getElementById('r_senha').value};remotos.push(r);save();render();}
function addContrato(){let t=document.getElementById('ct_tit').value;if(!t)return alert('Titulo');let ct={id:Date.now().toString().slice(-5),titulo:t,cliente:document.getElementById('ct_cli').value,valor:document.getElementById('ct_val').value,arquivo:arquivoTemp};contratos.push(ct);arquivoTemp=null;save();render();}
function addPessoal(){let p={id:Date.now().toString(),nome:document.getElementById('p_nome').value,cargo:document.getElementById('p_cargo').value,tel:document.getElementById('p_tel').value,sal:document.getElementById('p_sal').value};pessoal.push(p);save();render();}
let sess=JSON.parse(sessionStorage.getItem("sess_v7")||"null");
let aba="Dashboard";
function loginScreen(){return `<div class=login-box><h2 style="text-align:center;color:#fff;margin:0">RAMOS INFOTEC</h2><p style="text-align:center;color:#7ea0c8;font-size:11px">CNPJ 45.114.523/0001-05</p><p style="text-align:center;color:var(--cyan);font-size:12px;font-weight:bold;margin:0 0 18px">V7.0 MASTER - SEGURA + 12 ABAS</p><label>Usuario</label><input id="log" placeholder="admin ou dono"><label>Senha</label><input id="pas" type="password" placeholder="••••••••"><button class=btn style="width:100%;background:var(--cyan);color:#000;padding:13px;font-weight:900;margin-top:10px" onclick="doLogin()">ENTRAR</button><div style="background:#00e67611;border:1px solid #00e67633;color:#00e676;padding:8px;border-radius:8px;font-size:9px;text-align:center;margin-top:14px">🔒 V7 SEGURA - Senhas NAO aparecem na tela</div></div>`;}
function doLogin(){let l=document.getElementById('log').value.trim().toLowerCase();let p=document.getElementById('pas').value;if(ADMINS[l]&&ADMINS[l]===p){sess={user:l,tipo:'dono',empresa:'ramosinfotec',nome:l.toUpperCase(),cargo:'ADMIN'};sessionStorage.setItem('sess_v7',JSON.stringify(sess));render();return;}let u=usuarios.find(x=>x.login.toLowerCase()===l&&x.senha===p);if(u){sess={user:u.login,tipo:u.tipo,empresa:u.empresa,nome:u.nome,cargo:u.cargo};sessionStorage.setItem('sess_v7',JSON.stringify(sess));render();}else alert('Usuario ou senha invalidos');}
function logout(){sessionStorage.removeItem('sess_v7');sess=null;render();}
function render(){
 const app=document.getElementById('app');
 if(!sess){app.innerHTML=loginScreen();return;}
 let header=`<header><div><span class=logo>RAMOS INFOTEC</span> <span style="font-size:11px"> 👤 ${sess.user} (${sess.tipo})</span> <span class="badge b-emp">🟡 ${sess.empresa}</span> <span class="badge b-dono">💎 ${aba}</span> <span class="badge b-seg">🔒 V7 SEGURA</span></div><div style="display:flex;gap:6px"><button class="btn btn-white" onclick="imprimir(aba)">🖨️ ${aba} c/ LOGO</button><button class="btn btn-red" onclick="logout()">SAIR</button></div></header>`;
 header+=`<div class=tabs>
  <div class="tab ${aba==='Dashboard'?'active':''}" onclick="aba='Dashboard';render()">📊 Dashboard</div>
  <div class="tab ${aba==='Clientes'?'active':''}" onclick="aba='Clientes';render()">👥 Clientes</div>
  <div class="tab ${aba==='Notas'?'active':''}" onclick="aba='Notas';render()">📝 Notas</div>
  <div class="tab bol ${aba==='Boletos'?'active':''}" onclick="aba='Boletos';render()">🧾 Boletos PIX</div>
  <div class="tab ${aba==='Chamados'?'active':''}" onclick="aba='Chamados';render()">🎫 Chamados [FECHAR/COMENTAR]</div>
  <div class="tab rel ${aba==='Relatorios'?'active':''}" onclick="aba='Relatorios';render()">📊 Relatorios</div>
  <div class="tab ${aba==='Usuarios'?'active':''}" onclick="aba='Usuarios';render()">🔐 Usuarios</div>
  <div class="tab ${aba==='Contratos'?'active':''}" onclick="aba='Contratos';render()">📄 Contratos+ANEXO</div>
  <div class="tab ${aba==='Orcamentos'?'active':''}" onclick="aba='Orcamentos';render()">💰 Orcamentos</div>
  <div class="tab ${aba==='Remoto'?'active':''}" onclick="aba='Remoto';render()">💻 Remoto</div>
  <div class="tab ${aba==='Financeiro'?'active':''}" onclick="aba='Financeiro';render()">💵 Financeiro COMPLETO</div>
  <div class="tab ${aba==='Pessoal'?'active':''}" onclick="aba='Pessoal';render()">👷 Pessoal</div>
 </div>`;
 let body="";
 if(aba==='Dashboard'){let totalFin=financeiro.reduce((s,f)=>s+(parseFloat(f.valorTotal)||parseFloat(f.valor)||0),0);body+=`<div class=grid><div class=card><div style="color:var(--cyan)">🎫 Chamados</div><div style="font-size:26px;font-weight:900">${chamados.length}</div></div><div class=card><div style="color:var(--yellow)">👥 Clientes</div><div style="font-size:26px;font-weight:900">${clientes.length}</div></div><div class=card><div style="color:var(--green)">💰 Financeiro</div><div style="font-size:20px;font-weight:900">R$ ${totalFin.toFixed(2)}</div></div></div><div class=card><b style="color:var(--green)">✅ V7.0 MASTER - JUNTA TUDO:</b><div style="font-size:11px;line-height:1.8;margin-top:8px">✅ Login seguro sem senha na tela (seu pedido)<br>✅ Financeiro completo: vencimento, pagamento, acrescimo, multa, total, total pago (seu pedido docx)<br>✅ 12 abas da V4.9.8<br>✅ Botoes FECHAR / ESPERA / COMENTAR / REABRIR<br>✅ LOGO em todos relatorios + Anexo contrato</div></div>`;}
 if(aba==='Chamados'){let lista=sess.tipo==='dono'?chamados:chamados.filter(c=>c.empresa.toLowerCase()===sess.empresa.toLowerCase());body+=`<div class=card><div style="color:var(--cyan);font-weight:bold">🎫 Chamados - COM BOTOES FECHAR/COMENTAR/ESPERA</div><div class=grid><div><label>TITULO *</label><input id="ch_tit" placeholder="Ex: PC nao liga"></div><div><label>PRIORIDADE</label><select id="ch_pri"><option>Baixa</option><option>Média</option><option>Alta</option></select></div><div><label>CATEGORIA</label><select id="ch_cat"><option>Suporte Tecnico</option><option>Visita</option></select></div></div><div style="margin-top:8px"><label>DESCRICAO</label><textarea id="ch_desc" rows=3></textarea></div><div style="margin-top:8px"><label>CLIENTE</label><select id="ch_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><br><button class=btn-save onclick="addChamado()">ABRIR CHAMADO</button></div>`;lista.slice().reverse().forEach(ch=>{body+=`<div class=list-item><div style="flex:1"><b>#${ch.id} ${ch.titulo}</b> <span class=tag>${ch.status}</span><div style="font-size:11px;color:#9ab">🏢 ${ch.empresa} | 👤 ${ch.abertoPor} | 🕒 ${ch.dataAbertura}</div>${(ch.comentarios||[]).length?`<div>${ch.comentarios.map(cm=>`<div class=coment><b>${cm.autor}</b>: ${cm.texto}</div>`).join('')}</div>`:''}</div><div style="display:flex;gap:5px"><button class="btn btn-cyan" onclick="comentar('${ch.id}')">💬 COMENTAR</button><button class="btn btn-orange" onclick="mudarStatus('${ch.id}','ESPERA')">⏸️ ESPERA</button><button class="btn btn-green" onclick="mudarStatus('${ch.id}','FECHADO')">✅ FECHAR</button><button class="btn btn-yellow" onclick="mudarStatus('${ch.id}','ABERTO')">🔄 REABRIR</button><button class=x onclick="delChamado('${ch.id}')">×</button></div></div>`;});}
   if(aba==='Financeiro'){body+=`<div class=card style="border-color:var(--green)"><div style="color:var(--green);font-weight:bold">💵 Financeiro COMPLETO - COM VENCIMENTO, PAGAMENTO, ACRESCIMO, MULTA, TOTAL, TOTAL PAGO</div><div class=grid><div><label>CLIENTE *</label><select id="f_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><div><label>TIPO</label><select id="f_tipo"><option>entrada</option><option>saida</option></select></div><div><label>DESCRICAO</label><input id="f_desc"></div><div><label>VALOR R$ *</label><input id="f_val" type="number" oninput="calcTotal()"></div><div><label>DATA VENCIMENTO *</label><input id="f_venc" type="date"></div><div><label>DATA PAGAMENTO</label><input id="f_pag" type="date"></div><div><label>VALOR ACRESCIMO</label><input id="f_acre" type="number" oninput="calcTotal()"></div><div><label>VALOR MULTA</label><input id="f_multa" type="number" oninput="calcTotal()"></div><div><label>VALOR TOTAL (auto)</label><input id="f_total" type="number"></div><div><label>VALOR TOTAL PAGO</label><input id="f_pago" type="number"></div><div><label>STATUS</label><select id="f_status"><option>Pago</option><option>Pendente</option><option>Atrasado</option></select></div></div><br><button class=btn-save onclick="addFinanceiro()">💾 SALVAR FINANCEIRO COMPLETO</button> <button class="btn btn-white" onclick="imprimir('Financeiro')">🖨️ Relatorio c/ LOGO</button></div>`;financeiro.slice().reverse().forEach(f=>{body+=`<div class=list-item><div><b>R$ ${f.valorTotal||f.valor}</b> - ${f.desc} - ${f.cliente}<br><span style="font-size:10px">Venc: ${f.vencimento} | Pag: ${f.pagamento} | Acre: ${f.acrescimo} | Multa: ${f.multa} | Total: ${f.valorTotal} | Pago: ${f.valorPago}</span></div><button class=x onclick="delFinanceiro('${f.id}')">×</button></div>`;});}
 if(aba==='Clientes'){body+=`<div class=card><div style="color:var(--cyan)">👥 Clientes</div><div class=grid><div><label>NOME *</label><input id="c_nome"></div><div><label>WHATS</label><input id="c_whats"></div><div><label>EMAIL</label><input id="c_email"></div><div><label>CPF/CNPJ</label><input id="c_cpf"></div><div><label>ESTADO</label><input id="c_est"></div><div><label>MUNICIPIO</label><input id="c_mun"></div><div><label>CONTATO</label><input id="c_cont"></div><div><label>CARGO</label><input id="c_cargo"></div></div><br><button class=btn-save onclick="addCliente()">Salvar Cliente</button></div>`;clientes.forEach(c=>{body+=`<div class=list-item><div><b>${c.nome}</b> | ${c.whats} | ${c.email}</div><button class=x onclick="delCliente('${c.id}')">×</button></div>`;});}
 if(aba==='Notas'){body+=`<div class=card><div style="color:var(--cyan)">📝 Notas / Recibo</div><div class=grid><div><label>CLIENTE *</label><select id="n_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><div><label>VALOR R$ *</label><input id="n_val"></div><div><label>DATA</label><input id="n_data" type="date"></div></div><div class=grid2 style="margin-top:8px"><div><label>DESCRICAO</label><textarea id="n_desc"></textarea></div><div><label>FORMA</label><select id="n_forma"><option>PIX</option><option>Dinheiro</option></select></div></div><br><button class=btn-save onclick="addNota()">SALVAR NOTA</button></div>`;}
 if(aba==='Boletos'){body+=`<div class=card><div style="color:var(--yellow)">🧾 Boleto Bradesco 237 + PIX</div><div class=grid><div><label>CLIENTE</label><select id="b_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><div><label>VALOR</label><input id="b_val"></div></div><br><button class=btn-save onclick="addBoleto()">SALVAR BOLETO</button></div>`;}
 if(aba==='Orcamentos'){body+=`<div class=card><div>💰 Orcamentos</div><div><label>CLIENTE</label><select id="o_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><div class=grid2 style="margin-top:8px"><div><label>SERVICO</label><input id="o_serv"></div><div><label>VISITA</label><input id="o_vis"></div></div><div class=grid2><div><label>TRABALHO</label><input id="o_trab"></div><div><label>TOTAL</label><input id="o_total"></div></div><br><button class=btn-save onclick="addOrc()">GERAR ORCAMENTO</button></div>`;}
 if(aba==='Remoto'){body+=`<div class=card><div>💻 Remoto</div><div class=grid><div><label>CLIENTE</label><select id="r_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><div><label>ID</label><input id="r_id"></div><div><label>SENHA</label><input id="r_senha"></div></div><br><button class=btn-save onclick="addRemoto()">SALVAR</button></div>`;}
 if(aba==='Relatorios'){body+=`<div class=card><div style="color:var(--cyan)">📊 Relatorios - Sintetico / Analitico / Por Usuario</div><div class=grid style="margin-top:10px"><div><label>DATA INICIO</label><input type="date"></div><div><label>DATA FIM</label><input type="date"></div><div><label>STATUS</label><select><option>Todos</option><option>ABERTO</option><option>FECHADO</option></select></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-cyan" onclick="imprimir('Chamados')">SINTETICO</button><button class="btn btn-green" onclick="imprimir('Financeiro')">FINANCEIRO COMPLETO</button></div></div>`;}
 if(aba==='Usuarios'){body+=`<div class=card><div>🔐 Usuarios - Senha oculta</div><div class=grid><div><label>EMPRESA</label><select id="u_emp">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><div><label>LOGIN</label><input id="u_log"></div><div><label>SENHA</label><input id="u_sen" type="password"></div><div><label>NOME</label><input id="u_nome"></div><div><label>CARGO</label><input id="u_cargo"></div><div><label>TEL</label><input id="u_tel"></div></div><br><button class=btn-save onclick="addUsuario()">Criar Usuario Seguro</button></div>`;usuarios.forEach(u=>{body+=`<div class=list-item><div>${u.login} - ${u.empresa} - ••••••</div><button class=x onclick="delUsuario('${u.id}')">×</button></div>`;});}
 if(aba==='Contratos'){body+=`<div class=card><div>📄 Contratos + ANEXO</div><div class=grid><div><label>TITULO *</label><input id="ct_tit"></div><div><label>CLIENTE</label><select id="ct_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><div><label>VALOR</label><input id="ct_val"></div><div><label>ANEXAR</label><input type="file" onchange="handleFile(this)"><div id="fileInfo">Nenhum</div></div></div><br><button class=btn-save onclick="addContrato()">Salvar com Anexo</button></div>`;}
 if(aba==='Pessoal'){body+=`<div class=card><div>👷 Pessoal</div><div class=grid><div><label>NOME</label><input id="p_nome"></div><div><label>CARGO</label><input id="p_cargo"></div><div><label>TEL</label><input id="p_tel"></div><div><label>SALARIO</label><input id="p_sal"></div></div><br><button class=btn-save onclick="addPessoal()">Salvar</button></div>`;}
 app.innerHTML=header+body;
}
render();
</script>
</body>
</html>
