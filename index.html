<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramos Info Tec - V79.7 BACANA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#020617;color:#e2e8f0}
header{background:#0f172a;padding:12px;display:flex;justify-content:space-between;flex-wrap:wrap;position:sticky;top:0;z-index:9}
nav{display:flex;gap:5px;flex-wrap:wrap}nav button{background:#1e293b;color:#cbd5e1;padding:7px 11px;border-radius:8px;border:1px solid #334155;cursor:pointer}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin:12px}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}
.btn{padding:9px 13px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}
.btn-p{background:#3b82f6;color:#fff}.btn-d{background:#ef4444;color:#fff}.btn-s{background:#334155;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid #334155;font-size:12px;text-align:left}
.hidden{display:none}.search{margin-bottom:10px;background:#020617}
#loginPage{max-width:420px;margin:60px auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.badge{padding:3px 7px;border-radius:6px;font-size:11px}.ok{background:#16a34a}.warn{background:#eab308;color:#000}.err{background:#ef4444}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#020617;padding:10px;border-radius:8px;margin:8px 0;border:1px solid #334155}
.perm-grid label{display:flex;align-items:center;gap:6px;background:#1e293b;padding:8px;border-radius:6px;cursor:pointer;color:#e2e8f0;font-size:13px}
.perm-grid input{width:auto;margin:0}
.input-wrap{position:relative}
.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#0f172a;border:1px solid #334155;transition:.2s}
.eye-btn:hover{background:#1e293b;border-color:#3b82f6}
</style>
</head>
<body>
<div id="loginPage" class="card">
<h2 style="text-align:center;margin:0 0 16px 0">Ramos Info Tec V79.7 BACANA</h2>
<input id="emp" placeholder="Empresa" autocomplete="off">
<input id="log" placeholder="Usuário" autocomplete="off">
<div class="input-wrap">
<input id="sen" type="password" placeholder="Senha" autocomplete="new-password" style="padding-right:50px">
<div class="eye-btn" onclick="toggleOlhoPremium()" id="btnOlho">
<svg id="icoOlho" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8-11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
</div>
</div>
<button class="btn btn-p" style="width:100%;margin-top:14px;padding:12px;font-size:15px" onclick="fazerLogin()">Entrar</button>
<p id="erro" style="color:#fb7185;margin-top:10px;text-align:center"></p>
</div>
<div id="app" class="hidden">
<header><b id="userInfo"></b><nav id="menu"></nav><button class="btn btn-d" onclick="sair()">Sair</button></header>
<div id="view-dashboard" class="card view"><h2>📊 Dashboard</h2><div id="dashInfo"></div></div>
<div id="view-cadastro" class="card view hidden"><h2>👥 Cadastro de Clientes</h2><input id="buscaCad" class="search" placeholder="🔍 Buscar..." oninput="renderCad()"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="c-empresa" placeholder="Empresa"><input id="c-doc" placeholder="CPF/CNPJ"><input id="c-email" placeholder="Email"><input id="c-cep" placeholder="CEP" onblur="buscarCEP()"><input id="c-end" placeholder="Endereço"><input id="c-num" placeholder="Número"><input id="c-cidade" placeholder="Cidade"><input id="c-estado" placeholder="Estado"><input id="c-bairro" placeholder="Bairro"><input id="c-tel" placeholder="Telefone"><input id="c-contato" placeholder="Contato"><select id="c-contrato"><option>Contrato</option><option>Mensal</option><option>Avulso</option><option>Sem Contrato</option></select></div><button class="btn btn-p" onclick="salvarCad()">💾 Salvar</button><table id="tabCad"></table></div>
<div id="view-estoque" class="card view hidden"><h2>📦 Estoque</h2><input id="buscaEst" class="search" placeholder="🔍 Buscar..." oninput="renderEst()"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="e-nome" placeholder="Produto"><input id="e-qtd" type="number" placeholder="Qtd"><input id="e-valor" type="number" placeholder="Valor"><input id="e-min" type="number" placeholder="Mínimo"></div><button class="btn btn-p" onclick="salvarEst()">Salvar</button><table id="tabEst"></table></div>
<div id="view-chamado-abertura" class="card view hidden"><h2>🎫 Meu Chamado</h2><input id="ch-titulo" placeholder="Título"><textarea id="ch-desc" placeholder="Descrição"></textarea><button class="btn btn-p" onclick="abrirChamado()">Abrir</button><table id="tabMeusChamados"></table><div id="detMeuCh" class="card hidden" style="background:#020617"></div></div>
<div id="view-chamado" class="card view hidden"><h2>🛠️ Chamados</h2><input id="buscaCh" class="search" placeholder="🔍 Buscar..." oninput="renderChamados()"><table id="tabCh"></table><div id="detCh" class="card hidden" style="background:#020617"></div></div>
<div id="view-os" class="card view hidden"><h2>📋 OS</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="os-cliente"></select><input id="os-serv" placeholder="Serviço"><input id="os-valor" type="number" placeholder="Valor"></div><button class="btn btn-p" onclick="salvarOS()">Salvar OS</button><table id="tabOS"></table></div>
<div id="view-financeiro" class="card view hidden"><h2>💰 Financeiro</h2><input id="buscaFin" class="search" placeholder="🔍 Buscar..." oninput="renderFin()"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="f-nome" placeholder="Nome Boleto"><input id="f-forn" placeholder="Fornecedor"><input id="f-doc" placeholder="Documento"><select id="f-tipo"><option>Despesa</option><option>Receita</option></select><div><label>Emissão</label><input id="f-emissao" type="date"></div><div><label>Vencimento</label><input id="f-venc" type="date"></div><div><label>Pagamento</label><input id="f-pag" type="date"></div><input id="f-valor" type="number" placeholder="Valor" oninput="calcTotal()"><input id="f-desc" type="number" placeholder="Desconto" oninput="calcTotal()"><input id="f-multa" type="number" placeholder="Multa" oninput="calcTotal()"><input id="f-juros" type="number" placeholder="Juros" oninput="calcTotal()"><input id="f-total" type="number" placeholder="Total Pago" readonly style="background:#16a34a;color:#fff;font-weight:bold"><select id="f-forma"><option>PIX</option><option>Boleto</option><option>Cartão</option><option>Dinheiro</option><option>Transferência</option></select><select id="f-status"><option>Pendente</option><option>Pago</option><option>Atrasado</option><option>Cancelado</option></select><input id="f-obs" placeholder="Observações"></div><button class="btn btn-p" onclick="salvarFin()">Salvar Conta</button><table id="tabFin"></table></div>
<div id="view-meufinanceiro" class="card view hidden"><h2>🔐 Meu Financeiro</h2><input id="buscaMeuFin" class="search" placeholder="🔍 Buscar..." oninput="renderMeuFin()"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="mf-nome" placeholder="Nome"><input id="mf-forn" placeholder="Fornecedor"><input id="mf-doc" placeholder="Documento"><select id="mf-tipo"><option>Despesa</option><option>Receita</option></select><div><label>Emissão</label><input id="mf-emissao" type="date"></div><div><label>Venc</label><input id="mf-venc" type="date"></div><div><label>Pag</label><input id="mf-pag" type="date"></div><input id="mf-valor" type="number" placeholder="Valor" oninput="calcTotalMeu()"><input id="mf-desc" type="number" placeholder="Desconto" oninput="calcTotalMeu()"><input id="mf-multa" type="number" placeholder="Multa" oninput="calcTotalMeu()"><input id="mf-juros" type="number" placeholder="Juros" oninput="calcTotalMeu()"><input id="mf-total" type="number" placeholder="Total" readonly style="background:#f59e0b;color:#000;font-weight:bold"><select id="mf-forma"><option>PIX</option><option>Boleto</option><option>Cartão</option><option>Dinheiro</option><option>Transferência</option></select><select id="mf-status"><option>Pendente</option><option>Pago</option><option>Atrasado</option></select><input id="mf-obs" placeholder="Obs"></div><button class="btn btn-p" onclick="salvarMeuFin()">Salvar Privado</button><table id="tabMeuFin"></table></div>
<div id="view-relatorios" class="card view hidden"><h2>📈 Relatórios</h2><button class="btn btn-s" onclick="relatorio('clientes')">Clientes</button><button class="btn btn-s" onclick="relatorio('estoque')">Estoque Baixo</button><button class="btn btn-s" onclick="relatorio('os')">OS</button><button class="btn btn-s" onclick="relatorio('financeiro')">Financeiro</button><button class="btn btn-s" onclick="relatorio('chamados')">Chamados</button><div id="areaRel"></div></div>
<div id="view-usuarios" class="card view hidden"><h2>👑 Usuários e Permissões</h2><input id="buscaUsu" class="search" placeholder="🔍 Buscar..." oninput="renderUsuarios()"><div id="areaUsuarios"></div></div>
</div>
<script>
function toggleOlhoPremium(){
let s=document.getElementById('sen');let ico=document.getElementById('icoOlho');let btn=document.getElementById('btnOlho');
let isPass=s.type==='password';s.type=isPass?'text':'password';
if(isPass){
ico.innerHTML='<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.94 10.94 0 0 1 12 5c7 0 11 8 11 8a18.45 18.45 0 0 1-2.16 3.19"/><path d="M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.59 9.59 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>';
ico.setAttribute('stroke','#3b82f6');btn.style.borderColor='#3b82f6';btn.style.background='#1e293b';
}else{
ico.innerHTML='<path d="M1 12s4-8 11-8 11 8-11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
ico.setAttribute('stroke','#94a3b8');btn.style.borderColor='#334155';btn.style.background='#0f172a';
}
}
let usuarios=JSON.parse(localStorage.getItem('usuarios_v793')||'null')||[{empresa:'ramosinfotec',nome:'ramosinfotec',senha:'@Xumone@197353',clienteVinculado:'',perms:{dash:1,cad:1,est:1,os:1,fin:1,meufin:1,usu:1,rel:1,admin:1,chat:1,abrirChamado:1,verDashboard:1,verTodosChamados:1}}];
let clientes=JSON.parse(localStorage.getItem('cli_v793')||'[]');let estoque=JSON.parse(localStorage.getItem('est_v793')||'[]');let chamados=JSON.parse(localStorage.getItem('cha_v793')||'[]');let oss=JSON.parse(localStorage.getItem('oss_v793')||'[]');let financeiro=JSON.parse(localStorage.getItem('fin_v793')||'[]');let meuFinanceiro=JSON.parse(localStorage.getItem('meuf_v793')||'[]');
let logado=null,editIndex=-1,editTipo='';
function saveAll(){localStorage.setItem('usuarios_v793',JSON.stringify(usuarios));localStorage.setItem('cli_v793',JSON.stringify(clientes));localStorage.setItem('est_v793',JSON.stringify(estoque));localStorage.setItem('cha_v793',JSON.stringify(chamados));localStorage.setItem('oss_v793',JSON.stringify(oss));localStorage.setItem('fin_v793',JSON.stringify(financeiro));localStorage.setItem('meuf_v793',JSON.stringify(meuFinanceiro));}
function senhaForte(s){return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&\-_#=]).{8,}$/.test(s);}
function fazerLogin(){let emp=document.getElementById('emp').value.trim().toLowerCase();let lg=document.getElementById('log').value.trim().toLowerCase();let se=document.getElementById('sen').value.trim();let chave=emp+'_'+lg;let tent=JSON.parse(localStorage.getItem('tent_v793')||'{}');let bloq=JSON.parse(localStorage.getItem('bloq_v793')||'{}');if(bloq[chave]&&Date.now()-bloq[chave]<15*60*1000){document.getElementById('erro').innerText='Bloqueado 15min. Contate admin ramosinfotec.';return;}let u=usuarios.find(x=>x.empresa.toLowerCase()===emp&&x.nome.toLowerCase()===lg&&x.senha===se);if(!u){tent[chave]=(tent[chave]||0)+1;localStorage.setItem('tent_v793',JSON.stringify(tent));if(tent[chave]>=3){bloq[chave]=Date.now();localStorage.setItem('bloq_v793',JSON.stringify(bloq));document.getElementById('erro').innerText='Usuário bloqueado por 15min após 3 tentativas.';}else{document.getElementById('erro').innerText='Usuário ou senha incorretos, tente novamente. '+tent[chave]+'/3';}return;}tent[chave]=0;localStorage.setItem('tent_v793',JSON.stringify(tent));logado=u;localStorage.setItem('logado_v793',JSON.stringify(u));iniciar();}
function iniciar(){document.getElementById('loginPage').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userInfo').innerText=logado.nome+' | '+logado.empresa;let m=document.getElementById('menu');m.innerHTML='';let perms=logado.perms||{};let itens=[['dashboard','📊 Dash','dash'],['cadastro','👥 Cadastro','cad'],['estoque','📦 Estoque','est'],['chamado-abertura','🎫 Meu Chamado','abrirChamado'],['chamado','🛠️ Chamados','admin'],['os','📋 OS','os'],['financeiro','💰 Financ','fin'],['meufinanceiro','🔐 MeuFin','meufin'],['relatorios','📈 Rel','rel'],['usuarios','👑 Usuários','usu']];itens.forEach(([id,label,permKey])=>{let pode=false;if(perms.admin) pode=true;else if(id==='chamado-abertura' && (perms.abrirChamado||perms.dash)) pode=true;else if(perms[permKey]||perms[id]) pode=true;else if(id==='dashboard' && perms.verDashboard) pode=true;if(pode){if(id==='meufinanceiro'&&logado.nome!=='ramosinfotec'&&!perms.admin)return;let b=document.createElement('button');b.innerText=label;b.onclick=()=>mostrar(id);m.appendChild(b);}});mostrar('dashboard');atualizarDash();}
function mostrar(id){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.getElementById('view-'+id).classList.remove('hidden');if(id==='cadastro')renderCad();if(id==='estoque')renderEst();if(id==='chamado')renderChamados();if(id==='chamado-abertura')renderMeusChamados();if(id==='os')renderOS();if(id==='financeiro')renderFin();if(id==='meufinanceiro')renderMeuFin();if(id==='usuarios')renderUsuarios();}
function atualizarDash(){document.getElementById('dashInfo').innerHTML=`Clientes: ${clientes.length} | OS Abertas: ${chamados.filter(c=>c.status!=='Finalizado').length} | Estoque: ${estoque.length} | Financ Total: R$ ${financeiro.reduce((a,b)=>a+(b.tipo==='Receita'?b.total||b.valor:- (b.total||b.valor)),0).toFixed(2)}`;}
function buscarCEP(){let cep=document.getElementById('c-cep').value.replace(/\D/g,'');if(cep.length===8){fetch('https://viacep.com.br/ws/'+cep+'/json/').then(r=>r.json()).then(d=>{document.getElementById('c-end').value=d.logradouro||'';document.getElementById('c-bairro').value=d.bairro||'';document.getElementById('c-cidade').value=d.localidade||'';document.getElementById('c-estado').value=d.uf||'';});}}
function roboBuscar(){let doc=document.getElementById('c-doc').value.replace(/\D/g,'');if(doc.length===14){fetch('https://brasilapi.com.br/api/cnpj/v1/'+doc).then(r=>r.json()).then(d=>{document.getElementById('c-empresa').value=d.razao_social||'';document.getElementById('c-email').value=d.email||'';document.getElementById('c-cep').value=d.cep||'';document.getElementById('c-cidade').value=d.municipio||'';document.getElementById('c-estado').value=d.uf||'';document.getElementById('c-tel').value=d.ddd_telefone_1||'';alert('🤖 Achado: '+d.razao_social);buscarCEP();}).catch(()=>alert('CNPJ não encontrado'));}else{alert('Robô só CNPJ');}}
function salvarCad(){let obj={empresa:document.getElementById('c-empresa').value,doc:document.getElementById('c-doc').value,email:document.getElementById('c-email').value,cep:document.getElementById('c-cep').value,end:document.getElementById('c-end').value,num:document.getElementById('c-num').value,cidade:document.getElementById('c-cidade').value,estado:document.getElementById('c-estado').value,bairro:document.getElementById('c-bairro').value,tel:document.getElementById('c-tel').value,contato:document.getElementById('c-contato').value,contrato:document.getElementById('c-contrato').value};if(!obj.empresa)return alert('Empresa obrigatória');clientes.push(obj);saveAll();renderCad();alert('Cliente salvo!');}
function renderCad(){let b=document.getElementById('buscaCad').value.toLowerCase();let tab='<tr><th>Empresa</th><th>Cidade</th><th>Tel</th><th>Ações</th></tr>';clientes.forEach((c,i)=>{if(b&&!JSON.stringify(c).toLowerCase().includes(b))return;tab+=`<tr><td>${c.empresa}</td><td>${c.cidade}</td><td>${c.tel}</td><td><button class=btn-p onclick="alterarCad(${i})">Alterar</button> <button class=btn-d onclick="excluirCad(${i})">Excluir</button></td></tr>`});document.getElementById('tabCad').innerHTML=tab;let sel=document.getElementById('os-cliente');if(sel)sel.innerHTML=clientes.map(c=>`<option>${c.empresa}</option>`).join('');}
function alterarCad(i){let c=clientes[i];document.getElementById('c-empresa').value=c.empresa;document.getElementById('c-doc').value=c.doc;document.getElementById('c-email').value=c.email;document.getElementById('c-cep').value=c.cep;document.getElementById('c-end').value=c.end;document.getElementById('c-num').value=c.num;document.getElementById('c-cidade').value=c.cidade;document.getElementById('c-estado').value=c.estado;document.getElementById('c-bairro').value=c.bairro;document.getElementById('c-tel').value=c.tel;document.getElementById('c-contato').value=c.contato;editIndex=i;editTipo='cad';}
function excluirCad(i){clientes.splice(i,1);saveAll();renderCad();}
function salvarEst(){let obj={nome:document.getElementById('e-nome').value,qtd:+document.getElementById('e-qtd').value,valor:+document.getElementById('e-valor').value,min:+document.getElementById('e-min').value};if(!obj.nome)return;estoque.push(obj);saveAll();renderEst();}
function renderEst(){let b=document.getElementById('buscaEst').value.toLowerCase();let tab='<tr><th>Produto</th><th>Qtd</th><th>Valor</th><th>Ações</th></tr>';estoque.forEach((e,i)=>{if(b&&!e.nome.toLowerCase().includes(b))return;tab+=`<tr><td>${e.nome}</td><td>${e.qtd}</td><td>R$${e.valor}</td><td><button class=btn-d onclick="excluirEst(${i})">Excluir</button></td></tr>`});document.getElementById('tabEst').innerHTML=tab;}
function excluirEst(i){estoque.splice(i,1);saveAll();renderEst();}
function abrirChamado(){let obj={id:Date.now(),titulo:document.getElementById('ch-titulo').value,desc:document.getElementById('ch-desc').value,cliente:logado.nome,empresaCliente:logado.clienteVinculado||logado.empresa,status:'Aberto',data:new Date().toLocaleString('pt-BR'),comentarios:[]};if(!obj.titulo)return alert('Título');chamados.push(obj);saveAll();renderMeusChamados();alert('Chamado aberto!');}
function renderMeusChamados(){let tab='<tr><th>ID</th><th>Título</th><th>Status</th><th>Ações</th></tr>';chamados.filter(c=>{if(logado.perms.admin) return true;return c.cliente===logado.nome;}).forEach(c=>{let idx=chamados.findIndex(x=>x.id===c.id);tab+=`<tr><td>${c.id}</td><td>${c.titulo}</td><td>${c.status}</td><td><button class=btn-p onclick="verMeuChamado(${idx})">Ver</button></td></tr>`});document.getElementById('tabMeusChamados').innerHTML=tab;}
function verMeuChamado(i){let c=chamados[i];let det=document.getElementById('detMeuCh');det.classList.remove('hidden');det.innerHTML=`<h3>${c.titulo}</h3><p>${c.desc}</p><div>${c.comentarios.map(cm=>`<p><b>${cm.quem}</b>: ${cm.texto}</p>`).join('')}</div><textarea id="meuComent"></textarea><br><button class=btn-p onclick="inserirMeuComent(${i})">Comentar</button>`;}
function inserirMeuComent(i){let txt=document.getElementById('meuComent').value.trim();if(!txt)return;chamados[i].comentarios.push({quem:logado.nome,data:new Date().toLocaleString('pt-BR'),texto:txt});saveAll();verMeuChamado(i);}
function renderChamados(){let b=document.getElementById('buscaCh').value.toLowerCase();let tab='<tr><th>ID</th><th>Cliente</th><th>Título</th><th>Status</th><th>Ações</th></tr>';chamados.forEach((c,i)=>{if(b&&!JSON.stringify(c).toLowerCase().includes(b))return;tab+=`<tr><td>${c.id}</td><td>${c.cliente}</td><td>${c.titulo}</td><td>${c.status}</td><td><button class=btn-p onclick="verChamado(${i})">Atender</button></td></tr>`});document.getElementById('tabCh').innerHTML=tab;}
function verChamado(i){let c=chamados[i];let det=document.getElementById('detCh');det.classList.remove('hidden');det.innerHTML=`<h3>${c.titulo}</h3><p>${c.desc}</p><textarea id="novoComent"></textarea><br><button class=btn-p onclick="inserirComent(${i})">Comentar</button> <button class=btn-p style="background:#16a34a" onclick="finalizarCh(${i})">Finalizar</button>`;}
function inserirComent(i){let t=document.getElementById('novoComent').value;if(!t)return;chamados[i].comentarios.push({quem:logado.nome,data:new Date().toLocaleString('pt-BR'),texto:t});saveAll();verChamado(i);}
function finalizarCh(i){chamados[i].status='Finalizado';saveAll();renderChamados();verChamado(i);}
function salvarOS(){let obj={cliente:document.getElementById('os-cliente').value,serv:document.getElementById('os-serv').value,valor:+document.getElementById('os-valor').value};oss.push(obj);saveAll();renderOS();}
function renderOS(){let tab='<tr><th>Cliente</th><th>Serviço</th><th>Valor</th></tr>';oss.forEach(o=>{tab+=`<tr><td>${o.cliente}</td><td>${o.serv}</td><td>R$${o.valor}</td></tr>`});document.getElementById('tabOS').innerHTML=tab;}
function calcTotal(){let v=parseFloat(document.getElementById('f-valor').value)||0;let d=parseFloat(document.getElementById('f-desc').value)||0;let m=parseFloat(document.getElementById('f-multa').value)||0;let j=parseFloat(document.getElementById('f-juros').value)||0;document.getElementById('f-total').value=(v - d + m + j).toFixed(2);}
function calcTotalMeu(){let v=parseFloat(document.getElementById('mf-valor').value)||0;let d=parseFloat(document.getElementById('mf-desc').value)||0;let m=parseFloat(document.getElementById('mf-multa').value)||0;let j=parseFloat(document.getElementById('mf-juros').value)||0;document.getElementById('mf-total').value=(v - d + m + j).toFixed(2);}
function salvarFin(){let obj={nome:document.getElementById('f-nome').value,forn:document.getElementById('f-forn').value,doc:document.getElementById('f-doc').value,tipo:document.getElementById('f-tipo').value,emissao:document.getElementById('f-emissao').value,venc:document.getElementById('f-venc').value,pag:document.getElementById('f-pag').value,valor:parseFloat(document.getElementById('f-valor').value)||0,desc:parseFloat(document.getElementById('f-desc').value)||0,multa:parseFloat(document.getElementById('f-multa').value)||0,juros:parseFloat(document.getElementById('f-juros').value)||0,total:parseFloat(document.getElementById('f-total').value)||0,forma:document.getElementById('f-forma').value,status:document.getElementById('f-status').value,obs:document.getElementById('f-obs').value};financeiro.push(obj);saveAll();renderFin();alert('Conta salva!');}
function renderFin(){let b=document.getElementById('buscaFin').value.toLowerCase();let tab='<tr><th>Nome</th><th>Venc</th><th>Valor</th><th>Total</th><th>Status</th></tr>';financeiro.forEach(f=>{if(b&&!JSON.stringify(f).toLowerCase().includes(b))return;tab+=`<tr><td>${f.nome}</td><td>${f.venc}</td><td>R$${f.valor}</td><td>R$${f.total}</td><td>${f.status}</td></tr>`});document.getElementById('tabFin').innerHTML=tab;atualizarDash();}
function salvarMeuFin(){let obj={nome:document.getElementById('mf-nome').value,forn:document.getElementById('mf-forn').value,doc:document.getElementById('mf-doc').value,tipo:document.getElementById('mf-tipo').value,emissao:document.getElementById('mf-emissao').value,venc:document.getElementById('mf-venc').value,pag:document.getElementById('mf-pag').value,valor:parseFloat(document.getElementById('mf-valor').value)||0,desc:parseFloat(document.getElementById('mf-desc').value)||0,multa:parseFloat(document.getElementById('mf-multa').value)||0,juros:parseFloat(document.getElementById('mf-juros').value)||0,total:parseFloat(document.getElementById('mf-total').value)||0,forma:document.getElementById('mf-forma').value,status:document.getElementById('mf-status').value,obs:document.getElementById('mf-obs').value};meuFinanceiro.push(obj);saveAll();renderMeuFin();alert('Meu financeiro salvo!');}
function renderMeuFin(){let tab='<tr><th>Nome</th><th>Venc</th><th>Total</th><th>Status</th></tr>';meuFinanceiro.forEach(f=>{tab+=`<tr><td>${f.nome}</td><td>${f.venc}</td><td>R$${f.total}</td><td>${f.status}</td></tr>`});document.getElementById('tabMeuFin').innerHTML=tab;}
function relatorio(t){let area=document.getElementById('areaRel');let h='<h3>Rel '+t+'</h3><table>';if(t==='clientes')h+=clientes.map(c=>`<tr><td>${c.empresa}</td><td>${c.cidade}</td><td>${c.tel}</td></tr>`).join('');if(t==='financeiro')h+=financeiro.map(f=>`<tr><td>${f.nome}</td><td>R$${f.total}</td></tr>`).join('');h+='</table>';area.innerHTML=h;}
function renderUsuarios(){let b=document.getElementById('buscaUsu').value.toLowerCase();let html='';usuarios.forEach((u,i)=>{if(b&&!JSON.stringify(u).toLowerCase().includes(b))return;html+=`<div class=card style="background:#020617"><b>👤 ${u.nome}</b> @ ${u.empresa}<br><button class=btn-p onclick="alterarUsu(${i})">Alterar Senha</button> <button class=btn-d onclick="excluirUsu(${i})">Excluir</button></div>`;});let optsClientes=clientes.map(c=>`<option value="${c.empresa}">${c.empresa}</option>`).join('');html+=`<div class=card style="border:2px solid #3b82f6"><h3>Criar Usuário</h3><input id="u-emp" placeholder="Empresa" value="ramosinfotec"><input id="u-nome" placeholder="Usuário"><input id="u-senha" type="password" placeholder="Senha"><select id="u-clienteVinculado"><option value="">Vincular empresa (opcional)</option>${optsClientes}</select><button class="btn btn-p" style="width:100%;margin-top:10px" onclick="criarUsu()">SALVAR USUÁRIO</button></div>`;document.getElementById('areaUsuarios').innerHTML=html;}
function criarUsu(){let emp=document.getElementById('u-emp').value.trim(),nome=document.getElementById('u-nome').value.trim(),senha=document.getElementById('u-senha').value.trim(),cliVinc=document.getElementById('u-clienteVinculado').value;if(!emp||!nome||!senha)return alert('Preencha');if(!senhaForte(senha))return alert('Senha fraca! 8+, Maiúscula, minúscula, número e @');usuarios.push({empresa:emp,nome:nome,senha:senha,clienteVinculado:cliVinc,perms:{dash:1,cad:1,est:1,os:1,fin:1,meufin:1,usu:1,rel:1,admin:0,abrirChamado:1,verDashboard:1,verTodosChamados:0}});saveAll();renderUsuarios();alert('Usuário criado!');}
function alterarUsu(i){let n=prompt('Nova senha',usuarios[i].senha);if(!n)return;if(!senhaForte(n))return alert('Senha fraca!');usuarios[i].senha=n;saveAll();renderUsuarios();}
function excluirUsu(i){if(i===0)return alert('Não pode excluir admin principal');usuarios.splice(i,1);saveAll();renderUsuarios();}
function sair(){localStorage.removeItem('logado_v793');location.reload();}
let l=JSON.parse(localStorage.getItem('logado_v793')||'null');if(l){logado=l;iniciar();}
</script>
