.badge-pendente{background:#f59e0b;color:black}
.badge-enviado{background:#22c55e;color:black}
.badge-respondeu{background:#38bdf8;color:black}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #334155;font-size:14px}
th{color:#94a3b8}
.lead-msg{background:#0f172a;padding:15px;border-radius:8px;white-space:pre-wrap;font-size:13px;border:1px dashed #334155;margin:10px 0}
