<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAMOS V57.1 SETA EMPRESA</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#070d1e;color:#e2e8f0;font-size:14px}.glass{background:rgba(15,23,42,.98);border:1px solid #00D9FF33}.lb{font-size:12px;color:#7dd3fc;font-weight:800;display:block;margin-bottom:4px}.inp{background:#0f172a;border:1px solid #00D9FF55;color:#fff;padding:10px;border-radius:10px;width:100%;font-size:14px}.sel{background:#0f172a;border:1px solid #00D9FFAA;color:#00D9FF;padding:10px;border-radius:10px;font-size:14px;font-weight:700}.tab{display:none}.tab.active{display:block!important}.menu-btn{width:100%;text-align:left;padding:10px;border-radius:10px;font-size:13px;color:#94a3b8;font-weight:600}.card{background:rgba(15,23,42,.9);border:1px solid #00D9FF22;border-radius:14px;padding:14px}.b{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:800;color:#fff;border:none;cursor:pointer}.b-inc{background:#0891b2}.b-alt{background:#2563eb}.b-exc{background:#dc2626}.b-ver{background:#334155}.b-fecha{background:#16a34a}.b-print{background:#0e7490}.chk{width:16px;height:16px;accent-color:#00D9FF}</style></head><body>
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="glass p-8 rounded-2xl w-full max-w-md"><div class="text-center mb-6"><div class="w-14 h-14 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-xl mx-auto flex items-center justify-center font-black text-lg">RI</div><h1 class="text-cyan-400 font-black mt-3 text-lg">RAMOS V57.1</h1><p class="text-[10px] opacity-60">SETA BUSCA EMPRESA NO USUARIO</p></div>
<form autocomplete="off" onsubmit="return false;">
<label class="lb">Empresa</label><input id="empresa" class="inp mb-3" placeholder="Digite a empresa" autocomplete="off" value="">
<label class="lb">Usuario</label><input id="usuario" class="inp mb-3" placeholder="Digite o usuario" autocomplete="off" value="">
<label class="lb">Senha</label><div class="flex gap-2 mb-5"><input id="senha" type="password" class="inp" placeholder="Digite a senha" autocomplete="new-password" value=""><button type="button" onclick="document.getElementById('senha').type=document.getElementById('senha').type==='password'?'text':'password'" class="b b-ver">👁️</button></div>
<button onclick="login()" class="w-full py-4 rounded-xl bg-cyan-500 text-black font-black text-base">ENTRAR V57.1</button>
</form></div></div>
<div id="app" class="hidden min-h-screen flex"><div class="w-64 glass border-r p-3 overflow-auto"><p class="font-bold text-cyan-400 text-sm">RAMOS V57.1</p><p id="uInfo" class="text-[10px] opacity-60 mb-3">-</p><nav id="menuM" class="space-y-2"></nav><button onclick="logout()" class="w-full mt-4 py-3 rounded bg-red-500/10 border border-red-500/20 text-red-400 text-[11px] font-bold">SAIR</button></div><div class="flex-1 p-3 overflow-auto">
<div id="t-clientes" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-sm">👥 CLIENTES</h2>
<div class="flex gap-2 mt-3 items-end"><div class="flex-1"><label class="lb">Buscar por ▼</label><select id="buscaCliTipo" class="sel w-full"><option value="tudo">🔍 TUDO</option><option value="nome">Nome</option><option value="empresa">Empresa</option><option value="municipio">Municipio</option><option value="zap">WhatsApp</option><option value="email">Email</option></select></div><div class="flex-[2]"><label class="lb">Digite a busca</label><input id="buscaCli" class="inp" placeholder="Digite..." oninput="rCli()"></div><button onclick="rCli()" class="b b-ver h-10">🔍 BUSCAR</button></div>
<div class="grid grid-cols-2 gap-3 mt-4"><input id="cNome" class="inp" placeholder="Nome*"><input id="cEmpresa" class="inp" placeholder="Empresa*"><input id="cEmail" class="inp" placeholder="Email"><input id="cZap" class="inp" placeholder="WhatsApp* (11) 99999-9999" oninput="maskPhone(this)"><input id="cEndereco" class="inp" placeholder="Endereco"><input id="cNumero" class="inp" placeholder="Numero"><input id="cMunicipio" class="inp" placeholder="Municipio"><input id="cEstado" class="inp" placeholder="Estado"><input id="cTel" class="inp" placeholder="Telefone (11) 3333-4444" oninput="maskPhone(this)"><input id="cContato" class="inp" placeholder="Contato"></div><div class="flex gap-2 mt-3"><button onclick="addCli()" class="b b-inc">💾 INCLUIR</button><button onclick="limpCli()" class="b b-ver">LIMPAR</button></div><div id="lCli" class="mt-4 space-y-2"></div></div></div>
<div id="t-chamados" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-sm">📋 CHAMADOS</h2>
<div class="flex gap-2 mt-3"><div class="flex-1"><label class="lb">Filtrar por ▼</label><select id="buscaChaTipo" class="sel w-full"><option value="tudo">TUDO</option><option value="titulo">Titulo</option><option value="empresa">Empresa</option><option value="status">Status</option><option value="cliente">Cliente</option></select></div><div class="flex-[2]"><label class="lb">Busca</label><input id="buscaCha" class="inp" placeholder="Digite..." oninput="rCha()"></div></div>
<div class="grid grid-cols-3 gap-3 mt-4"><input id="chTitulo" class="inp" placeholder="Titulo*"><input id="chEmpresa" class="inp" placeholder="Empresa*"><select id="chPrio" class="inp"><option>Baixa</option><option>Media</option><option>Alta</option><option>Urgente</option></select><input id="chCliente" class="inp col-span-2" placeholder="Cliente"><input id="chEmailSuporte" class="inp" placeholder="Email suporte*" value="albertramos68@gmail.com"><textarea id="chDesc" class="inp h-16 col-span-3" placeholder="Descricao*"></textarea></div>
<div class="mt-3 p-3 bg-slate-800 rounded-xl"><label class="flex items-center gap-2 text-[13px]"><input type="checkbox" id="chkEmail" checked class="chk"> 📧 Enviar e-mail automatico</label><input id="chEmailGrupo" class="inp mt-2" placeholder="Grupo de e-mails" value="albertramos68@gmail.com, suporte@ramosinfotec.com.br"></div>
<div class="flex gap-2 mt-3"><button onclick="addChamado()" class="b b-inc">💾 INCLUIR + EMAIL</button><button onclick="relCha()" class="b b-print">RELATORIO</button></div><div id="lCha" class="mt-4 space-y-2"></div></div></div>
<div id="t-financeiro" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-sm">💰 FINANCEIRO</h2><div class="grid grid-cols-3 gap-3 mt-3"><input id="fiNome" class="inp" placeholder="Nome*"><input id="fiBoleto" type="number" class="inp" placeholder="Boleto*"><select id="fiMov" class="inp"><option>Saida</option><option>Entrada</option></select><input id="fiVenc" type="date" class="inp"><input id="fiPagoData" type="date" class="inp"><input id="fiTotal" type="number" class="inp" placeholder="Total"><input id="fiPagoVal" type="number" class="inp" placeholder="Pago"><input id="fiMulta" type="number" class="inp" placeholder="Multa"><input id="fiEmp" class="inp" placeholder="Empresa"><input id="fiProd" class="inp" placeholder="Produto"><input id="fiDesc" class="inp col-span-3" placeholder="Descricao*"></div><div class="flex gap-2 mt-3"><button onclick="addFin()" class="b b-inc">💾 INCLUIR</button><button onclick="impFin()" class="b b-print">🖨️ FORM</button></div><div id="lFin" class="mt-3 space-y-2"></div></div></div>
<div id="t-estoque" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-sm">📦 ESTOQUE</h2><div class="grid grid-cols-4 gap-3 mt-3"><input id="esProd" class="inp" placeholder="Produto*"><input id="esQtd" type="number" class="inp" placeholder="Qtd*"><input id="esEnt" type="date" class="inp"><input id="esSai" type="date" class="inp"></div><div class="flex gap-2 mt-3"><button onclick="addEst()" class="b b-inc">💾 INCLUIR</button><button onclick="relEst()" class="b b-print">REL</button></div><div id="lEst" class="mt-3 space-y-2"></div></div></div>
<div id="t-remote" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-sm">🖥️ REMOTO</h2><div class="grid grid-cols-3 gap-3 mt-3"><input id="reCli" class="inp" placeholder="Cliente*"><input id="reEmp" class="inp" placeholder="Empresa"><input id="reAny" class="inp" placeholder="AnyDesk"><input id="reTeam" class="inp" placeholder="TeamViewer"><input id="reSenha" type="text" class="inp" placeholder="Senha"><input id="reObs" class="inp" placeholder="Obs"></div><div class="flex gap-2 mt-3"><button onclick="addRem()" class="b b-inc">💾 INCLUIR</button></div><div id="lRem" class="mt-3 space-y-2"></div></div></div>
<div id="t-usuarios" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-sm">👤 USUARIOS - COM SETA ▼</h2>
<div class="grid grid-cols-3 gap-3 mt-3">
<div class="col-span-1"><label class="lb">Empresa* ▼ BUSCA</label><div class="flex gap-1"><select id="selEmpresaDrop" class="sel" style="width:70px" onchange="syncEmpresa(this.value)"><option value="">▼</option></select><input id="uEmpresa" class="inp" list="listaEmp" placeholder="Digite E ou selecione ▼" oninput="filtraEmpresa()"><datalist id="listaEmp"></datalist></div><div id="listaEmpVisual" class="mt-1 max-h-24 overflow-auto bg-slate-900 border border-cyan-500/30 rounded text-[12px] hidden"></div></div>
<input id="uNome" class="inp" placeholder="Usuario*" style="height:42px; margin-top:22px"><div class="flex gap-2" style="margin-top:22px"><input id="uSenha" type="text" class="inp" placeholder="Senha*"><button type="button" onclick="document.getElementById('uSenha').type=document.getElementById('uSenha').type==='text'?'password':'text'" class="b b-ver">👁️</button></div></div>
<div class="mt-4 p-3 bg-slate-800 rounded-xl"><p class="text-[12px] font-bold text-cyan-400 mb-3">☑️ PERMISSOES:</p><div class="grid grid-cols-2 gap-3 text-[13px]">
<label class="flex items-center gap-2"><input type="checkbox" id="p_clientes" class="chk"> 👥 Clientes</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_chamados" class="chk"> 📋 Ver Chamados</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_abrir" class="chk" checked> ➕ Abrir Chamado</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_comentar" class="chk"> 💬 Comentarios</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_financeiro" class="chk"> 💰 Financeiro</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_estoque" class="chk"> 📦 Estoque</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_relatorios" class="chk"> 📊 Relatorios</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_excluir" class="chk"> 🗑️ EXCLUIR</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_chefe" class="chk"> 👑 Chefe</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_usuarios" class="chk"> 👤 Usuarios</label>
</div><div class="mt-4 flex gap-2 flex-wrap"><button onclick="presetFin()" class="b b-print text-[10px] py-2">PERFIL FINANCEIRO</button><button onclick="presetEmpresa()" class="b b-ver text-[10px] py-2">PERFIL EMPRESA</button><button onclick="presetChefe()" class="b b-fecha text-[10px] py-2">PERFIL CHEFE</button></div></div>
<div class="flex gap-2 mt-4"><button onclick="addUs()" class="b b-inc w-full py-3 text-sm">💾 SALVAR USUARIO</button><button onclick="relUs()" class="b b-print">REL POR EMPRESA</button></div><div id="lUs" class="mt-4 space-y-2"></div></div></div>
<div id="t-relatorios" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-sm">📊 RELATORIOS</h2><p id="relAviso" class="text-[11px] mt-2 p-2 bg-yellow-500/10 border border-yellow-500/30 rounded text-yellow-300"></p>
<div class="flex gap-2 mt-3"><div class="flex-1"><label class="lb">Modulo ▼</label><select id="relModulo" class="sel w-full"><option value="tudo">TUDO DA MINHA EMPRESA</option><option value="clientes">Clientes</option><option value="chamados">Chamados</option><option value="financeiro">Financeiro</option><option value="estoque">Estoque</option></select></div><button onclick="gerarRelatorioTudo()" class="b b-inc h-10 mt-5">GERAR RELATORIO</button></div><div id="rRes" class="mt-3 bg-white text-black p-4 rounded"><div id="rCon" class="text-[13px]">Relatorio filtrado pela empresa</div></div></div></div>
<div id="t-coment" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-sm">💬 COMENTARIOS <span id="cmtId"></span></h2><div id="cmtInfo" class="text-[13px] my-3 p-3 bg-slate-800 rounded"></div><div class="flex gap-2"><input id="cmtTexto" class="inp" placeholder="Escreva seu comentario..."><button onclick="addComent()" class="b b-inc">ENVIAR</button></div><div id="lCmt" class="mt-4 space-y-2"></div><button onclick="tab('chamados')" class="b b-ver mt-4">VOLTAR</button></div></div>
</div></div>
<script>
function maskPhone(el){let v=el.value.replace(/\D/g,'');if(v.length>11)v=v.slice(0,11);if(v.length>10){el.value='('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);}else if(v.length>6){el.value='('+v.slice(0,2)+') '+v.slice(2,6)+'-'+v.slice(6);}else if(v.length>2){el.value='('+v.slice(0,2)+') '+v.slice(2);}else{el.value=v;}}
let clientes=JSON.parse(localStorage.getItem('v57_cli')||'[]'),chamados=JSON.parse(localStorage.getItem('v57_cha')||'[]'),fins=JSON.parse(localStorage.getItem('v57_fin')||'[]'),meus=JSON.parse(localStorage.getItem('v57_meu')||'[]'),ests=JSON.parse(localStorage.getItem('v57_est')||'[]'),rems=JSON.parse(localStorage.getItem('v57_rem')||'[]'),users=JSON.parse(localStorage.getItem('v57_usr')||'[]'),editCli=null,editFin=null,editMeu=null,editEst=null,editRem=null,editCha=null,editUs=null,comentChaId=null;
function save(){localStorage.setItem('v57_cli',JSON.stringify(clientes));localStorage.setItem('v57_cha',JSON.stringify(chamados));localStorage.setItem('v57_fin',JSON.stringify(fins));localStorage.setItem('v57_meu',JSON.stringify(meus));localStorage.setItem('v57_est',JSON.stringify(ests));localStorage.setItem('v57_rem',JSON.stringify(rems));localStorage.setItem('v57_usr',JSON.stringify(users));}
function clearLogin(){document.getElementById('empresa').value='';document.getElementById('usuario').value='';document.getElementById('senha').value='';}
function login(){let emp=document.getElementById('empresa').value.trim(),usu=document.getElementById('usuario').value.trim(),sen=document.getElementById('senha').value.trim();if(!emp||!usu||!sen)return alert('Preencha todos');if(emp.toLowerCase()==='ramosinfotec'&&usu==='admin'&&sen==='@Xumone@197353'){localStorage.setItem('log','1');localStorage.setItem('role','master');localStorage.setItem('user',usu);localStorage.setItem('emp','RAMOS');localStorage.setItem('perm',JSON.stringify({clientes:true,chamados:true,abrir:true,comentar:true,financeiro:true,meufin:true,estoque:true,remote:true,relatorios:true,excluir:true,chefe:true,usuarios:true}));show();return;}let u=users.find(x=>x.empresa.toLowerCase()===emp.toLowerCase()&&x.nome.toLowerCase()===usu.toLowerCase()&&x.senha===sen);if(!u)u=users.find(x=>x.nome.toLowerCase()===usu.toLowerCase()&&x.senha===sen);if(u){if(u.bloqueado)return alert('BLOQUEADO');localStorage.setItem('log','1');localStorage.setItem('role',u.chefe?'chefe':'user');localStorage.setItem('user',u.nome);localStorage.setItem('emp',u.empresa);localStorage.setItem('perm',JSON.stringify(u.perms));show();return;}alert('Incorreto');}
function show(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');let r=localStorage.getItem('role'),u=localStorage.getItem('user'),e=localStorage.getItem('emp'),perm=JSON.parse(localStorage.getItem('perm')||'{}');document.getElementById('uInfo').innerText=u+' - '+e+' ('+r+')';let aviso=document.getElementById('relAviso');if(r==='master'){aviso.innerText='MASTER: Voce ve tudo';}else{aviso.innerText='EMPRESA '+e.toUpperCase()+': So ve dados da sua empresa';}buildMenu(perm,r);rAll();}
function buildMenu(p,r){let menu=document.getElementById('menuM'),html='';if(r==='master'||p.clientes||p.chefe) html+=`<button onclick="tab('clientes')" class="menu-btn">👥 Clientes</button>`;if(r==='master'||p.chamados||p.abrir||p.chefe) html+=`<button onclick="tab('chamados')" class="menu-btn">📋 Chamados</button>`;if(r==='master'||p.financeiro) html+=`<button onclick="tab('financeiro')" class="menu-btn">💰 Financeiro</button>`;if(r==='master'||p.estoque||p.chefe) html+=`<button onclick="tab('estoque')" class="menu-btn">📦 Estoque</button>`;if(r==='master'||p.remote||p.chefe) html+=`<button onclick="tab('remote')" class="menu-btn">🖥️ Remoto</button>`;if(r==='master'||p.usuarios||p.chefe) html+=`<button onclick="tab('usuarios')" class="menu-btn">👤 Usuarios</button>`;if(r==='master'||p.relatorios||p.chefe||p.abrir) html+=`<button onclick="tab('relatorios')" class="menu-btn">📊 Relatorios</button>`;if(html==='')html=`<button onclick="tab('chamados')" class="menu-btn">➕ Abrir Chamado</button><button onclick="tab('relatorios')" class="menu-btn">📊 Meus Relatorios</button>`;menu.innerHTML=html;setTimeout(()=>{let f=menu.querySelector('.menu-btn');if(f)f.click();},100);}
function logout(){localStorage.removeItem('log');clearLogin();document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');}
function tab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));let el=document.getElementById('t-'+id);if(el)el.classList.add('active');}
function carregaEmpresas(){
  let empresas=[...new Set(clientes.map(c=>c.empresa).filter(e=>e&&e.trim()!=''))].sort();
  let dl=document.getElementById('listaEmp');
  let sel=document.getElementById('selEmpresaDrop');
  if(dl) dl.innerHTML=empresas.map(e=>`<option value="${e}">`).join('');
  if(sel){
    sel.innerHTML='<option value="">▼ TODAS</option>'+empresas.map(e=>`<option value="${e}">${e}</option>`).join('')+'<option value="__nova__">+ NOVA EMPRESA</option>';
  }
}
function syncEmpresa(v){if(v==='__nova__'){document.getElementById('uEmpresa').value='';document.getElementById('uEmpresa').focus();return;}if(v) document.getElementById('uEmpresa').value=v;filtraEmpresa();}
function filtraEmpresa(){
  let txt=(document.getElementById('uEmpresa').value||'').toLowerCase();
  let empresas=[...new Set(clientes.map(c=>c.empresa).filter(e=>e))];
  let filtradas=txt?empresas.filter(e=>e.toLowerCase().includes(txt)):empresas;
  let div=document.getElementById('listaEmpVisual');
  if(!div) return;
  if(filtradas.length>0 && txt){
    div.classList.remove('hidden');
    div.innerHTML=filtradas.slice(0,8).map(e=>`<div onclick="document.getElementById('uEmpresa').value='${e}';this.parentElement.classList.add('hidden')" class="p-2 hover:bg-cyan-500/20 cursor-pointer border-b border-white/10">🏢 ${e}</div>`).join('');
  } else if(!txt && empresas.length>0){
    div.classList.remove('hidden');
    div.innerHTML=empresas.slice(0,8).map(e=>`<div onclick="document.getElementById('uEmpresa').value='${e}';this.parentElement.classList.add('hidden')" class="p-2 hover:bg-cyan-500/20 cursor-pointer border-b border-white/10">🏢 ${e}</div>`).join('')+`<div class="p-1 text-[10px] opacity-50 text-center">Digite E para filtrar - ${empresas.length} empresas</div>`;
  } else {div.classList.add('hidden');}
}
document.addEventListener('click',function(e){let box=document.getElementById('listaEmpVisual');let input=document.getElementById('uEmpresa');let sel=document.getElementById('selEmpresaDrop');if(box &&!box.contains(e.target) && e.target!==input && e.target!==sel){box.classList.add('hidden');}});
function presetFin(){document.querySelectorAll('.chk').forEach(c=>c.checked=false);let el=document.getElementById('p_financeiro');if(el)el.checked=true;el=document.getElementById('p_relatorios');if(el)el.checked=true;}
function presetEmpresa(){document.querySelectorAll('.chk').forEach(c=>c.checked=false);let a=document.getElementById('p_abrir');if(a)a.checked=true;let b=document.getElementById('p_comentar');if(b)b.checked=true;let c=document.getElementById('p_relatorios');if(c)c.checked=true;}
function presetChefe(){document.querySelectorAll('.chk').forEach(c=>c.checked=false);['p_abrir','p_comentar','p_relatorios','p_excluir','p_chamados','p_chefe'].forEach(id=>{let e=document.getElementById(id);if(e)e.checked=true;});}
function limpCli(){['cNome','cEmpresa','cEmail','cZap','cEndereco','cNumero','cMunicipio','cEstado','cTel','cContato'].forEach(i=>{let e=document.getElementById(i);if(e)e.value='';});editCli=null;}
function addCli(){let o={id:editCli||Date.now(),nome:document.getElementById('cNome').value,empresa:document.getElementById('cEmpresa').value,email:document.getElementById('cEmail').value,zap:document.getElementById('cZap').value,endereco:document.getElementById('cEndereco').value,numero:document.getElementById('cNumero').value,municipio:document.getElementById('cMunicipio').value,estado:document.getElementById('cEstado').value,tel:document.getElementById('cTel').value,contato:document.getElementById('cContato').value};if(!o.nome||!o.empresa)return alert('Nome e Empresa');if(editCli){clientes[clientes.findIndex(c=>c.id===editCli)]=o;editCli=null;}else clientes.push(o);save();rCli();limpCli();carregaEmpresas();alert('CLIENTE SALVO!');}
function rCli(){let tipo=document.getElementById('buscaCliTipo').value,b=(document.getElementById('buscaCli')?.value||'').toLowerCase(),lista=clientes.filter(c=>{if(!b)return true;if(tipo==='tudo')return JSON.stringify(c).toLowerCase().includes(b);return (c[tipo]||'').toLowerCase().includes(b);});document.getElementById('lCli').innerHTML=lista.map(c=>`<div class="card py-2 flex justify-between"><div class="text-[13px]"><b>${c.nome}</b> - ${c.empresa}<br><span class="text-[11px]">${c.zap} | ${c.tel}</span></div><div class="flex flex-col gap-1"><button onclick="editCliF(${c.id})" class="b b-alt">ALTERAR</button><button onclick="delCli(${c.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';carregaEmpresas();}
function editCliF(id){let c=clientes.find(x=>x.id===id);document.getElementById('cNome').value=c.nome;document.getElementById('cEmpresa').value=c.empresa;document.getElementById('cEmail').value=c.email;document.getElementById('cZap').value=c.zap;document.getElementById('cEndereco').value=c.endereco;document.getElementById('cNumero').value=c.numero;document.getElementById('cMunicipio').value=c.municipio;document.getElementById('cEstado').value=c.estado;document.getElementById('cTel').value=c.tel;document.getElementById('cContato').value=c.contato;editCli=id;}
function delCli(id){if(confirm('Excluir?')){clientes=clientes.filter(x=>x.id!==id);save();rCli();carregaEmpresas();}}
  function enviarEmailChamado(chamado){let deve=document.getElementById('chkEmail').checked;if(!deve)return;let grupo=document.getElementById('chEmailGrupo').value||document.getElementById('chEmailSuporte').value;if(!grupo)return;let assunto=`[RAMOS] Novo Chamado #${chamado.id.toString().slice(-4)} - ${chamado.empresa} - ${chamado.titulo}`;let corpo=`NOVO CHAMADO ABERTO\n\nEmpresa: ${chamado.empresa}\nTitulo: ${chamado.titulo}\nCliente: ${chamado.cliente}\nPrioridade: ${chamado.prio}\nAberto por: ${chamado.quemAbriu}\nData: ${chamado.dataAbertura}\n\nDescricao:\n${chamado.desc}`;let mailto=`mailto:${grupo}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;window.open(mailto,'_blank');}
function addChamado(){let o={id:editCha||Date.now(),titulo:document.getElementById('chTitulo').value,empresa:document.getElementById('chEmpresa').value,cliente:document.getElementById('chCliente').value,prio:document.getElementById('chPrio').value,desc:document.getElementById('chDesc').value,quemAbriu:localStorage.getItem('user'),dataAbertura:new Date().toLocaleString(),dataFecho:'',quemFechou:'',status:'Aberto',comentarios:editCha?(chamados.find(x=>x.id===editCha).comentarios||[]):[]};if(!o.titulo||!o.empresa)return alert('Titulo e Empresa');if(editCha){let idx=chamados.findIndex(c=>c.id===editCha);o.quemAbriu=chamados[idx].quemAbriu;o.dataAbertura=chamados[idx].dataAbertura;chamados[idx]=o;editCha=null;save();rCha();alert('ALTERADO!');}else{chamados.push(o);save();rCha();enviarEmailChamado(o);alert('CHAMADO SALVO!');}['chTitulo','chEmpresa','chCliente','chDesc'].forEach(i=>document.getElementById(i).value='');}
function rCha(){let tipo=document.getElementById('buscaChaTipo').value,b=(document.getElementById('buscaCha')?.value||'').toLowerCase(),emp=localStorage.getItem('emp'),role=localStorage.getItem('role'),listaBase=role==='master'?chamados:chamados.filter(c=>c.empresa.toLowerCase()===emp.toLowerCase()),lista=listaBase.filter(c=>{if(!b)return true;if(tipo==='tudo')return JSON.stringify(c).toLowerCase().includes(b);return (c[tipo]||'').toLowerCase().includes(b);});document.getElementById('lCha').innerHTML=lista.slice().reverse().map(c=>`<div class="card py-2"><div class="flex justify-between"><div class="text-[13px]"><b>#${c.id.toString().slice(-4)} ${c.titulo}</b> - ${c.empresa} - ${c.status}<br><span class="text-[11px]">Aberto por ${c.quemAbriu} em ${c.dataAbertura}</span><br>${c.desc}</div><div class="flex flex-col gap-1"><button onclick="editChaF(${c.id})" class="b b-alt">ALTERAR</button><button onclick="abrirComent(${c.id})" class="b b-print">COMENTAR</button><button onclick="finalizarCha(${c.id})" class="b b-fecha">FINALIZAR</button><button onclick="delCha(${c.id})" class="b b-exc">EXCLUIR</button></div></div></div>`).join('')||'Nenhum';}
function editChaF(id){let c=chamados.find(x=>x.id===id);document.getElementById('chTitulo').value=c.titulo;document.getElementById('chEmpresa').value=c.empresa;document.getElementById('chCliente').value=c.cliente;document.getElementById('chPrio').value=c.prio;document.getElementById('chDesc').value=c.desc;editCha=id;}
function finalizarCha(id){let c=chamados.find(x=>x.id===id),u=localStorage.getItem('user');c.status='Finalizado';c.dataFecho=new Date().toLocaleString();c.quemFechou=u;save();rCha();}
function delCha(id){if(confirm('Excluir?')){chamados=chamados.filter(x=>x.id!==id);save();rCha();}}
function relCha(){let emp=localStorage.getItem('emp'),role=localStorage.getItem('role'),lista=role==='master'?chamados:chamados.filter(x=>x.empresa.toLowerCase()===emp.toLowerCase()),w=window.open('','');w.document.write(`<b>CHAMADOS - ${emp}</b><hr>`+lista.map(c=>`#${c.id} ${c.titulo}<br>`).join(''));w.print();}
function abrirComent(id){comentChaId=id;let c=chamados.find(x=>x.id===id);document.getElementById('cmtId').innerText='#'+id;document.getElementById('cmtInfo').innerHTML=`<b>${c.titulo}</b> - ${c.empresa}<br>${c.desc}`;rCmt();tab('coment');}
function rCmt(){let c=chamados.find(x=>x.id===comentChaId);document.getElementById('lCmt').innerHTML=(c.comentarios||[]).slice().reverse().map(m=>`<div class="card py-2 text-[13px]"><b>${m.user}</b> em ${m.data}<br>${m.texto}</div>`).join('')||'Sem comentarios';}
function addComent(){let txt=document.getElementById('cmtTexto').value.trim();if(!txt)return alert('Digite');let c=chamados.find(x=>x.id===comentChaId);if(!c.comentarios)c.comentarios=[];c.comentarios.push({user:localStorage.getItem('user'),data:new Date().toLocaleString(),texto:txt});save();document.getElementById('cmtTexto').value='';rCmt();rCha();}
function addFin(){let nome=document.getElementById('fiNome').value.trim(),boleto=parseFloat(document.getElementById('fiBoleto').value||0);if(!nome||!boleto)return alert('Obrigatorios');let o={id:editFin||Date.now(),nome,boleto,total:parseFloat(document.getElementById('fiTotal').value||boleto),mov:document.getElementById('fiMov').value,venc:document.getElementById('fiVenc').value,pagoData:document.getElementById('fiPagoData').value,pagoVal:parseFloat(document.getElementById('fiPagoVal').value||0),multa:parseFloat(document.getElementById('fiMulta').value||0),empresa:document.getElementById('fiEmp').value,produto:document.getElementById('fiProd').value,desc:document.getElementById('fiDesc').value};if(editFin){fins[fins.findIndex(x=>x.id===editFin)]=o;editFin=null;}else fins.push(o);save();rFin();}
function rFin(){document.getElementById('lFin').innerHTML=fins.slice().reverse().map(f=>`<div class="card py-2 flex justify-between"><div class="text-[13px]"><b>${f.nome}</b> R$${f.boleto}</div><div class="flex flex-col gap-1"><button onclick="editFinF(${f.id})" class="b b-alt">ALTERAR</button><button onclick="delFin(${f.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editFinF(id){let f=fins.find(x=>x.id===id);document.getElementById('fiNome').value=f.nome;document.getElementById('fiBoleto').value=f.boleto;document.getElementById('fiMov').value=f.mov;document.getElementById('fiVenc').value=f.venc;document.getElementById('fiPagoData').value=f.pagoData;document.getElementById('fiTotal').value=f.total;document.getElementById('fiPagoVal').value=f.pagoVal;document.getElementById('fiMulta').value=f.multa;document.getElementById('fiEmp').value=f.empresa;document.getElementById('fiProd').value=f.produto;document.getElementById('fiDesc').value=f.desc;editFin=id;}
function delFin(id){if(confirm('Excluir?')){fins=fins.filter(x=>x.id!==id);save();rFin();}}
function impFin(){let w=window.open('','');w.document.write(fins.map(f=>`Nome:${f.nome} Boleto:R$${f.boleto}<br>`).join(''));w.print();}
function addEst(){let prod=document.getElementById('esProd').value.trim(),qtd=document.getElementById('esQtd').value;if(!prod||!qtd)return alert('Obrigatorios');let o={id:editEst||Date.now(),prod,qtd,ent:document.getElementById('esEnt').value,sai:document.getElementById('esSai').value};if(editEst){ests[ests.findIndex(x=>x.id===editEst)]=o;editEst=null;}else ests.push(o);save();rEst();}
function rEst(){document.getElementById('lEst').innerHTML=ests.slice().reverse().map(e=>`<div class="card py-2 flex justify-between"><div class="text-[13px]"><b>${e.prod}</b> Qtd ${e.qtd}</div><div class="flex gap-1"><button onclick="editEstF(${e.id})" class="b b-alt">ALTERAR</button><button onclick="delEst(${e.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editEstF(id){let e=ests.find(x=>x.id===id);document.getElementById('esProd').value=e.prod;document.getElementById('esQtd').value=e.qtd;document.getElementById('esEnt').value=e.ent;document.getElementById('esSai').value=e.sai;editEst=id;}
function delEst(id){if(confirm('Excluir?')){ests=ests.filter(x=>x.id!==id);save();rEst();}}
function relEst(){let w=window.open('','');w.document.write(ests.map(e=>`${e.prod} Qtd:${e.qtd}<br>`).join(''));w.print();}
function addRem(){let o={id:editRem||Date.now(),cli:document.getElementById('reCli').value,emp:document.getElementById('reEmp').value,any:document.getElementById('reAny').value,team:document.getElementById('reTeam').value,senha:document.getElementById('reSenha').value,obs:document.getElementById('reObs').value};if(!o.cli)return alert('Cliente');if(editRem){rems[rems.findIndex(x=>x.id===editRem)]=o;editRem=null;}else rems.push(o);save();rRem();}
function rRem(){document.getElementById('lRem').innerHTML=rems.map(r=>`<div class="card py-2 flex justify-between"><div class="text-[13px]"><b>${r.cli}</b> ${r.any}</div><div class="flex flex-col gap-1"><button onclick="editRemF(${r.id})" class="b b-alt">ALTERAR</button><button onclick="delRem(${r.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editRemF(id){let r=rems.find(x=>x.id===id);document.getElementById('reCli').value=r.cli;document.getElementById('reEmp').value=r.emp;document.getElementById('reAny').value=r.any;document.getElementById('reTeam').value=r.team;document.getElementById('reSenha').value=r.senha;document.getElementById('reObs').value=r.obs;editRem=id;}
function delRem(id){if(confirm('Excluir?')){rems=rems.filter(x=>x.id!==id);save();rRem();}}
function getPerms(){let g=id=>{let e=document.getElementById(id);return e?e.checked:false;};return {clientes:g('p_clientes'),chamados:g('p_chamados'),abrir:g('p_abrir'),comentar:g('p_comentar'),financeiro:g('p_financeiro'),meufin:false,estoque:g('p_estoque'),remote:false,relatorios:g('p_relatorios'),excluir:g('p_excluir'),chefe:g('p_chefe'),usuarios:g('p_usuarios')};}
function setPerms(p){let s=(id,v)=>{let e=document.getElementById(id);if(e)e.checked=!!v;};s('p_clientes',p.clientes);s('p_chamados',p.chamados);s('p_abrir',p.abrir);s('p_comentar',p.comentar);s('p_financeiro',p.financeiro);s('p_estoque',p.estoque);s('p_relatorios',p.relatorios);s('p_excluir',p.excluir);s('p_chefe',p.chefe);s('p_usuarios',p.usuarios);}
function addUs(){let emp=document.getElementById('uEmpresa').value.trim(),nome=document.getElementById('uNome').value.trim(),senha=document.getElementById('uSenha').value.trim();if(!emp||!nome||!senha)return alert('Preencha Empresa, Usuario e Senha');let perms=getPerms();if(editUs!==null){let idx=users.findIndex(u=>u.id===editUs);users[idx]={...users[idx],nome,empresa:emp,senha,perms,chefe:perms.chefe};editUs=null;}else{if(users.some(u=>u.nome.toLowerCase()===nome.toLowerCase()&&u.empresa.toLowerCase()===emp.toLowerCase()))return alert('Usuario ja existe nessa empresa');users.push({id:Date.now(),nome,empresa:emp,senha,perms,chefe:perms.chefe,bloqueado:false});}save();rUs();['uEmpresa','uNome','uSenha'].forEach(i=>{let e=document.getElementById(i);if(e)e.value='';});document.querySelectorAll('.chk').forEach(c=>c.checked=false);let ab=document.getElementById('p_abrir');if(ab)ab.checked=true;alert('USUARIO SALVO! Empresa:'+emp+' Usuario:'+nome);carregaEmpresas();}
function rUs(){document.getElementById('lUs').innerHTML=users.map(u=>`<div class="card py-2"><div class="flex justify-between"><span class="text-[12px]"><b>${u.nome}</b> - ${u.empresa}<br>Senha:${u.senha}<br>${Object.keys(u.perms||{}).filter(k=>u.perms[k]).join(', ')}</span><div class="flex flex-col gap-1"><button onclick="editUsF(${u.id})" class="b b-alt">ALTERAR</button><button onclick="toggleBloq(${u.id})" class="b ${u.bloqueado?'b-fecha':'b-ver'}">${u.bloqueado?'DESBLOQ':'BLOQ'}</button><button onclick="delUs(${u.id})" class="b b-exc">EXCLUIR</button></div></div></div>`).join('')||'Nenhum';}
function editUsF(id){let u=users.find(x=>x.id===id);document.getElementById('uEmpresa').value=u.empresa;document.getElementById('uNome').value=u.nome;document.getElementById('uSenha').value=u.senha;setPerms(u.perms||{});editUs=id;tab('usuarios');}
function toggleBloq(id){let u=users.find(x=>x.id===id);u.bloqueado=!u.bloqueado;save();rUs();}
function delUs(id){if(confirm('Excluir?')){users=users.filter(x=>x.id!==id);save();rUs();}}
function relUs(){let e=prompt('Empresa:'),lista=e?users.filter(u=>u.empresa.toLowerCase().includes(e.toLowerCase())):users,w=window.open('','');w.document.write(lista.map(u=>`${u.nome} ${u.empresa}<br>`).join(''));w.print();}
function gerarRelatorioTudo(){let emp=localStorage.getItem('emp'),role=localStorage.getItem('role'),mod=document.getElementById('relModulo').value,listaCli=role==='master'?clientes:clientes.filter(c=>c.empresa.toLowerCase()===emp.toLowerCase()),listaCha=role==='master'?chamados:chamados.filter(c=>c.empresa.toLowerCase()===emp.toLowerCase()),listaFin=role==='master'?fins:fins.filter(f=>(f.empresa||'').toLowerCase()===emp.toLowerCase()),html=`<div style="text-align:center"><b>RAMOS - ${mod.toUpperCase()} - ${emp}<br>${new Date().toLocaleString()}</b><hr></div>`;if(mod==='clientes'||mod==='tudo')html+=`<b>CLIENTES - ${listaCli.length}</b><br>`+listaCli.map(c=>`${c.nome} | ${c.empresa}<br>`).join('')+'<hr>';if(mod==='chamados'||mod==='tudo')html+=`<b>CHAMADOS - ${listaCha.length}</b><br>`+listaCha.map(c=>`#${c.id.toString().slice(-4)} ${c.titulo} | ${c.empresa}<br>`).join('');document.getElementById('rCon').innerHTML=html;let w=window.open('','');w.document.write(html);w.print();}
function rAll(){carregaEmpresas();rCli();rCha();rFin();rEst();rRem();rUs();}
window.addEventListener('load',()=>{clearLogin();if(localStorage.getItem('log')==='1')show();else rAll();});
</script></body></html>
