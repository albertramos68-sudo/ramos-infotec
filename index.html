<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAMOS V55 PERMISSOES</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#070d1e;color:#e2e8f0}.glass{background:rgba(15,23,42,.98);border:1px solid #00D9FF33}.lb{font-size:9px;color:#7dd3fc;font-weight:800;display:block;margin-bottom:3px}.inp{background:#0f172a;border:1px solid #00D9FF55;color:#fff;padding:8px;border-radius:8px;width:100%;font-size:11px}.tab{display:none}.tab.active{display:block!important}.menu-btn{width:100%;text-align:left;padding:8px;border-radius:8px;font-size:11px;color:#94a3b8}.menu-btn.active{background:#00D9FF22;color:#00D9FF;border:1px solid #00D9FF55}.card{background:rgba(15,23,42,.9);border:1px solid #00D9FF22;border-radius:12px;padding:10px}.b{padding:5px 9px;border-radius:6px;font-size:9px;font-weight:800;color:#fff;border:none;cursor:pointer}.b-inc{background:#0891b2}.b-alt{background:#2563eb}.b-exc{background:#dc2626}.b-ver{background:#334155}.b-fecha{background:#16a34a}.b-print{background:#0e7490}.chk{width:14px;height:14px;accent-color:#00D9FF}</style></head><body>
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="glass p-7 rounded-2xl w-full max-w-sm"><div class="text-center mb-5"><div class="w-12 h-12 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-xl mx-auto flex items-center justify-center font-black">RI</div><h1 class="text-cyan-400 font-black mt-2 text-sm">RAMOS V55</h1><p class="text-[8px] opacity-60">PERMISSOES COM TICKS</p></div>
<label class="lb">Empresa</label><input id="empresa" class="inp mb-2"><label class="lb">Usuario</label><input id="usuario" class="inp mb-2"><label class="lb">Senha</label><div class="flex gap-1 mb-4"><input id="senha" type="password" class="inp"><button onclick="document.getElementById('senha').type=document.getElementById('senha').type==='password'?'text':'password'" class="b b-ver">👁️</button></div>
<button onclick="login()" class="w-full py-3 rounded-xl bg-cyan-500 text-black font-black text-sm">ENTRAR V55</button></div></div>
<div id="app" class="hidden min-h-screen flex"><div class="w-60 glass border-r p-2 overflow-auto"><p class="font-bold text-cyan-400 text-[11px]">RAMOS V55</p><p id="uInfo" class="text-[7px] opacity-50 mb-2">-</p><nav id="menuM" class="space-y-1"></nav><button onclick="logout()" class="w-full mt-3 py-2 rounded bg-red-500/10 border border-red-500/20 text-red-400 text-[9px] font-bold">SAIR</button></div><div class="flex-1 p-2 overflow-auto">
<div id="t-clientes" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-[11px]">CLIENTES</h2><div class="flex gap-2 mt-2"><input id="buscaCli" class="inp" placeholder="LOCALIZAR" oninput="rCli()"><button onclick="rCli()" class="b b-ver">BUSCAR</button></div><div class="grid grid-cols-2 gap-2 mt-2"><input id="cNome" class="inp" placeholder="Nome*"><input id="cEmpresa" class="inp" placeholder="Empresa*"><input id="cEmail" class="inp" placeholder="Email"><input id="cZap" class="inp" placeholder="WhatsApp*"><input id="cEndereco" class="inp" placeholder="Endereco"><input id="cNumero" class="inp" placeholder="Numero"><input id="cMunicipio" class="inp" placeholder="Municipio"><input id="cEstado" class="inp" placeholder="Estado"><input id="cTel" class="inp" placeholder="Telefone"><input id="cContato" class="inp" placeholder="Contato"></div><div class="flex gap-2 mt-2"><button onclick="addCli()" class="b b-inc">INCLUIR</button><button onclick="limpCli()" class="b b-ver">LIMPAR</button></div><div id="lCli" class="mt-3 space-y-1"></div></div></div>
<div id="t-chamados" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-[11px]">CHAMADOS COM COMENTARIOS</h2><div class="grid grid-cols-3 gap-2 mt-2"><input id="chTitulo" class="inp" placeholder="Titulo*"><input id="chEmpresa" class="inp" placeholder="Empresa*"><select id="chPrio" class="inp"><option>Baixa</option><option>Media</option><option>Alta</option><option>Urgente</option></select><input id="chCliente" class="inp col-span-3" placeholder="Cliente"><textarea id="chDesc" class="inp h-12 col-span-3" placeholder="Descricao*"></textarea></div><div class="flex gap-1 mt-2"><button onclick="addChamado()" class="b b-inc">INCLUIR</button><button onclick="relCha()" class="b b-print">RELATORIO</button></div><div id="lCha" class="mt-3 space-y-1"></div></div></div>
<div id="t-financeiro" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-[11px]">FINANCEIRO</h2><div class="grid grid-cols-3 gap-2 mt-2"><input id="fiNome" class="inp" placeholder="Nome*"><input id="fiBoleto" type="number" class="inp" placeholder="Boleto*"><select id="fiMov" class="inp"><option>Saida</option><option>Entrada</option></select><input id="fiVenc" type="date" class="inp"><input id="fiPagoData" type="date" class="inp"><input id="fiTotal" type="number" class="inp" placeholder="Total"><input id="fiPagoVal" type="number" class="inp" placeholder="Pago"><input id="fiMulta" type="number" class="inp" placeholder="Multa"><input id="fiEmp" class="inp" placeholder="Empresa"><input id="fiProd" class="inp" placeholder="Produto"><input id="fiDesc" class="inp col-span-3" placeholder="Descricao*"></div><div class="flex gap-1 mt-2"><button onclick="addFin()" class="b b-inc">INCLUIR</button><button onclick="impFin()" class="b b-print">FORM</button></div><div id="lFin" class="mt-2 space-y-1"></div></div></div>
<div id="t-meufin" class="tab"><div class="card"><h2 class="text-yellow-400 font-bold text-[11px]">MEU PRIVADO</h2><div class="grid grid-cols-3 gap-2 mt-2"><input id="meNome" class="inp" placeholder="Nome*"><input id="meBoleto" type="number" class="inp" placeholder="Boleto*"><select id="meMov" class="inp"><option>Saida</option><option>Entrada</option></select><input id="meVenc" type="date" class="inp"><input id="mePagoData" type="date" class="inp"><input id="meTotal" type="number" class="inp" placeholder="Total"><input id="mePagoVal" type="number" class="inp" placeholder="Pago"><input id="meMulta" type="number" class="inp" placeholder="Multa"><input id="meDesc" class="inp col-span-3" placeholder="Descricao*"></div><div class="flex gap-1 mt-2"><button onclick="addMeu()" class="b b-inc bg-yellow-600">INCLUIR</button></div><div id="lMeu" class="mt-2 space-y-1"></div></div></div>
<div id="t-estoque" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-[11px]">ESTOQUE</h2><div class="grid grid-cols-4 gap-2 mt-2"><input id="esProd" class="inp" placeholder="Produto*"><input id="esQtd" type="number" class="inp" placeholder="Qtd*"><input id="esEnt" type="date" class="inp"><input id="esSai" type="date" class="inp"></div><div class="flex gap-1 mt-2"><button onclick="addEst()" class="b b-inc">INCLUIR</button><button onclick="relEst()" class="b b-print">REL</button></div><div id="lEst" class="mt-2 space-y-1"></div></div></div>
<div id="t-remote" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-[11px]">REMOTO</h2><div class="grid grid-cols-3 gap-2 mt-2"><input id="reCli" class="inp" placeholder="Cliente*"><input id="reEmp" class="inp" placeholder="Empresa"><input id="reAny" class="inp" placeholder="AnyDesk"><input id="reTeam" class="inp" placeholder="TeamViewer"><input id="reSenha" type="text" class="inp" placeholder="Senha"><input id="reObs" class="inp" placeholder="Obs"></div><div class="flex gap-1 mt-2"><button onclick="addRem()" class="b b-inc">INCLUIR</button></div><div id="lRem" class="mt-2 space-y-1"></div></div></div>
<div id="t-usuarios" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-[11px]">USUARIOS - PERMISSOES COM TICK</h2><div class="grid grid-cols-3 gap-2 mt-2"><input id="uEmpresa" class="inp" placeholder="Empresa*"><input id="uNome" class="inp" placeholder="Usuario*"><div class="flex gap-1"><input id="uSenha" type="text" class="inp" placeholder="Senha*"><button onclick="document.getElementById('uSenha').type=document.getElementById('uSenha').type==='text'?'password':'text'" class="b b-ver">👁️</button></div></div>
<div class="mt-3 p-2 bg-slate-800 rounded"><p class="text-[10px] font-bold text-cyan-400 mb-2">MARQUE O QUE O USUARIO PODE USAR:</p><div class="grid grid-cols-2 gap-2 text-[10px]">
<label class="flex items-center gap-2"><input type="checkbox" id="p_clientes" class="chk"> Clientes</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_chamados" class="chk"> Ver Chamados</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_abrir" class="chk" checked> Abrir Chamado</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_comentar" class="chk"> Inserir Comentarios</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_financeiro" class="chk"> Financeiro</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_meufin" class="chk"> Meu Privado</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_estoque" class="chk"> Estoque</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_remote" class="chk"> Remoto</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_relatorios" class="chk"> Relatorios</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_excluir" class="chk"> Pode EXCLUIR</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_chefe" class="chk"> Chefe da Empresa</label>
<label class="flex items-center gap-2"><input type="checkbox" id="p_usuarios" class="chk"> Gerenciar Usuarios</label>
</div><div class="mt-2 flex gap-2"><button onclick="presetFin()" class="b b-print text-[8px]">PERFIL FINANCEIRO</button><button onclick="presetEmpresa()" class="b b-ver text-[8px]">PERFIL EMPRESA</button><button onclick="presetChefe()" class="b b-fecha text-[8px]">PERFIL CHEFE</button></div></div>
<div class="flex gap-1 mt-3"><button onclick="addUs()" class="b b-inc w-full py-2">SALVAR USUARIO COM PERMISSOES</button><button onclick="relUs()" class="b b-print">REL POR EMPRESA</button></div><div id="lUs" class="mt-2 space-y-1"></div></div></div>
<div id="t-relatorios" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-[11px]">RELATORIOS</h2><div class="flex gap-1 mt-2"><select id="relModulo" class="inp w-32 text-[9px]"><option value="tudo">TUDO</option><option value="clientes">Clientes</option><option value="chamados">Chamados</option><option value="financeiro">Financeiro</option><option value="estoque">Estoque</option></select><button onclick="gerarRelatorioTudo()" class="b b-inc">GERAR</button></div><div id="rRes" class="mt-2 bg-white text-black p-3 rounded"><div id="rCon" class="text-[10px]">Relatorio</div></div></div></div>
<div id="t-coment" class="tab"><div class="card"><h2 class="text-cyan-400 font-bold text-[11px]">COMENTARIOS <span id="cmtId"></span></h2><div id="cmtInfo" class="text-[10px] my-2 p-2 bg-slate-800 rounded"></div><div class="flex gap-2"><input id="cmtTexto" class="inp" placeholder="Escreva seu comentario..."><button onclick="addComent()" class="b b-inc">ENVIAR</button></div><div id="lCmt" class="mt-3 space-y-1"></div><button onclick="tab('chamados')" class="b b-ver mt-3">VOLTAR</button></div></div>
</div></div>
<script>
let clientes=JSON.parse(localStorage.getItem('v55_cli')||'[]'),chamados=JSON.parse(localStorage.getItem('v55_cha')||'[]'),fins=JSON.parse(localStorage.getItem('v55_fin')||'[]'),meus=JSON.parse(localStorage.getItem('v55_meu')||'[]'),ests=JSON.parse(localStorage.getItem('v55_est')||'[]'),rems=JSON.parse(localStorage.getItem('v55_rem')||'[]'),users=JSON.parse(localStorage.getItem('v55_usr')||'[]'),editCli=null,editFin=null,editMeu=null,editEst=null,editRem=null,editCha=null,editUs=null,comentChaId=null;
function save(){localStorage.setItem('v55_cli',JSON.stringify(clientes));localStorage.setItem('v55_cha',JSON.stringify(chamados));localStorage.setItem('v55_fin',JSON.stringify(fins));localStorage.setItem('v55_meu',JSON.stringify(meus));localStorage.setItem('v55_est',JSON.stringify(ests));localStorage.setItem('v55_rem',JSON.stringify(rems));localStorage.setItem('v55_usr',JSON.stringify(users));}
function login(){let emp=document.getElementById('empresa').value.trim(),usu=document.getElementById('usuario').value.trim(),sen=document.getElementById('senha').value.trim();if(!emp||!usu||!sen)return alert('Preencha');if(emp.toLowerCase()==='ramosinfotec'&&usu==='admin'&&sen==='@Xumone@197353'){localStorage.setItem('log','1');localStorage.setItem('role','master');localStorage.setItem('user',usu);localStorage.setItem('emp','RAMOS');localStorage.setItem('perm',JSON.stringify({clientes:true,chamados:true,abrir:true,comentar:true,financeiro:true,meufin:true,estoque:true,remote:true,relatorios:true,excluir:true,chefe:true,usuarios:true}));show();return;}let u=users.find(x=>x.empresa.toLowerCase()===emp.toLowerCase()&&x.nome===usu&&x.senha===sen);if(!u)u=users.find(x=>x.nome===usu&&x.senha===sen);if(u){if(u.bloqueado)return alert('BLOQUEADO');localStorage.setItem('log','1');localStorage.setItem('role',u.chefe?'chefe':'user');localStorage.setItem('user',usu);localStorage.setItem('emp',u.empresa);localStorage.setItem('perm',JSON.stringify(u.perms));show();return;}alert('Nao encontrado');}
function show(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');let r=localStorage.getItem('role'),u=localStorage.getItem('user'),e=localStorage.getItem('emp'),perm=JSON.parse(localStorage.getItem('perm')||'{}');document.getElementById('uInfo').innerText=u+' - '+e+' ('+r+')';buildMenu(perm,r);rAll();}
function buildMenu(p,r){let menu=document.getElementById('menuM'),html='';html+= (r==='master'||p.clientes||p.chefe)?`<button onclick="tab('clientes')" class="menu-btn">👥 Clientes</button>`:'';
html+= (r==='master'||p.chamados||p.abrir||p.chefe)?`<button onclick="tab('chamados')" class="menu-btn">📋 Chamados</button>`:'';
html+= (r==='master'||p.financeiro||p.chefe)?`<button onclick="tab('financeiro')" class="menu-btn">💰 Financeiro</button>`:'';
html+= (r==='master'||p.meufin)?`<button onclick="tab('meufin')" class="menu-btn">🔒 Meu Privado</button>`:'';
html+= (r==='master'||p.estoque||p.chefe)?`<button onclick="tab('estoque')" class="menu-btn">📦 Estoque</button>`:'';
html+= (r==='master'||p.remote||p.chefe)?`<button onclick="tab('remote')" class="menu-btn">🖥️ Remoto</button>`:'';
html+= (r==='master'||p.usuarios||p.chefe)?`<button onclick="tab('usuarios')" class="menu-btn">👤 Usuarios (Ticks)</button>`:'';
html+= (r==='master'||p.relatorios||p.chefe)?`<button onclick="tab('relatorios')" class="menu-btn">📊 Relatorios</button>`:'';
if(html===''){html=`<button onclick="tab('chamados')" class="menu-btn">➕ Abrir Chamado</button><button onclick="tab('relatorios')" class="menu-btn">📊 Meus Relatorios</button>`;}
menu.innerHTML=html; setTimeout(()=>{let first=menu.querySelector('.menu-btn'); if(first) first.click(); else tab('chamados');},100);}
function logout(){localStorage.removeItem('log');location.reload();}
function tab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));let el=document.getElementById('t-'+id); if(el) el.classList.add('active');}
function presetFin(){document.querySelectorAll('.chk').forEach(c=>c.checked=false);document.getElementById('p_financeiro').checked=true;document.getElementById('p_relatorios').checked=true;}
function presetEmpresa(){document.querySelectorAll('.chk').forEach(c=>c.checked=false);document.getElementById('p_abrir').checked=true;document.getElementById('p_comentar').checked=true;}
function presetChefe(){document.querySelectorAll('.chk').forEach(c=>c.checked=false);document.getElementById('p_abrir').checked=true;document.getElementById('p_comentar').checked=true;document.getElementById('p_relatorios').checked=true;document.getElementById('p_excluir').checked=true;document.getElementById('p_chamados').checked=true;document.getElementById('p_chefe').checked=true;}
function limpCli(){['cNome','cEmpresa','cEmail','cZap','cEndereco','cNumero','cMunicipio','cEstado','cTel','cContato'].forEach(i=>{let e=document.getElementById(i);if(e)e.value='';});editCli=null;}
function addCli(){let o={id:editCli||Date.now(),nome:document.getElementById('cNome').value,empresa:document.getElementById('cEmpresa').value,email:document.getElementById('cEmail').value,zap:document.getElementById('cZap').value,endereco:document.getElementById('cEndereco').value,numero:document.getElementById('cNumero').value,municipio:document.getElementById('cMunicipio').value,estado:document.getElementById('cEstado').value,tel:document.getElementById('cTel').value,contato:document.getElementById('cContato').value};if(!o.nome||!o.empresa)return alert('Nome e Empresa');if(editCli){clientes[clientes.findIndex(c=>c.id===editCli)]=o;editCli=null;}else clientes.push(o);save();rCli();limpCli();alert('CLIENTE SALVO!');}
function rCli(){let b=(document.getElementById('buscaCli')?.value||'').toLowerCase(),lista=clientes.filter(c=>!b||c.nome.toLowerCase().includes(b)||c.empresa.toLowerCase().includes(b));let perm=JSON.parse(localStorage.getItem('perm')||'{}'),canEx=localStorage.getItem('role')==='master'||perm.excluir||perm.chefe;document.getElementById('lCli').innerHTML=lista.map(c=>`<div class="card py-1 flex justify-between"><div class="text-[9px]"><b>${c.nome}</b> ${c.empresa} ${c.zap}</div><div class="flex flex-col gap-1"><button onclick="editCliF(${c.id})" class="b b-alt">ALTERAR</button>${canEx?`<button onclick="delCli(${c.id})" class="b b-exc">EXCLUIR</button>`:''}</div></div>`).join('')||'Nenhum';}
function editCliF(id){let c=clientes.find(x=>x.id===id);document.getElementById('cNome').value=c.nome;document.getElementById('cEmpresa').value=c.empresa;document.getElementById('cEmail').value=c.email;document.getElementById('cZap').value=c.zap;document.getElementById('cEndereco').value=c.endereco;document.getElementById('cNumero').value=c.numero;document.getElementById('cMunicipio').value=c.municipio;document.getElementById('cEstado').value=c.estado;document.getElementById('cTel').value=c.tel;document.getElementById('cContato').value=c.contato;editCli=id;}
function delCli(id){if(confirm('Excluir?')){clientes=clientes.filter(x=>x.id!==id);save();rCli();}}
function addChamado(){let o={id:editCha||Date.now(),titulo:document.getElementById('chTitulo').value,empresa:document.getElementById('chEmpresa').value,cliente:document.getElementById('chCliente').value,prio:document.getElementById('chPrio').value,desc:document.getElementById('chDesc').value,quemAbriu:localStorage.getItem('user'),dataAbertura:new Date().toLocaleString(),dataFecho:'',quemFechou:'',status:'Aberto',comentarios:editCha?(chamados.find(x=>x.id===editCha).comentarios||[]):[]};if(!o.titulo||!o.empresa)return alert('Obrigatorios');if(editCha){let idx=chamados.findIndex(c=>c.id===editCha);o.quemAbriu=chamados[idx].quemAbriu;o.dataAbertura=chamados[idx].dataAbertura;chamados[idx]=o;editCha=null;}else chamados.push(o);save();rCha();['chTitulo','chEmpresa','chCliente','chDesc'].forEach(i=>document.getElementById(i).value='');alert('CHAMADO SALVO!');}
function rCha(){let emp=localStorage.getItem('emp'),role=localStorage.getItem('role'),lista=role==='master'?chamados:chamados.filter(c=>c.empresa.toLowerCase()===emp.toLowerCase());let perm=JSON.parse(localStorage.getItem('perm')||'{}'),canEx=role==='master'||perm.excluir||perm.chefe;document.getElementById('lCha').innerHTML=lista.slice().reverse().map(c=>`<div class="card py-1"><div class="flex justify-between"><div class="text-[9px]"><b>#${c.id.toString().slice(-4)} ${c.titulo}</b> ${c.empresa} ${c.prio} ${c.status}<br>${c.desc}<br>💬 ${c.comentarios?.length||0} comentarios</div><div class="flex flex-col gap-1"><button onclick="editChaF(${c.id})" class="b b-alt">ALTERAR</button><button onclick="abrirComent(${c.id})" class="b b-print">COMENTAR</button><button onclick="finalizarCha(${c.id})" class="b b-fecha">FINALIZAR</button>${canEx?`<button onclick="delCha(${c.id})" class="b b-exc">EXCLUIR</button>`:''}</div></div></div>`).join('')||'Nenhum';}
function editChaF(id){let c=chamados.find(x=>x.id===id);document.getElementById('chTitulo').value=c.titulo;document.getElementById('chEmpresa').value=c.empresa;document.getElementById('chCliente').value=c.cliente;document.getElementById('chPrio').value=c.prio;document.getElementById('chDesc').value=c.desc;editCha=id;}
function finalizarCha(id){let c=chamados.find(x=>x.id===id),u=localStorage.getItem('user');c.status='Finalizado';c.dataFecho=new Date().toLocaleString();c.quemFechou=u;save();rCha();alert('FINALIZADO POR '+u);}
function delCha(id){if(confirm('Excluir?')){chamados=chamados.filter(x=>x.id!==id);save();rCha();}}
function relCha(){let w=window.open('','');w.document.write(`<div><b>RAMOS</b><hr></div>`+chamados.map(c=>`#${c.id} ${c.titulo}<br>`).join(''));w.print();}
function abrirComent(id){comentChaId=id;let c=chamados.find(x=>x.id===id);document.getElementById('cmtId').innerText='#'+id;document.getElementById('cmtInfo').innerHTML=`<b>${c.titulo}</b> - ${c.empresa}<br>${c.desc}`;rCmt();tab('coment');}
function rCmt(){let c=chamados.find(x=>x.id===comentChaId);document.getElementById('lCmt').innerHTML=(c.comentarios||[]).slice().reverse().map(m=>`<div class="card py-1 text-[9px]"><b>${m.user}</b> em ${m.data}<br>${m.texto}</div>`).join('')||'Sem comentarios';}
function addComent(){let txt=document.getElementById('cmtTexto').value.trim();if(!txt)return alert('Digite');let c=chamados.find(x=>x.id===comentChaId);if(!c.comentarios)c.comentarios=[];c.comentarios.push({user:localStorage.getItem('user'),data:new Date().toLocaleString(),texto:txt});save();document.getElementById('cmtTexto').value='';rCmt();rCha();alert('COMENTARIO INSERIDO!');}
function addFin(){let nome=document.getElementById('fiNome').value.trim(),boleto=parseFloat(document.getElementById('fiBoleto').value||0);if(!nome||!boleto)return alert('Obrigatorios');let o={id:editFin||Date.now(),nome,boleto,total:parseFloat(document.getElementById('fiTotal').value||boleto),mov:document.getElementById('fiMov').value,venc:document.getElementById('fiVenc').value,pagoData:document.getElementById('fiPagoData').value,pagoVal:parseFloat(document.getElementById('fiPagoVal').value||0),multa:parseFloat(document.getElementById('fiMulta').value||0),empresa:document.getElementById('fiEmp').value,produto:document.getElementById('fiProd').value,desc:document.getElementById('fiDesc').value};if(editFin){fins[fins.findIndex(x=>x.id===editFin)]=o;editFin=null;}else fins.push(o);save();rFin();alert('FINANCEIRO SALVO!');}
function rFin(){document.getElementById('lFin').innerHTML=fins.slice().reverse().map(f=>`<div class="card py-1 flex justify-between"><div class="text-[9px]"><b>${f.nome}</b> R$${f.boleto}</div><div class="flex flex-col gap-1"><button onclick="editFinF(${f.id})" class="b b-alt">ALTERAR</button><button onclick="delFin(${f.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editFinF(id){let f=fins.find(x=>x.id===id);document.getElementById('fiNome').value=f.nome;document.getElementById('fiBoleto').value=f.boleto;document.getElementById('fiMov').value=f.mov;document.getElementById('fiVenc').value=f.venc;document.getElementById('fiPagoData').value=f.pagoData;document.getElementById('fiTotal').value=f.total;document.getElementById('fiPagoVal').value=f.pagoVal;document.getElementById('fiMulta').value=f.multa;document.getElementById('fiEmp').value=f.empresa;document.getElementById('fiProd').value=f.produto;document.getElementById('fiDesc').value=f.desc;editFin=id;}
function delFin(id){if(confirm('Excluir?')){fins=fins.filter(x=>x.id!==id);save();rFin();}}
function impFin(){let w=window.open('','');w.document.write(`<div><b>RAMOS FINANCEIRO</b><hr></div>`+fins.map(f=>`<div>Nome:${f.nome}<br>Boleto:R$${f.boleto}</div>`).join(''));w.print();}
function addMeu(){let nome=document.getElementById('meNome').value.trim(),boleto=parseFloat(document.getElementById('meBoleto').value||0);if(!nome||!boleto)return alert('Obrigatorios');let o={id:editMeu||Date.now(),nome,boleto,total:parseFloat(document.getElementById('meTotal').value||boleto),mov:document.getElementById('meMov').value,venc:document.getElementById('meVenc').value,pagoData:document.getElementById('mePagoData').value,pagoVal:parseFloat(document.getElementById('mePagoVal').value||0),multa:parseFloat(document.getElementById('meMulta').value||0),desc:document.getElementById('meDesc').value};if(editMeu){meus[meus.findIndex(x=>x.id===editMeu)]=o;editMeu=null;}else meus.push(o);save();rMeu();alert('MEU PRIVADO SALVO!');}
function rMeu(){document.getElementById('lMeu').innerHTML=meus.slice().reverse().map(f=>`<div class="card py-1 flex justify-between"><div class="text-[9px]"><b>${f.nome}</b> R$${f.boleto}</div><div class="flex flex-col gap-1"><button onclick="editMeuF(${f.id})" class="b b-alt">ALTERAR</button><button onclick="delMeu(${f.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editMeuF(id){let f=meus.find(x=>x.id===id);document.getElementById('meNome').value=f.nome;document.getElementById('meBoleto').value=f.boleto;document.getElementById('meMov').value=f.mov;document.getElementById('meVenc').value=f.venc;document.getElementById('mePagoData').value=f.pagoData;document.getElementById('meTotal').value=f.total;document.getElementById('mePagoVal').value=f.pagoVal;document.getElementById('meMulta').value=f.multa;document.getElementById('meDesc').value=f.desc;editMeu=id;}
function delMeu(id){if(confirm('Excluir?')){meus=meus.filter(x=>x.id!==id);save();rMeu();}}
function addEst(){let prod=document.getElementById('esProd').value.trim(),qtd=document.getElementById('esQtd').value;if(!prod||!qtd)return alert('Obrigatorios');let o={id:editEst||Date.now(),prod,qtd,ent:document.getElementById('esEnt').value,sai:document.getElementById('esSai').value};if(editEst){ests[ests.findIndex(x=>x.id===editEst)]=o;editEst=null;}else ests.push(o);save();rEst();alert('ESTOQUE SALVO!');}
function rEst(){document.getElementById('lEst').innerHTML=ests.slice().reverse().map(e=>`<div class="card py-1 flex justify-between"><div class="text-[9px]"><b>${e.prod}</b> Qtd ${e.qtd}</div><div class="flex gap-1"><button onclick="editEstF(${e.id})" class="b b-alt">ALTERAR</button><button onclick="delEst(${e.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editEstF(id){let e=ests.find(x=>x.id===id);document.getElementById('esProd').value=e.prod;document.getElementById('esQtd').value=e.qtd;document.getElementById('esEnt').value=e.ent;document.getElementById('esSai').value=e.sai;editEst=id;}
function delEst(id){if(confirm('Excluir?')){ests=ests.filter(x=>x.id!==id);save();rEst();}}
function relEst(){let w=window.open('','');w.document.write(`<b>RAMOS ESTOQUE</b><hr>`+ests.map(e=>`${e.prod} Qtd:${e.qtd}<br>`).join(''));w.print();}
function addRem(){let o={id:editRem||Date.now(),cli:document.getElementById('reCli').value,emp:document.getElementById('reEmp').value,any:document.getElementById('reAny').value,team:document.getElementById('reTeam').value,senha:document.getElementById('reSenha').value,obs:document.getElementById('reObs').value};if(!o.cli)return alert('Cliente');if(editRem){rems[rems.findIndex(x=>x.id===editRem)]=o;editRem=null;}else rems.push(o);save();rRem();alert('REMOTO SALVO!');}
function rRem(){document.getElementById('lRem').innerHTML=rems.map(r=>`<div class="card py-1 flex justify-between"><div class="text-[9px]"><b>${r.cli}</b> ${r.any} ${r.team}</div><div class="flex flex-col gap-1"><button onclick="editRemF(${r.id})" class="b b-alt">ALTERAR</button><button onclick="delRem(${r.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editRemF(id){let r=rems.find(x=>x.id===id);document.getElementById('reCli').value=r.cli;document.getElementById('reEmp').value=r.emp;document.getElementById('reAny').value=r.any;document.getElementById('reTeam').value=r.team;document.getElementById('reSenha').value=r.senha;document.getElementById('reObs').value=r.obs;editRem=id;}
function delRem(id){if(confirm('Excluir?')){rems=rems.filter(x=>x.id!==id);save();rRem();}}
function getPerms(){return {clientes:document.getElementById('p_clientes').checked,chamados:document.getElementById('p_chamados').checked,abrir:document.getElementById('p_abrir').checked,comentar:document.getElementById('p_comentar').checked,financeiro:document.getElementById('p_financeiro').checked,meufin:document.getElementById('p_meufin').checked,estoque:document.getElementById('p_estoque').checked,remote:document.getElementById('p_remote').checked,relatorios:document.getElementById('p_relatorios').checked,excluir:document.getElementById('p_excluir').checked,chefe:document.getElementById('p_chefe').checked,usuarios:document.getElementById('p_usuarios').checked};}
function setPerms(p){document.getElementById('p_clientes').checked=!!p.clientes;document.getElementById('p_chamados').checked=!!p.chamados;document.getElementById('p_abrir').checked=!!p.abrir;document.getElementById('p_comentar').checked=!!p.comentar;document.getElementById('p_financeiro').checked=!!p.financeiro;document.getElementById('p_meufin').checked=!!p.meufin;document.getElementById('p_estoque').checked=!!p.estoque;document.getElementById('p_remote').checked=!!p.remote;document.getElementById('p_relatorios').checked=!!p.relatorios;document.getElementById('p_excluir').checked=!!p.excluir;document.getElementById('p_chefe').checked=!!p.chefe;document.getElementById('p_usuarios').checked=!!p.usuarios;}
function addUs(){let emp=document.getElementById('uEmpresa').value.trim(),nome=document.getElementById('uNome').value.trim(),senha=document.getElementById('uSenha').value.trim();if(!emp||!nome||!senha)return alert('Preencha');let perms=getPerms();if(editUs!==null){let idx=users.findIndex(u=>u.id===editUs);users[idx]={...users[idx],nome,empresa:emp,senha,perms,chefe:perms.chefe};editUs=null;}else{if(users.some(u=>u.nome===nome))return alert('Usuario ja existe');users.push({id:Date.now(),nome,empresa:emp,senha,perms,chefe:perms.chefe,bloqueado:false});}save();rUs();['uEmpresa','uNome','uSenha'].forEach(i=>document.getElementById(i).value='');document.querySelectorAll('.chk').forEach(c=>c.checked=false);alert('USUARIO SALVO!');}
function rUs(){document.getElementById('lUs').innerHTML=users.map(u=>`<div class="card py-1"><div class="flex justify-between"><span class="text-[8px]"><b>${u.nome}</b> - ${u.empresa}<br>Senha:${u.senha}<br>Perms: ${Object.keys(u.perms||{}).filter(k=>u.perms[k]).join(', ')}</span><div class="flex flex-col gap-1"><button onclick="editUsF(${u.id})" class="b b-alt">ALTERAR</button><button onclick="toggleBloq(${u.id})" class="b ${u.bloqueado?'b-fecha':'b-ver'}">${u.bloqueado?'DESBLOQ':'BLOQ'}</button><button onclick="delUs(${u.id})" class="b b-exc">EXCLUIR</button></div></div></div>`).join('')||'Nenhum';}
function editUsF(id){let u=users.find(x=>x.id===id);document.getElementById('uEmpresa').value=u.empresa;document.getElementById('uNome').value=u.nome;document.getElementById('uSenha').value=u.senha;setPerms(u.perms||{});editUs=id;tab('usuarios');}
function toggleBloq(id){let u=users.find(x=>x.id===id);u.bloqueado=!u.bloqueado;save();rUs();}
function delUs(id){if(confirm('Excluir usuario?')){users=users.filter(x=>x.id!==id);save();rUs();}}
function relUs(){let e=prompt('Empresa:'),lista=e?users.filter(u=>u.empresa.toLowerCase().includes(e.toLowerCase())):users,w=window.open('','');w.document.write(`<b>RAMOS - POR EMPRESA ${e||'TODAS'}</b><hr>`+lista.map(u=>`${u.nome} ${u.empresa}<br>`).join(''));w.print();}
function gerarRelatorioTudo(){let mod=document.getElementById('relModulo').value,html=`<div><b>RAMOS ${mod}</b> - ${new Date().toLocaleString()}<hr></div>`;if(mod==='clientes'||mod==='tudo')html+=clientes.map(c=>`${c.nome} ${c.empresa}<br>`).join('');if(mod==='chamados'||mod==='tudo')html+=chamados.map(c=>`#${c.id} ${c.titulo} ${c.empresa} Aberto:${c.quemAbriu} Fechado:${c.quemFechou}<br>`).join('');if(mod==='financeiro'||mod==='tudo')html+=fins.map(f=>`${f.nome} R$${f.boleto}<br>`).join('');document.getElementById('rCon').innerHTML=html;}
function rAll(){rCli();rCha();rFin();rMeu();rEst();rRem();rUs();}
if(localStorage.getItem('log')==='1')show();
</script></body></html>
