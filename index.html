<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ramos PRO V2.3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-[#060a14] text-slate-200">

<!-- LOGIN SEGURO -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-[#0f172a] p-8 rounded-2xl max-w-sm w-full border border-cyan-500/30 text-center">
    <img src="./LogoTipo.jpg" onerror="this.style.display='none'" class="w-32 mx-auto mb-4 rounded-xl bg-black p-2">
    <h1 class="text-xl font-bold text-cyan-400">Ramos Tecnologia</h1>
    <p class="text-[11px] text-gray-400 mb-6">PRO V2.3 SEGURO -  </p>
    <input id="senha" type="password" placeholder="Digite sua senha" class="w-full p-3 rounded bg-black border border-cyan-500/20 mb-3 text-white">
    <button onclick="logar()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 p-3 rounded font-bold">ENTRAR</button>
    <p id="erro" class="hidden text-red-400 text-sm mt-3">Senha errada!</p>
  </div>
</div>

<!-- SISTEMA -->
<div id="sistema" class="hidden">
  <nav class="bg-[#0f172a] border-b border-cyan-500/20 p-3 flex justify-between">
    <div class="flex items-center gap-2">
      <img src="./LogoTipo.jpg" onerror="this.style.display='none'" class="w-8 h-8 rounded bg-black">
      <b class="text-cyan-400 text-sm">RAMOS PRO V2.3</b>
    </div>
    <button onclick="location.reload()" class="text-xs bg-red-500/20 px-3 py-1 rounded">Sair</button>
  </nav>

  <div class="flex">
    <aside class="w-14 md:w-44 bg-[#0f172a] min-h-screen p-2 space-y-1 border-r border-white/5">
      <button onclick="mostrar('dashboard')" class="w-full text-left p-2 rounded bg-blue-600 text-xs">📊 Dash</button>
      <button onclick="mostrar('cadastro')" class="w-full text-left p-2 rounded hover:bg-white/10 text-xs">👤 Cliente</button>
      <button onclick="mostrar('clientes')" class="w-full text-left p-2 rounded hover:bg-white/10 text-xs">📋 Lista</button>
      <button onclick="mostrar('orcamento')" class="w-full text-left p-2 rounded hover:bg-white/10 text-xs">🧾 Orçamento</button>
      <button onclick="mostrar('remoto')" class="w-full text-left p-2 rounded hover:bg-white/10 text-xs">💻 Remoto</button>
    </aside>

    <main class="flex-1 p-4 space-y-4">

      <div id="view-dashboard">
        <div class="grid grid-cols-2 gap-2 mb-4">
          <div class="bg-[#0f172a] p-4 rounded border border-cyan-500/20">
            <p class="text-[10px] text-gray-400">CLIENTES</p>
            <p id="totalClientes" class="text-2xl font-bold text-cyan-400">0</p>
          </div>
          <div class="bg-[#0f172a] p-4 rounded border border-green-500/20">
            <p class="text-[10px] text-gray-400">ORÇAMENTOS</p>
            <p id="totalOrc" class="text-2xl font-bold text-green-400">0</p>
          </div>
        </div>
        <div class="bg-[#0f172a] p-4 rounded text-sm">
          ✅ Sistema em coluna, senha segura, PDF com PIX: <b class="text-cyan-400">11 99626-4221</b>
        </div>
      </div>

      <div id="view-cadastro" class="hidden">
        <div class="bg-[#0f172a] p-4 rounded border border-cyan-500/20 max-w-md">
          <h2 class="font-bold text-cyan-400 mb-3">👤 Cadastro em Coluna</h2>
          <div class="flex flex-col gap-2">
            <input id="c_nome" placeholder="Nome / Razão Social *" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="c_cpf" placeholder="CPF ou CNPJ" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="c_zap" placeholder="WhatsApp" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="c_email" placeholder="E-mail" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="c_end" placeholder="Rua, número" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="c_bairro" placeholder="Bairro" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="c_cidade" placeholder="Cidade" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="c_estado" placeholder="Estado SP" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="c_cep" placeholder="CEP" class="p-3 rounded bg-black border border-white/10 text-sm">
            <select id="c_tipo" class="p-3 rounded bg-black border border-white/10 text-sm">
              <option value="Avulso">Avulso</option>
              <option value="Contrato">Com Contrato</option>
            </select>
            <input id="c_obs" placeholder="Obs" class="p-3 rounded bg-black border border-white/10 text-sm">
          </div>
          <button onclick="salvarCliente()" class="mt-4 w-full bg-gradient-to-r from-cyan-500 to-blue-600 p-3 rounded font-bold">SALVAR CLIENTE</button>
        </div>
      </div>

      <div id="view-clientes" class="hidden">
        <div class="bg-[#0f172a] p-4 rounded">
          <h2 class="font-bold mb-3">📋 Lista de Clientes</h2>
          <div id="listaClientes" class="space-y-2"></div>
        </div>
      </div>

      <div id="view-orcamento" class="hidden">
        <div class="bg-[#0f172a] p-4 rounded border border-green-500/20 max-w-md">
          <h2 class="font-bold text-green-400 mb-3">🧾 Orçamento PDF</h2>
          <div class="flex flex-col gap-2">
            <select id="o_cliente" class="p-3 rounded bg-black border border-white/10 text-sm"></select>
            <textarea id="o_desc" placeholder="Descrição do serviço..." class="p-3 rounded bg-black border border-white/10 h-24 text-sm"></textarea>
            <input id="o_mao" type="number" placeholder="Mão de obra R$" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="o_pecas" type="number" placeholder="Peças R$" class="p-3 rounded bg-black border border-white/10 text-sm">
            <select id="o_pag" class="p-3 rounded bg-black border border-white/10 text-sm">
              <option>PIX - 11 99626-4221</option>
              <option>Dinheiro</option>
              <option>Cartão Crédito</option>
              <option>Boleto</option>
            </select>
            <input id="o_prazo" placeholder="Prazo" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="o_validade" value="Validade 7 dias" class="p-3 rounded bg-black border border-white/10 text-sm">
          </div>
          <button onclick="gerarPDF()" class="mt-4 w-full bg-green-600 p-3 rounded font-bold">GERAR PDF COM LOGO + PIX</button>
        </div>
      </div>

      <div id="view-remoto" class="hidden">
        <div class="bg-[#0f172a] p-4 rounded border border-purple-500/20 max-w-md">
          <h2 class="font-bold text-purple-400 mb-3">💻 Acesso Remoto</h2>
          <div class="flex flex-col gap-2">
            <input id="r_nome" placeholder="Nome do cliente" class="p-3 rounded bg-black border border-white/10 text-sm">
            <input id="r_id" placeholder="ID AnyDesk" class="p-3 rounded bg-black border border-white/10 text-sm">
            <button onclick="gerarSenhaRemoto()" class="bg-purple-600 p-3 rounded font-bold text-sm">GERAR SENHA</button>
            <div id="r_result" class="hidden p-3 bg-black rounded text-center">
              <p class="text-sm">Senha gerada: <span id="r_senha" class="font-bold text-cyan-400 text-lg"></span></p>
              <button onclick="copiarZap()" class="mt-2 w-full bg-green-600 p-2 rounded text-sm">📲 Enviar por WhatsApp</button>
            </div>
            <a href="https://anydesk.com/pt/downloads" target="_blank" class="text-[11px] text-cyan-400 underline mt-2">⬇ Baixar AnyDesk</a>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
const SENHA="@Xumone@531973";
const PIX="11 99626-4221";

function logar(){
  let s=document.getElementById('senha').value.trim();
  if(s===SENHA){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('sistema').classList.remove('hidden');
    carregar();
  } else {
    document.getElementById('erro').classList.remove('hidden');
  }
}

function mostrar(v){
  ['dashboard','cadastro','clientes','orcamento','remoto'].forEach(x=>{
    let el=document.getElementById('view-'+x);
    if(el) el.classList.add('hidden');
  });
  document.getElementById('view-'+v).classList.remove('hidden');
  if(v==='clientes') renderClientes();
  if(v==='dashboard') carregar();
}

let clientes=JSON.parse(localStorage.getItem('ramos_v2')||'[]');
let orcs=JSON.parse(localStorage.getItem('orc_v2')||'[]');

function carregar(){
  document.getElementById('totalClientes').innerText=clientes.length;
  document.getElementById('totalOrc').innerText=orcs.length;
  let sel=document.getElementById('o_cliente');
  sel.innerHTML='<option value="">Selecione o cliente...</option>';
  clientes.forEach((c,i)=>{
    let o=document.createElement('option');
    o.value=i;
    o.textContent=c.nome+' - '+c.zap;
    sel.appendChild(o);
  });
}

function salvarCliente(){
  let c={
    nome:document.getElementById('c_nome').value,
    cpf:document.getElementById('c_cpf').value,
    zap:document.getElementById('c_zap').value,
    email:document.getElementById('c_email').value,
    end:document.getElementById('c_end').value,
    bairro:document.getElementById('c_bairro').value,
    cidade:document.getElementById('c_cidade').value,
    estado:document.getElementById('c_estado').value,
    cep:document.getElementById('c_cep').value,
    tipo:document.getElementById('c_tipo').value,
    obs:document.getElementById('c_obs').value
  };
  if(!c.nome){alert('Digite o nome!');return;}
  clientes.push(c);
  localStorage.setItem('ramos_v2',JSON.stringify(clientes));
  alert('Salvo: '+c.nome);
  carregar();
  mostrar('clientes');
}

function renderClientes(){
  let d=document.getElementById('listaClientes');
  if(clientes.length===0){d.innerHTML='<p class="text-gray-500 text-sm">Nenhum cliente cadastrado.</p>';return;}
  d.innerHTML=clientes.map((c,i)=>`
    <div class="p-3 bg-black rounded flex justify-between items-center">
      <div>
        <b class="text-cyan-400 text-sm">${c.nome}</b>
        <p class="text-[11px] text-gray-400">${c.zap} | ${c.cidade}/${c.estado} | ${c.tipo}</p>
      </div>
      <button onclick="usarCliente(${i})" class="bg-blue-600 px-3 py-1 rounded text-xs">Orç</button>
    </div>
  `).join('');
}

function usarCliente(i){
  document.getElementById('o_cliente').value=i;
  mostrar('orcamento');
}

function gerarPDF(){
  let idx=document.getElementById('o_cliente').value;
  if(idx===''){alert('Selecione cliente!');return;}
  let cli=clientes[idx];
  let desc=document.getElementById('o_desc').value||'Serviço técnico';
  let mao=parseFloat(document.getElementById('o_mao').value||0);
  let pecas=parseFloat(document.getElementById('o_pecas').value||0);
  let total=mao+pecas;
  let pag=document.getElementById('o_pag').value;
  let prazo=document.getElementById('o_prazo').value;
  let validade=document.getElementById('o_validade').value;

  const {jsPDF}=window.jspdf;
  let doc=new jsPDF();
  try{
    let img=document.querySelector('#sistema img');
    if(img) doc.addImage(img,'JPEG',10,5,25,25);
  }catch(e){}

  doc.setFontSize(14);
  doc.setFont('helvetica','bold');
  doc.text('Ramos Tecnologia da Informacao',40,14);
  doc.setFontSize(8);
  doc.setFont('helvetica','normal');
  doc.text('PIX: '+PIX+' | ramosinfotec.com.br',40,19);
  doc.line(10,27,200,27);

  doc.setFontSize(11);
  doc.setFont('helvetica','bold');
  doc.text('ORCAMENTO',10,35);
  doc.setFontSize(9);
  doc.setFont('helvetica','normal');
  doc.text('Cliente: '+cli.nome+' ('+cli.tipo+')',10,41);
  doc.text('CPF/CNPJ: '+cli.cpf+' | Zap: '+cli.zap,10,45);
  doc.text('End: '+cli.end+', '+cli.bairro+' - '+cli.cidade+'/'+cli.estado,10,49);
  doc.text('Pagamento: '+pag+' | Prazo: '+prazo+' | '+validade,10,53);

  doc.setFont('helvetica','bold');
  doc.text('Descricao:',10,61);
  doc.setFont('helvetica','normal');
  let lines=doc.splitTextToSize(desc,180);
  doc.text(lines,10,65);
  let y=65+lines.length*4+6;
  doc.text('Mao de obra: R$ '+mao.toFixed(2),10,y);
  doc.text('Pecas: R$ '+pecas.toFixed(2),10,y+5);
  doc.setFontSize(12);
  doc.setFont('helvetica','bold');
  doc.text('TOTAL: R$ '+total.toFixed(2),10,y+12);
  doc.setFontSize(8);
  doc.text('Obrigado pela preferencia! PIX '+PIX,10,285);

  doc.save('Orcamento-'+cli.nome.replace(/\s+/g,'_')+'.pdf');
  orcs.push({cliente:cli.nome,total});
  localStorage.setItem('orc_v2',JSON.stringify(orcs));
  carregar();
}

let _senhaRemoto='';
let _nomeRemoto='';
function gerarSenhaRemoto(){
  let nome=document.getElementById('r_nome').value;
  if(!nome){alert('Digite nome do cliente');return;}
  _nomeRemoto=nome;
  _senhaRemoto=Math.random().toString(36).substring(2,8).toUpperCase();
  document.getElementById('r_senha').innerText=_senhaRemoto;
  document.getElementById('r_result').classList.remove('hidden');
}
function copiarZap(){
  let id=document.getElementById('r_id').value;
  let txt='Ola '+_nomeRemoto+', aqui é Ramos Infotec. Seu acesso remoto: ID '+id+' Senha: '+_senhaRemoto;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
</script>
</body>
</html>
