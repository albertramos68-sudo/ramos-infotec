<script>
function maskPhone(el){let v=el.value.replace(/\D/g,'');if(v.length>11)v=v.slice(0,11);if(v.length>10){el.value='('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);}else if(v.length>6){el.value='('+v.slice(0,2)+') '+v.slice(2,6)+'-'+v.slice(6);}else if(v.length>2){el.value='('+v.slice(0,2)+') '+v.slice(2);}else{el.value=v;}}
let clientes=JSON.parse(localStorage.getItem('v57_cli')||'[]'),chamados=JSON.parse(localStorage.getItem('v57_cha')||'[]'),fins=JSON.parse(localStorage.getItem('v57_fin')||'[]'),meus=JSON.parse(localStorage.getItem('v57_meu')||'[]'),ests=JSON.parse(localStorage.getItem('v57_est')||'[]'),rems=JSON.parse(localStorage.getItem('v57_rem')||'[]'),users=JSON.parse(localStorage.getItem('v57_usr')||'[]'),editCli=null,editFin=null,editMeu=null,editEst=null,editRem=null,editCha=null,editUs=null,comentChaId=null;
function save(){localStorage.setItem('v57_cli',JSON.stringify(clientes));localStorage.setItem('v57_cha',JSON.stringify(chamados));localStorage.setItem('v57_fin',JSON.stringify(fins));localStorage.setItem('v57_meu',JSON.stringify(meus));localStorage.setItem('v57_est',JSON.stringify(ests));localStorage.setItem('v57_rem',JSON.stringify(rems));localStorage.setItem('v57_usr',JSON.stringify(users));}
function clearLogin(){document.getElementById('empresa').value='';document.getElementById('usuario').value='';document.getElementById('senha').value='';}
function login(){let emp=document.getElementById('empresa').value.trim(),usu=document.getElementById('usuario').value.trim(),sen=document.getElementById('senha').value.trim();if(!emp||!usu||!sen)return alert('Preencha todos');if(emp.toLowerCase()==='ramosinfotec'&&usu==='admin'&&sen==='@Xumone@197353'){localStorage.setItem('log','1');localStorage.setItem('role','master');localStorage.setItem('user',usu);localStorage.setItem('emp','RAMOS');localStorage.setItem('perm',JSON.stringify({clientes:true,chamados:true,abrir:true,comentar:true,financeiro:true,meufin:true,estoque:true,remote:true,relatorios:true,excluir:true,chefe:true,usuarios:true}));show();return;}let u=users.find(x=>x.empresa.toLowerCase()===emp.toLowerCase()&&x.nome.toLowerCase()===usu.toLowerCase()&&x.senha===sen);if(!u)u=users.find(x=>x.nome.toLowerCase()===usu.toLowerCase()&&x.senha===sen);if(u){if(u.bloqueado)return alert('BLOQUEADO');localStorage.setItem('log','1');localStorage.setItem('role',u.chefe?'chefe':'user');localStorage.setItem('user',u.nome);localStorage.setItem('emp',u.empresa);localStorage.setItem('perm',JSON.stringify(u.perms));show();return;}alert('Incorreto');}
function show(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');let r=localStorage.getItem('role'),u=localStorage.getItem('user'),e=localStorage.getItem('emp'),perm=JSON.parse(localStorage.getItem('perm')||'{}');document.getElementById('uInfo').innerText=u+' - '+e+' ('+r+')';let aviso=document.getElementById('relAviso');if(r==='master'){aviso.innerText='MASTER: Voce ve tudo da RAMOS INFOTEC';}else{aviso.innerText='EMPRESA '+e.toUpperCase()+': Voce so ve relatorios da sua empresa '+e+'. Nao ve da RAMOS INFOTEC';}buildMenu(perm,r);rAll();}
function buildMenu(p,r){let menu=document.getElementById('menuM'),html='';if(r==='master'||p.clientes||p.chefe) html+=`<button onclick="tab('clientes')" class="menu-btn">👥 Clientes</button>`;if(r==='master'||p.chamados||p.abrir||p.chefe) html+=`<button onclick="tab('chamados')" class="menu-btn">📋 Chamados</button>`;if(r==='master'||p.financeiro) html+=`<button onclick="tab('financeiro')" class="menu-btn">💰 Financeiro</button>`;if(r==='master'||p.estoque||p.chefe) html+=`<button onclick="tab('estoque')" class="menu-btn">📦 Estoque</button>`;if(r==='master'||p.remote||p.chefe) html+=`<button onclick="tab('remote')" class="menu-btn">🖥️ Remoto</button>`;if(r==='master'||p.usuarios||p.chefe) html+=`<button onclick="tab('usuarios')" class="menu-btn">👤 Usuarios</button>`;if(r==='master'||p.relatorios||p.chefe||p.abrir) html+=`<button onclick="tab('relatorios')" class="menu-btn">📊 Relatorios</button>`;if(html==='')html=`<button onclick="tab('chamados')" class="menu-btn">➕ Abrir Chamado</button><button onclick="tab('relatorios')" class="menu-btn">📊 Meus Relatorios</button>`;menu.innerHTML=html;setTimeout(()=>{let f=menu.querySelector('.menu-btn');if(f)f.click();},100);}
function logout(){localStorage.removeItem('log');clearLogin();document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');}
function tab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));let el=document.getElementById('t-'+id);if(el)el.classList.add('active');}
function presetFin(){document.querySelectorAll('.chk').forEach(c=>c.checked=false);document.getElementById('p_financeiro').checked=true;document.getElementById('p_relatorios').checked=true;}
function presetEmpresa(){document.querySelectorAll('.chk').forEach(c=>c.checked=false);document.getElementById('p_abrir').checked=true;document.getElementById('p_comentar').checked=true;document.getElementById('p_relatorios').checked=true;}
function presetChefe(){document.querySelectorAll('.chk').forEach(c=>c.checked=false);document.getElementById('p_abrir').checked=true;document.getElementById('p_comentar').checked=true;document.getElementById('p_relatorios').checked=true;document.getElementById('p_excluir').checked=true;document.getElementById('p_chamados').checked=true;document.getElementById('p_chefe').checked=true;}
function limpCli(){['cNome','cEmpresa','cEmail','cZap','cEndereco','cNumero','cMunicipio','cEstado','cTel','cContato'].forEach(i=>{let e=document.getElementById(i);if(e)e.value='';});editCli=null;}
function addCli(){let o={id:editCli||Date.now(),nome:document.getElementById('cNome').value,empresa:document.getElementById('cEmpresa').value,email:document.getElementById('cEmail').value,zap:document.getElementById('cZap').value,endereco:document.getElementById('cEndereco').value,numero:document.getElementById('cNumero').value,municipio:document.getElementById('cMunicipio').value,estado:document.getElementById('cEstado').value,tel:document.getElementById('cTel').value,contato:document.getElementById('cContato').value};if(!o.nome||!o.empresa)return alert('Nome e Empresa');if(editCli){clientes[clientes.findIndex(c=>c.id===editCli)]=o;editCli=null;}else clientes.push(o);save();rCli();limpCli();alert('CLIENTE SALVO!');}
function rCli(){let tipo=document.getElementById('buscaCliTipo').value,b=(document.getElementById('buscaCli')?.value||'').toLowerCase(),lista=clientes.filter(c=>{if(!b)return true;if(tipo==='tudo')return JSON.stringify(c).toLowerCase().includes(b);return (c[tipo]||'').toLowerCase().includes(b);});document.getElementById('lCli').innerHTML=lista.map(c=>`<div class="card py-2 flex justify-between"><div class="text-[13px]"><b>${c.nome}</b> - ${c.empresa}<br><span class="text-[11px]">${c.zap} | ${c.tel}</span></div><div class="flex flex-col gap-1"><button onclick="editCliF(${c.id})" class="b b-alt">ALTERAR</button><button onclick="delCli(${c.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editCliF(id){let c=clientes.find(x=>x.id===id);document.getElementById('cNome').value=c.nome;document.getElementById('cEmpresa').value=c.empresa;document.getElementById('cEmail').value=c.email;document.getElementById('cZap').value=c.zap;document.getElementById('cEndereco').value=c.endereco;document.getElementById('cNumero').value=c.numero;document.getElementById('cMunicipio').value=c.municipio;document.getElementById('cEstado').value=c.estado;document.getElementById('cTel').value=c.tel;document.getElementById('cContato').value=c.contato;editCli=id;}
function delCli(id){if(confirm('Excluir?')){clientes=clientes.filter(x=>x.id!==id);save();rCli();}}
function enviarEmailChamado(chamado){let deve=document.getElementById('chkEmail').checked;if(!deve)return;let grupo=document.getElementById('chEmailGrupo').value||document.getElementById('chEmailSuporte').value;if(!grupo)return;let assunto=`[RAMOS] Novo Chamado #${chamado.id.toString().slice(-4)} - ${chamado.empresa} - ${chamado.titulo}`;let corpo=`NOVO CHAMADO ABERTO\n\nEmpresa: ${chamado.empresa}\nTitulo: ${chamado.titulo}\nCliente: ${chamado.cliente}\nPrioridade: ${chamado.prio}\nAberto por: ${chamado.quemAbriu}\nData: ${chamado.dataAbertura}\n\nDescricao:\n${chamado.desc}\n\n---\nAcesse: https://ramos-infotec.onrender.com`;let mailto=`mailto:${grupo}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;window.open(mailto,'_blank');alert('📧 EMAIL PREPARADO PARA: '+grupo);}
function addChamado(){let o={id:editCha||Date.now(),titulo:document.getElementById('chTitulo').value,empresa:document.getElementById('chEmpresa').value,cliente:document.getElementById('chCliente').value,prio:document.getElementById('chPrio').value,desc:document.getElementById('chDesc').value,quemAbriu:localStorage.getItem('user'),dataAbertura:new Date().toLocaleString(),dataFecho:'',quemFechou:'',status:'Aberto',comentarios:editCha?(chamados.find(x=>x.id===editCha).comentarios||[]):[]};if(!o.titulo||!o.empresa)return alert('Titulo e Empresa');if(editCha){let idx=chamados.findIndex(c=>c.id===editCha);o.quemAbriu=chamados[idx].quemAbriu;o.dataAbertura=chamados[idx].dataAbertura;chamados[idx]=o;editCha=null;save();rCha();alert('ALTERADO!');}else{chamados.push(o);save();rCha();enviarEmailChamado(o);alert('CHAMADO SALVO E EMAIL ENVIADO!');}['chTitulo','chEmpresa','chCliente','chDesc'].forEach(i=>document.getElementById(i).value='');}
function rCha(){let tipo=document.getElementById('buscaChaTipo').value,b=(document.getElementById('buscaCha')?.value||'').toLowerCase(),emp=localStorage.getItem('emp'),role=localStorage.getItem('role'),listaBase=role==='master'?chamados:chamados.filter(c=>c.empresa.toLowerCase()===emp.toLowerCase()),lista=listaBase.filter(c=>{if(!b)return true;if(tipo==='tudo')return JSON.stringify(c).toLowerCase().includes(b);return (c[tipo]||'').toLowerCase().includes(b);});document.getElementById('lCha').innerHTML=lista.slice().reverse().map(c=>`<div class="card py-2"><div class="flex justify-between"><div class="text-[13px]"><b>#${c.id.toString().slice(-4)} ${c.titulo}</b> - ${c.empresa} - ${c.status}<br><span class="text-[11px]">Aberto por ${c.quemAbriu} em ${c.dataAbertura}</span><br>${c.desc}<br><span class="text-cyan-400">💬 ${c.comentarios?.length||0}</span></div><div class="flex flex-col gap-1"><button onclick="editChaF(${c.id})" class="b b-alt">ALTERAR</button><button onclick="abrirComent(${c.id})" class="b b-print">COMENTAR</button><button onclick="finalizarCha(${c.id})" class="b b-fecha">FINALIZAR</button><button onclick="reenviarEmail(${c.id})" class="b b-ver">📧 EMAIL</button><button onclick="delCha(${c.id})" class="b b-exc">EXCLUIR</button></div></div></div>`).join('')||'Nenhum';}
function editChaF(id){let c=chamados.find(x=>x.id===id);document.getElementById('chTitulo').value=c.titulo;document.getElementById('chEmpresa').value=c.empresa;document.getElementById('chCliente').value=c.cliente;document.getElementById('chPrio').value=c.prio;document.getElementById('chDesc').value=c.desc;editCha=id;}
function finalizarCha(id){let c=chamados.find(x=>x.id===id),u=localStorage.getItem('user');c.status='Finalizado';c.dataFecho=new Date().toLocaleString();c.quemFechou=u;save();rCha();alert('FINALIZADO POR '+u);}
function delCha(id){if(confirm('Excluir?')){chamados=chamados.filter(x=>x.id!==id);save();rCha();}}
function reenviarEmail(id){let c=chamados.find(x=>x.id===id);enviarEmailChamado(c);}
function relCha(){let emp=localStorage.getItem('emp'),role=localStorage.getItem('role'),lista=role==='master'?chamados:chamados.filter(x=>x.empresa.toLowerCase()===emp.toLowerCase()),w=window.open('','');w.document.write(`<b>RAMOS - CHAMADOS - ${role==='master'?'TODOS':emp}</b><hr>`+lista.map(c=>`#${c.id} ${c.titulo} Emp:${c.empresa} Aberto:${c.quemAbriu}<br>`).join(''));w.print();}
function abrirComent(id){comentChaId=id;let c=chamados.find(x=>x.id===id);document.getElementById('cmtId').innerText='#'+id;document.getElementById('cmtInfo').innerHTML=`<b>${c.titulo}</b> - ${c.empresa}<br>${c.desc}`;rCmt();tab('coment');}
function rCmt(){let c=chamados.find(x=>x.id===comentChaId);document.getElementById('lCmt').innerHTML=(c.comentarios||[]).slice().reverse().map(m=>`<div class="card py-2 text-[13px]"><b>${m.user}</b> em ${m.data}<br>${m.texto}</div>`).join('')||'Sem comentarios';}
function addComent(){let txt=document.getElementById('cmtTexto').value.trim();if(!txt)return alert('Digite');let c=chamados.find(x=>x.id===comentChaId);if(!c.comentarios)c.comentarios=[];c.comentarios.push({user:localStorage.getItem('user'),data:new Date().toLocaleString(),texto:txt});save();document.getElementById('cmtTexto').value='';rCmt();rCha();alert('COMENTARIO INSERIDO!');}
function addFin(){let nome=document.getElementById('fiNome').value.trim(),boleto=parseFloat(document.getElementById('fiBoleto').value||0);if(!nome||!boleto)return alert('Obrigatorios');let o={id:editFin||Date.now(),nome,boleto,total:parseFloat(document.getElementById('fiTotal').value||boleto),mov:document.getElementById('fiMov').value,venc:document.getElementById('fiVenc').value,pagoData:document.getElementById('fiPagoData').value,pagoVal:parseFloat(document.getElementById('fiPagoVal').value||0),multa:parseFloat(document.getElementById('fiMulta').value||0),empresa:document.getElementById('fiEmp').value,produto:document.getElementById('fiProd').value,desc:document.getElementById('fiDesc').value};if(editFin){fins[fins.findIndex(x=>x.id===editFin)]=o;editFin=null;}else fins.push(o);save();rFin();alert('FINANCEIRO SALVO!');}
function rFin(){document.getElementById('lFin').innerHTML=fins.slice().reverse().map(f=>`<div class="card py-2 flex justify-between"><div class="text-[13px]"><b>${f.nome}</b> R$${f.boleto}</div><div class="flex flex-col gap-1"><button onclick="editFinF(${f.id})" class="b b-alt">ALTERAR</button><button onclick="delFin(${f.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editFinF(id){let f=fins.find(x=>x.id===id);document.getElementById('fiNome').value=f.nome;document.getElementById('fiBoleto').value=f.boleto;document.getElementById('fiMov').value=f.mov;document.getElementById('fiVenc').value=f.venc;document.getElementById('fiPagoData').value=f.pagoData;document.getElementById('fiTotal').value=f.total;document.getElementById('fiPagoVal').value=f.pagoVal;document.getElementById('fiMulta').value=f.multa;document.getElementById('fiEmp').value=f.empresa;document.getElementById('fiProd').value=f.produto;document.getElementById('fiDesc').value=f.desc;editFin=id;}
function delFin(id){if(confirm('Excluir?')){fins=fins.filter(x=>x.id!==id);save();rFin();}}
function impFin(){let w=window.open('','');w.document.write(fins.map(f=>`Nome:${f.nome} Boleto:R$${f.boleto}<br>`).join(''));w.print();}
function addMeu(){let nome=document.getElementById('meNome').value.trim(),boleto=parseFloat(document.getElementById('meBoleto').value||0);if(!nome||!boleto)return alert('Obrigatorios');let o={id:editMeu||Date.now(),nome,boleto,total:parseFloat(document.getElementById('meTotal').value||boleto),mov:document.getElementById('meMov').value,venc:document.getElementById('meVenc').value,pagoData:document.getElementById('mePagoData').value,pagoVal:parseFloat(document.getElementById('mePagoVal').value||0),multa:parseFloat(document.getElementById('meMulta').value||0),desc:document.getElementById('meDesc').value};if(editMeu){meus[meus.findIndex(x=>x.id===editMeu)]=o;editMeu=null;}else meus.push(o);save();rMeu();alert('SALVO!');}
function rMeu(){document.getElementById('lMeu').innerHTML=meus.slice().reverse().map(f=>`<div class="card py-2 flex justify-between"><div class="text-[13px]"><b>${f.nome}</b> R$${f.boleto}</div><div class="flex flex-col gap-1"><button onclick="editMeuF(${f.id})" class="b b-alt">ALTERAR</button><button onclick="delMeu(${f.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editMeuF(id){let f=meus.find(x=>x.id===id);document.getElementById('meNome').value=f.nome;document.getElementById('meBoleto').value=f.boleto;document.getElementById('meMov').value=f.mov;document.getElementById('meVenc').value=f.venc;document.getElementById('mePagoData').value=f.pagoData;document.getElementById('meTotal').value=f.total;document.getElementById('mePagoVal').value=f.pagoVal;document.getElementById('meMulta').value=f.multa;document.getElementById('meDesc').value=f.desc;editMeu=id;}
function delMeu(id){if(confirm('Excluir?')){meus=meus.filter(x=>x.id!==id);save();rMeu();}}
function addEst(){let prod=document.getElementById('esProd').value.trim(),qtd=document.getElementById('esQtd').value;if(!prod||!qtd)return alert('Obrigatorios');let o={id:editEst||Date.now(),prod,qtd,ent:document.getElementById('esEnt').value,sai:document.getElementById('esSai').value};if(editEst){ests[ests.findIndex(x=>x.id===editEst)]=o;editEst=null;}else ests.push(o);save();rEst();alert('ESTOQUE SALVO!');}
function rEst(){document.getElementById('lEst').innerHTML=ests.slice().reverse().map(e=>`<div class="card py-2 flex justify-between"><div class="text-[13px]"><b>${e.prod}</b> Qtd ${e.qtd}</div><div class="flex gap-1"><button onclick="editEstF(${e.id})" class="b b-alt">ALTERAR</button><button onclick="delEst(${e.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editEstF(id){let e=ests.find(x=>x.id===id);document.getElementById('esProd').value=e.prod;document.getElementById('esQtd').value=e.qtd;document.getElementById('esEnt').value=e.ent;document.getElementById('esSai').value=e.sai;editEst=id;}
function delEst(id){if(confirm('Excluir?')){ests=ests.filter(x=>x.id!==id);save();rEst();}}
function relEst(){let w=window.open('','');w.document.write(ests.map(e=>`${e.prod} Qtd:${e.qtd}<br>`).join(''));w.print();}
function addRem(){let o={id:editRem||Date.now(),cli:document.getElementById('reCli').value,emp:document.getElementById('reEmp').value,any:document.getElementById('reAny').value,team:document.getElementById('reTeam').value,senha:document.getElementById('reSenha').value,obs:document.getElementById('reObs').value};if(!o.cli)return alert('Cliente');if(editRem){rems[rems.findIndex(x=>x.id===editRem)]=o;editRem=null;}else rems.push(o);save();rRem();alert('REMOTO SALVO!');}
function rRem(){document.getElementById('lRem').innerHTML=rems.map(r=>`<div class="card py-2 flex justify-between"><div class="text-[13px]"><b>${r.cli}</b> ${r.any}</div><div class="flex flex-col gap-1"><button onclick="editRemF(${r.id})" class="b b-alt">ALTERAR</button><button onclick="delRem(${r.id})" class="b b-exc">EXCLUIR</button></div></div>`).join('')||'Nenhum';}
function editRemF(id){let r=rems.find(x=>x.id===id);document.getElementById('reCli').value=r.cli;document.getElementById('reEmp').value=r.emp;document.getElementById('reAny').value=r.any;document.getElementById('reTeam').value=r.team;document.getElementById('reSenha').value=r.senha;document.getElementById('reObs').value=r.obs;editRem=id;}
function delRem(id){if(confirm('Excluir?')){rems=rems.filter(x=>x.id!==id);save();rRem();}}
function getPerms(){return {clientes:document.getElementById('p_clientes').checked,chamados:document.getElementById('p_chamados').checked,abrir:document.getElementById('p_abrir').checked,comentar:document.getElementById('p_comentar').checked,financeiro:document.getElementById('p_financeiro').checked,meufin:document.getElementById('p_meufin').checked,estoque:document.getElementById('p_estoque').checked,remote:document.getElementById('p_remote').checked,relatorios:document.getElementById('p_relatorios').checked,excluir:document.getElementById('p_excluir').checked,chefe:document.getElementById('p_chefe').checked,usuarios:document.getElementById('p_usuarios').checked};}
function setPerms(p){document.getElementById('p_clientes').checked=!!p.clientes;document.getElementById('p_chamados').checked=!!p.chamados;document.getElementById('p_abrir').checked=!!p.abrir;document.getElementById('p_comentar').checked=!!p.comentar;document.getElementById('p_financeiro').checked=!!p.financeiro;document.getElementById('p_meufin').checked=!!p.meufin;document.getElementById('p_estoque').checked=!!p.estoque;document.getElementById('p_remote').checked=!!p.remote;document.getElementById('p_relatorios').checked=!!p.relatorios;document.getElementById('p_excluir').checked=!!p.excluir;document.getElementById('p_chefe').checked=!!p.chefe;document.getElementById('p_usuarios').checked=!!p.usuarios;}
function addUs(){let emp=document.getElementById('uEmpresa').value.trim(),nome=document.getElementById('uNome').value.trim(),senha=document.getElementById('uSenha').value.trim();if(!emp||!nome||!senha)return alert('Preencha');let perms=getPerms();if(editUs!==null){let idx=users.findIndex(u=>u.id===editUs);users[idx]={...users[idx],nome,empresa:emp,senha,perms,chefe:perms.chefe};editUs=null;}else{if(users.some(u=>u.nome.toLowerCase()===nome.toLowerCase()&&u.empresa.toLowerCase()===emp.toLowerCase()))return alert('Usuario ja existe');users.push({id:Date.now(),nome,empresa:emp,senha,perms,chefe:perms.chefe,bloqueado:false});}save();rUs();['uEmpresa','uNome','uSenha'].forEach(i=>document.getElementById(i).value='');document.querySelectorAll('.chk').forEach(c=>c.checked=false);document.getElementById('p_abrir').checked=true;alert('USUARIO SALVO! Empresa:'+emp+' Usuario:'+nome);}
function rUs(){document.getElementById('lUs').innerHTML=users.map(u=>`<div class="card py-2"><div class="flex justify-between"><span class="text-[12px]"><b>${u.nome}</b> - ${u.empresa}<br>Senha:${u.senha}<br>${Object.keys(u.perms||{}).filter(k=>u.perms[k]).join(', ')}</span><div class="flex flex-col gap-1"><button onclick="editUsF(${u.id})" class="b b-alt">ALTERAR</button><button onclick="toggleBloq(${u.id})" class="b ${u.bloqueado?'b-fecha':'b-ver'}">${u.bloqueado?'DESBLOQ':'BLOQ'}</button><button onclick="delUs(${u.id})" class="b b-exc">EXCLUIR</button></div></div></div>`).join('')||'Nenhum';}
function editUsF(id){let u=users.find(x=>x.id===id);document.getElementById('uEmpresa').value=u.empresa;document.getElementById('uNome').value=u.nome;document.getElementById('uSenha').value=u.senha;setPerms(u.perms||{});editUs=id;tab('usuarios');}
function toggleBloq(id){let u=users.find(x=>x.id===id);u.bloqueado=!u.bloqueado;save();rUs();}
function delUs(id){if(confirm('Excluir?')){users=users.filter(x=>x.id!==id);save();rUs();}}
function relUs(){let e=prompt('Empresa:'),lista=e?users.filter(u=>u.empresa.toLowerCase().includes(e.toLowerCase())):users,w=window.open('','');w.document.write(lista.map(u=>`${u.nome} ${u.empresa}<br>`).join(''));w.print();}
function gerarRelatorioTudo(){let emp=localStorage.getItem('emp'),role=localStorage.getItem('role'),mod=document.getElementById('relModulo').value,listaCli=role==='master'?clientes:clientes.filter(c=>c.empresa.toLowerCase()===emp.toLowerCase()),listaCha=role==='master'?chamados:chamados.filter(c=>c.empresa.toLowerCase()===emp.toLowerCase()),listaFin=role==='master'?fins:fins.filter(f=>(f.empresa||'').toLowerCase()===emp.toLowerCase()),html=`<div style="text-align:center"><b>RAMOS INFOTEC - RELATORIO ${mod.toUpperCase()}<br>Empresa: ${role==='master'?'TODAS (MASTER)':emp}<br>${new Date().toLocaleString()}</b><hr></div>`;if(role!=='master'){html+=`<div style="background:#fef3c7;padding:8px;border:1px solid #f59e0b;">ATENCAO: So dados da empresa ${emp}. Voce NAO ve dados da RAMOS INFOTEC</div><hr>`;}if(mod==='clientes'||mod==='tudo')html+=`<b>CLIENTES - ${listaCli.length}</b><br>`+listaCli.map(c=>`${c.nome} | ${c.empresa} | ${c.zap}<br>`).join('')+'<hr>';if(mod==='chamados'||mod==='tudo')html+=`<b>CHAMADOS - ${listaCha.length}</b><br>`+listaCha.map(c=>`#${c.id.toString().slice(-4)} ${c.titulo} | Emp:${c.empresa} | Aberto:${c.quemAbriu} ${c.dataAbertura} | Fechado:${c.quemFechou} ${c.dataFecho}<br>${c.desc}<hr>`).join('');if(mod==='financeiro'||mod==='tudo')html+=`<b>FINANCEIRO</b><br>`+listaFin.map(f=>`${f.nome} R$${f.boleto}<br>`).join('');document.getElementById('rCon').innerHTML=html;let w=window.open('','');w.document.write(html);w.print();}
function rAll(){rCli();rCha();rFin();rMeu();rEst();rRem();rUs();}
window.addEventListener('load',()=>{clearLogin();if(localStorage.getItem('log')==='1')show();});
</script></body></html>
