<!DOCTYPE html><html><head><meta charset="UTF-8"><title>RAMOS V7.1 MASTER - EMPRESA + ROBO</title>
<style>:root{--bg:#0c1424;--card:#13223d;--cyan:#00e5ff;--green:#00e676;--yellow:#ffeb3b;--red:#ff1744;--orange:#ff9100}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#c8d6e5;font-family:Inter,sans-serif;font-size:12px}.login-box{max-width:400px;margin:8% auto;background:var(--card);padding:32px;border-radius:16px;border:1px solid #ffffff18}input,select,textarea{width:100%;background:#0a1120;border:1px solid #ffffff14;color:#fff;padding:10px;border-radius:8px;margin-top:4px}label{font-size:10px;color:#7ea0c8;margin-top:10px;display:block}.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}.btn-save{background:var(--green);color:#000;width:100%;padding:12px}.btn-cyan{background:var(--cyan);color:#000}.btn-green{background:var(--green);color:#000}.btn-orange{background:var(--orange);color:#000}.btn-yellow{background:var(--yellow);color:#000}.btn-red{background:var(--red);color:#fff}.btn-white{background:#fff;color:#000}.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#0d1b33;overflow-x:auto}.tab{padding:8px 12px;background:#ffffff0a;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:11px}.tab.active{background:var(--cyan);color:#000;font-weight:900}.bol{border:1px solid var(--yellow)}.rel{border:1px solid var(--cyan)}header{display:flex;justify-content:space-between;padding:10px 14px;background:#0d1b33;border-bottom:1px solid #ffffff14}.logo{font-weight:900;color:var(--cyan)}.card{background:var(--card);margin:12px;border-radius:12px;padding:16px;border:1px solid #ffffff12}.list-item{display:flex;justify-content:space-between;background:#ffffff06;margin:6px 12px;padding:10px;border-radius:8px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{padding:2px 6px;border-radius:6px;font-size:9px;font-weight:800;background:#ffffff15}.badge{padding:2px 6px;border-radius:6px;font-size:9px}.b-emp{background:#ffeb3b22;color:var(--yellow);border:1px solid #ffeb3b44}.b-dono{background:#00e5ff22;color:var(--cyan)}.b-seg{background:#00e67622;color:var(--green)}.x{background:#ff174422;color:var(--red);border:0;border-radius:6px;padding:6px 10px;cursor:pointer}.coment{background:#00e5ff0f;border-left:3px solid var(--cyan);padding:6px;margin:4px 0;border-radius:4px;font-size:11px}.robo-box{background:linear-gradient(135deg,#00e67615,#00e5ff15);border:1px solid #00e67644;padding:12px;border-radius:10px}</style></head><body><div id="app"></div><script>
const ADMINS={"admin":"Ramos@2026","dono":"@Xu@408671","albert.ramos":"@Xu@408671"};
let clientes=JSON.parse(localStorage.getItem("c_v71")||"[]");
let chamados=JSON.parse(localStorage.getItem("ch_v71")||"[]");
let usuarios=JSON.parse(localStorage.getItem("u_v71")||"[]");
let financeiro=JSON.parse(localStorage.getItem("f_v71")||"[]");
let notas=JSON.parse(localStorage.getItem("n_v71")||"[]");
let boletos=JSON.parse(localStorage.getItem("b_v71")||"[]");
let orcamentos=JSON.parse(localStorage.getItem("o_v71")||"[]");
let remotos=JSON.parse(localStorage.getItem("r_v71")||"[]");
let contratos=JSON.parse(localStorage.getItem("ct_v71")||"[]");
let pessoal=JSON.parse(localStorage.getItem("p_v71")||"[]");
let arquivoTemp=null;
function save(){localStorage.setItem("c_v71",JSON.stringify(clientes));localStorage.setItem("ch_v71",JSON.stringify(chamados));localStorage.setItem("u_v71",JSON.stringify(usuarios));localStorage.setItem("f_v71",JSON.stringify(financeiro));localStorage.setItem("n_v71",JSON.stringify(notas));localStorage.setItem("b_v71",JSON.stringify(boletos));localStorage.setItem("o_v71",JSON.stringify(orcamentos));localStorage.setItem("r_v71",JSON.stringify(remotos));localStorage.setItem("ct_v71",JSON.stringify(contratos));localStorage.setItem("p_v71",JSON.stringify(pessoal));}
function calcTotal(){let v=parseFloat(document.getElementById('f_val').value)||0;let a=parseFloat(document.getElementById('f_acre').value)||0;let m=parseFloat(document.getElementById('f_multa').value)||0;document.getElementById('f_total').value=(v+a+m).toFixed(2);}
function handleFile(input){let file=input.files[0];if(file){let r=new FileReader();r.onload=function(e){arquivoTemp=e.target.result;document.getElementById('fileInfo').innerHTML="📎 "+file.name+" OK";};r.readAsDataURL(file);}}
function imprimir(tipo){let data=new Date().toLocaleString('pt-BR');let w=window.open('about:blank');let html=`<html><head><style>body{font-family:Arial;padding:20px;font-size:11px}table{width:100%;border-collapse:collapse}th{background:#0c1424;color:#fff;padding:6px}td{border:1px solid #ccc;padding:5px}.header{display:flex;justify-content:space-between;border-bottom:3px solid #0c1424;padding-bottom:10px}</style></head><body><div class=header><div><b style="font-size:18px;color:#0c1424">R RAMOS INFOTEC</b><br>CNPJ 45.114.523/0001-05 - V7.1 MASTER SEGURA + ROBO</div><div style="text-align:right"><b>${tipo}</b><br>${data}</div></div><br>`;
                        if(tipo==='Chamados'){html+=`<table><tr><th>#</th><th>TITULO</th><th>CLIENTE</th><th>STATUS</th><th>ABERTO POR</th><th>COMENTARIOS</th></tr>`;chamados.forEach(c=>{html+=`<tr><td>${c.id}</td><td>${c.titulo}</td><td>${c.empresa}</td><td>${c.status}</td><td>${c.abertoPor}</td><td>${(c.comentarios||[]).map(cm=>cm.autor+": "+cm.texto).join('<br>')}</td></tr>`;});html+=`</table>`;}
if(tipo==='Financeiro'){let tot=financeiro.reduce((s,f)=>s+(parseFloat(f.valorTotal)||0),0);html+=`<div style="color:green;font-weight:bold">TOTAL: R$ ${tot.toFixed(2)}</div><table><tr><th>CLIENTE</th><th>DESC</th><th>VENC</th><th>PAG</th><th>VALOR</th><th>ACRE</th><th>MULTA</th><th>TOTAL</th><th>PAGO</th><th>STATUS</th></tr>`;financeiro.forEach(f=>{html+=`<tr><td>${f.cliente}</td><td>${f.desc}</td><td>${f.vencimento}</td><td>${f.pagamento}</td><td>${f.valor}</td><td>${f.acrescimo}</td><td>${f.multa}</td><td>${f.valorTotal}</td><td>${f.valorPago}</td><td>${f.status}</td></tr>`;});html+=`</table>`;}
w.document.write(html+'</body></html>');w.document.close();w.print();}
function addCliente(){let c={id:Date.now().toString(),nome:document.getElementById('c_nome').value,whats:document.getElementById('c_whats').value,email:document.getElementById('c_email').value,cpf:document.getElementById('c_cpf').value,estado:document.getElementById('c_est').value,municipio:document.getElementById('c_mun').value,contato:document.getElementById('c_cont').value,cargo:document.getElementById('c_cargo').value};if(!c.nome)return alert('Nome obrigatorio');clientes.push(c);save();render();}
function delCliente(id){clientes=clientes.filter(c=>c.id!==id);save();render();}
function addUsuario(){let u={id:Date.now().toString(),empresa:document.getElementById('u_emp').value,login:document.getElementById('u_log').value,senha:document.getElementById('u_sen').value,nome:document.getElementById('u_nome').value,cargo:document.getElementById('u_cargo').value,tel:document.getElementById('u_tel').value,tipo:'cliente'};if(!u.login||!u.senha||!u.empresa)return alert('Empresa, Login e Senha obrigatorios');usuarios.push(u);save();render();}
function delUsuario(id){usuarios=usuarios.filter(u=>u.id!==id);save();render();}
function addChamado(){let tit=document.getElementById('ch_tit').value;if(!tit)return alert('Titulo obrigatorio');let ch={id:Date.now().toString().slice(-4),titulo:tit,prioridade:document.getElementById('ch_pri').value,categoria:document.getElementById('ch_cat').value,descricao:document.getElementById('ch_desc').value,empresa:document.getElementById('ch_cli').value,status:'ABERTO',abertoPor:sess.nome||sess.user,dataAbertura:new Date().toLocaleString('pt-BR'),comentarios:[]};chamados.push(ch);save();render();}
function delChamado(id){chamados=chamados.filter(c=>c.id!==id);save();render();}
function mudarStatus(id,novo){let ch=chamados.find(c=>c.id===id);if(!ch)return;ch.status=novo;ch.comentarios=ch.comentarios||[];ch.comentarios.push({autor:sess.nome||sess.user,texto:`Status -> ${novo}`,data:new Date().toLocaleString('pt-BR')});save();
if(novo==='FECHADO'){let cli=clientes.find(x=>x.nome===ch.empresa);if(cli&&cli.whats){let msg=`Olá ${cli.nome}! Seu chamado #${ch.id} - ${ch.titulo} foi FECHADO pela RAMOS INFOTEC. Obrigado! 🤖`;let zap=`https://wa.me/55${cli.whats.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;if(confirm('Chamado FECHADO! Deseja enviar Zap automático pro cliente via ROBÔ?'))window.open(zap,'_blank');}
let v=prompt('ROBÔ FINANCEIRO: Qual valor cobrar por esse chamado? Deixe vazio se não quiser cobrar agora:');if(v){let f={id:Date.now().toString(),cliente:ch.empresa,desc:`Chamado #${ch.id} ${ch.titulo}`,valor:parseFloat(v),vencimento:new Date().toISOString().slice(0,10),pagamento:'',acrescimo:0,multa:0,valorTotal:parseFloat(v),valorPago:0,status:'Pendente',tipo:'entrada'};financeiro.push(f);save();alert('Robô criou no Financeiro!');}}
render();}
function comentar(id){let txt=prompt('Digite o comentário do atendimento:');if(!txt)return;let ch=chamados.find(c=>c.id===id);ch.comentarios=ch.comentarios||[];ch.comentarios.push({autor:sess.nome||sess.user,texto:txt,data:new Date().toLocaleString('pt-BR')});save();render();}
function addFinanceiro(){let f={id:Date.now().toString(),cliente:document.getElementById('f_cli').value,tipo:document.getElementById('f_tipo').value,desc:document.getElementById('f_desc').value,valor:document.getElementById('f_val').value,vencimento:document.getElementById('f_venc').value,pagamento:document.getElementById('f_pag').value,acrescimo:document.getElementById('f_acre').value,multa:document.getElementById('f_multa').value,valorTotal:document.getElementById('f_total').value,valorPago:document.getElementById('f_pago').value,status:document.getElementById('f_status').value};financeiro.push(f);save();render();}
function delFinanceiro(id){financeiro=financeiro.filter(f=>f.id!==id);save();render();}
function roboDisparar(){let busca=(document.getElementById('robo_busca').value||'').toLowerCase();let msg=document.getElementById('robo_msg').value;if(!msg)return alert('Digite a mensagem do robô');let lista=clientes.filter(c=>!busca||c.nome.toLowerCase().includes(busca)||(c.municipio||'').toLowerCase().includes(busca));if(!lista.length)return alert('Nenhum cliente encontrado');if(!confirm(`Robô vai enviar para ${lista.length} clientes. Continuar?`))return;lista.forEach((cli,i)=>{setTimeout(()=>{if(!cli.whats)return;let zap=`https://wa.me/55${cli.whats.replace(/\D/g,'')}?text=${encodeURIComponent(msg.replace('{nome}',cli.nome))}`;window.open(zap,'_blank');},i*800);});}
function addNota(){let n={id:Date.now().toString(),cliente:document.getElementById('n_cli').value,valor:document.getElementById('n_val').value,data:document.getElementById('n_data').value,desc:document.getElementById('n_desc').value,forma:document.getElementById('n_forma').value};notas.push(n);save();render();}
function delNota(id){notas=notas.filter(n=>n.id!==id);save();render();}
function addBoleto(){let b={id:Date.now().toString(),cliente:document.getElementById('b_cli').value,valor:document.getElementById('b_val').value};boletos.push(b);save();render();}
function addOrc(){let o={id:Date.now().toString(),cliente:document.getElementById('o_cli').value,servico:document.getElementById('o_serv').value,visita:document.getElementById('o_vis').value,trabalho:document.getElementById('o_trab').value,total:document.getElementById('o_total').value};orcamentos.push(o);save();render();}
function addRemoto(){let r={id:Date.now().toString(),cliente:document.getElementById('r_cli').value,idRem:document.getElementById('r_id').value,senha:document.getElementById('r_senha').value};remotos.push(r);save();render();}
function addContrato(){let t=document.getElementById('ct_tit').value;if(!t)return alert('Titulo');let ct={id:Date.now().toString().slice(-5),titulo:t,cliente:document.getElementById('ct_cli').value,valor:document.getElementById('ct_val').value,arquivo:arquivoTemp};contratos.push(ct);arquivoTemp=null;save();render();}
function addPessoal(){let p={id:Date.now().toString(),nome:document.getElementById('p_nome').value,cargo:document.getElementById('p_cargo').value,tel:document.getElementById('p_tel').value,sal:document.getElementById('p_sal').value};pessoal.push(p);save();render();}
let sess=JSON.parse(sessionStorage.getItem("sess_v71")||"null");
let aba="Dashboard";
function loginScreen(){return `<div class=login-box><h2 style="text-align:center;color:#fff;margin:0">RAMOS INFOTEC</h2><p style="text-align:center;color:#7ea0c8;font-size:11px">CNPJ 45.114.523/0001-05</p><p style="text-align:center;color:var(--cyan);font-size:12px;font-weight:bold;margin:0 0 18px">V7.1 - EMPRESA + ROBO + 12 ABAS</p>
<label style="color:var(--yellow);font-weight:900">🏢 EMPRESA / CONSULTORIO *</label><input id="emp" placeholder="ramosinfotec ou nome do consultorio" style="border:1px solid #ffeb3b88">
<label>USUARIO *</label><input id="log" placeholder="admin / dono ou usuario do cliente">
<label>SENHA *</label><input id="pas" type="password" placeholder="••••••••">
<button class=btn style="width:100%;background:var(--cyan);color:#000;padding:13px;font-weight:900;margin-top:12px" onclick="doLogin()">ENTRAR</button>
<div style="background:#00e67611;border:1px solid #00e67633;color:#00e676;padding:8px;border-radius:8px;font-size:9px;text-align:center;margin-top:14px">🔒 V7.1 SEGURA - Com campo EMPRESA que você pediu</div>
<div style="background:#ffeb3b11;border:1px solid #ffeb3b33;color:#ffeb3b;padding:8px;border-radius:8px;font-size:9px;text-align:center;margin-top:8px">🤖 ADM usa empresa = ramosinfotec | CLIENTE usa empresa = nome do consultorio dele</div></div>`;}
function doLogin(){let emp=document.getElementById('emp').value.trim().toLowerCase();let l=document.getElementById('log').value.trim().toLowerCase();let p=document.getElementById('pas').value;if(!emp)return alert('Digite a EMPRESA');if(ADMINS[l]&&ADMINS[l]===p&&emp==='ramosinfotec'){sess={user:l,tipo:'dono',empresa:'ramosinfotec',nome:l.toUpperCase(),cargo:'ADMIN'};sessionStorage.setItem('sess_v71',JSON.stringify(sess));render();return;}let u=usuarios.find(x=>x.login.toLowerCase()===l&&x.senha===p&&x.empresa.toLowerCase()===emp);if(u){sess={user:u.login,tipo:u.tipo,empresa:u.empresa,nome:u.nome,cargo:u.cargo};sessionStorage.setItem('sess_v71',JSON.stringify(sess));render();}else alert('Empresa, usuario ou senha invalidos. Verifique se digitou a empresa correta.');}
function logout(){sessionStorage.removeItem('sess_v71');sess=null;render();}
function render(){
 const app=document.getElementById('app');
 if(!sess){app.innerHTML=loginScreen();return;}
 let header=`<header><div><span class=logo>RAMOS INFOTEC</span> <span style="font-size:11px"> 👤 ${sess.user} (${sess.tipo})</span> <span class="badge b-emp">🟡 ${sess.empresa}</span> <span class="badge b-dono">💎 ${aba}</span> <span class="badge b-seg">🔒 V7.1 EMPRESA+ROBO</span></div><div style="display:flex;gap:6px"><button class="btn btn-white" onclick="imprimir(aba)">🖨️ ${aba} c/ LOGO</button><button class="btn btn-red" onclick="logout()">SAIR</button></div></header>`;
 header+=`<div class=tabs>
  <div class="tab ${aba==='Dashboard'?'active':''}" onclick="aba='Dashboard';render()">📊 Dashboard</div>
  <div class="tab ${aba==='Clientes'?'active':''}" onclick="aba='Clientes';render()">👥 Clientes + ROBO</div>
  <div class="tab ${aba==='Notas'?'active':''}" onclick="aba='Notas';render()">📝 Notas</div>
  <div class="tab bol ${aba==='Boletos'?'active':''}" onclick="aba='Boletos';render()">🧾 Boletos PIX</div>
  <div class="tab ${aba==='Chamados'?'active':''}" onclick="aba='Chamados';render()">🎫 Chamados [ROBO ZAP]</div>
  <div class="tab rel ${aba==='Relatorios'?'active':''}" onclick="aba='Relatorios';render()">📊 Relatorios</div>
  <div class="tab ${aba==='Usuarios'?'active':''}" onclick="aba='Usuarios';render()">🔐 Usuarios [EMPRESA]</div>
  <div class="tab ${aba==='Contratos'?'active':''}" onclick="aba='Contratos';render()">📄 Contratos+ANEXO</div>
  <div class="tab ${aba==='Orcamentos'?'active':''}" onclick="aba='Orcamentos';render()">💰 Orcamentos</div>
  <div class="tab ${aba==='Remoto'?'active':''}" onclick="aba='Remoto';render()">💻 Remoto</div>
  <div class="tab ${aba==='Financeiro'?'active':''}" onclick="aba='Financeiro';render()">💵 Financeiro</div>
  <div class="tab ${aba==='Pessoal'?'active':''}" onclick="aba='Pessoal';render()">👷 Pessoal</div>
 </div>`;
 let body="";
 if(aba==='Dashboard'){let totalFin=financeiro.reduce((s,f)=>s+(parseFloat(f.valorTotal)||parseFloat(f.valor)||0),0);body+=`<div class=grid><div class=card><div style="color:var(--cyan)">🎫 Chamados</div><div style="font-size:26px;font-weight:900">${chamados.length}</div></div><div class=card><div style="color:var(--yellow)">👥 Clientes</div><div style="font-size:26px;font-weight:900">${clientes.length}</div></div><div class=card><div style="color:var(--green)">💰 Financeiro</div><div style="font-size:20px;font-weight:900">R$ ${totalFin.toFixed(2)}</div></div></div><div class=card><b style="color:var(--green)">✅ V7.1 - MUDANCINHAS QUE VOCE PEDIU:</b><div style="font-size:11px;line-height:1.8;margin-top:8px">✅ CAMPO EMPRESA no login (ramosinfotec = adm, consultorio = cliente) - sistema reconhece usuario pela empresa<br>✅ ROBO DE CLIENTES: procura clientes e dispara zap<br>✅ ROBO ZAP ao FECHAR chamado + ROBO FINANCEIRO que ja cria cobranca<br>✅ Login seguro sem senha na tela</div></div>`;}
 if(aba==='Chamados'){let lista=sess.tipo==='dono'?chamados:chamados.filter(c=>c.empresa.toLowerCase()===sess.empresa.toLowerCase());body+=`<div class=card><div style="color:var(--cyan);font-weight:bold">🎫 Chamados - AGORA COM ROBO ZAP AO FECHAR + ROBO FINANCEIRO</div><div class=grid><div><label>TITULO *</label><input id="ch_tit" placeholder="Ex: PC nao liga"></div><div><label>PRIORIDADE</label><select id="ch_pri"><option>Baixa</option><option>Média</option><option>Alta</option></select></div><div><label>CATEGORIA</label><select id="ch_cat"><option>Suporte Tecnico</option><option>Visita</option></select></div></div><div style="margin-top:8px"><label>DESCRICAO</label><textarea id="ch_desc" rows=3></textarea></div><div style="margin-top:8px"><label>CLIENTE / EMPRESA DO CHAMADO</label><select id="ch_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><br><button class=btn-save onclick="addChamado()">ABRIR CHAMADO</button></div>`;lista.slice().reverse().forEach(ch=>{body+=`<div class=list-item><div style="flex:1"><b>#${ch.id} ${ch.titulo}</b> <span class=tag>${ch.status}</span><div style="font-size:11px;color:#9ab">🏢 ${ch.empresa} | 👤 ${ch.abertoPor} | 🕒 ${ch.dataAbertura}</div>${(ch.comentarios||[]).length?`<div>${ch.comentarios.map(cm=>`<div class=coment><b>${cm.autor}</b>: ${cm.texto}</div>`).join('')}</div>`:''}</div><div style="display:flex;gap:5px"><button class="btn btn-cyan" onclick="comentar('${ch.id}')">💬 COMENTAR</button><button class="btn btn-orange" onclick="mudarStatus('${ch.id}','ESPERA')">⏸️ ESPERA</button><button class="btn btn-green" onclick="mudarStatus('${ch.id}','FECHADO')">✅ FECHAR + ROBO ZAP</button><button class="btn btn-yellow" onclick="mudarStatus('${ch.id}','ABERTO')">🔄 REABRIR</button><button class=x onclick="delChamado('${ch.id}')">×</button></div></div>`;});}
  if(aba==='Financeiro'){body+=`<div class=card style="border-color:var(--green)"><div style="color:var(--green);font-weight:bold">💵 Financeiro COMPLETO - COM VENCIMENTO, PAGAMENTO, ACRESCIMO, MULTA, TOTAL, TOTAL PAGO</div><div class=grid><div><label>CLIENTE *</label><select id="f_cli">${clientes.map(c=>`<option>${c.nome}</option>`).join('')}</select></div><div><label>TIPO</label><select id="f_tipo"><option>entrada</option><option>saida</option></select></div><div><label>DESCRICAO</label><input id="f_desc"></div><div><label>VALOR R$ *</label><input id="f_val" type="number" oninput="calcTotal()"></div><div><label>DATA VENCIMENTO *</label><input id="f_venc" type="date"></div><div><label>DATA PAGAMENTO</label><input id="f_pag" type="date"></div><div><label>VALOR ACRESCIMO</label><input id="f_acre" type="number" oninput="calcTotal()"></div><div><label>VALOR MULTA</label><input id="f_multa" type="number" oninput="calcTotal()"></div><div><label>VALOR TOTAL (auto)</label><input id="f_total" type="number"></div><div><label>VALOR TOTAL PAGO</label><input id="f_pago" type="number"></div><div><label>STATUS</label><select id="f_status"><option>Pago</option><option>Pendente</option><option>Atrasado</option></select></div></div><br><button class=btn-save onclick="addFinanceiro()">💾 SALVAR FINANCEIRO COMPLETO</button> <button class="btn btn-white" onclick="imprimir('Financeiro')">🖨️ Relatorio c/ LOGO</button></div>`;financeiro.slice().reverse().forEach(f=>{body+=`<div class=list-item><div><b>R$ ${f.valorTotal||f.valor}</b> - ${f.desc} - ${f.cliente}<br><span style="font-size:10px">Venc: ${f.vencimento} | Pag: ${f.pagamento} | Acre: ${f.acrescimo} | Multa: ${f.multa} | Total: ${f.valorTotal} | Pago: ${f.valorPago}</span></div><button class=x onclick="delFinanceiro('${f.id}')">×</button></div>`;});}
