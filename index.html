<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RAMOS INFOTEC V14</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0f1e;color:#e2e8f0;font-family:Inter,sans-serif}.glass{background:rgba(15,23,42,.95);border:1px solid rgba(0,217,255,.2)}.neon{color:#00D9FF}.btn{background:linear-gradient(90deg,#00D9FF,#0066FF);color:#fff;font-weight:bold}.lb{font-size:10px;color:#7dd3fc;font-weight:600;display:block;margin-bottom:3px;text-transform:uppercase}.inp{background:#0f172a;border:1px solid rgba(0,217,255,.2);color:#fff;padding:10px;border-radius:8px;width:100%;font-size:13px}</style></head><body><div id="loginScreen" class="min-h-screen flex items-center justify-center p-4"><div class="glass p-8 rounded-xl w-full max-w-sm border border-cyan-500/30"><div class="text-center mb-6"><div class="w-12 h-12 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-lg mx-auto flex items-center justify-center font-bold">RI</div><h1 class="neon font-bold mt-3">RAMOS INFOTEC V14</h1><p class="text-[10px] opacity-60">SISTEMA DE GESTÃO</p></div><label class="lb">Empresa</label><input id="empresa" class="inp mb-3" placeholder="Empresa"><label class="lb">Usuario</label><input id="usuario" class="inp mb-3" placeholder="Usuário"><label class="lb">Senha</label><input id="senha" type="password" class="inp mb-4" placeholder="Senha"><button onclick="doLogin()" class="btn w-full py-3 rounded-lg">ENTRAR</button></div></div><div id="appScreen" class="hidden min-h-screen p-4"><div class="glass p-6 rounded-xl text-center"><h1 class="text-2xl neon font-bold">ENTROU! SISTEMA OK 🚀</h1><p class="mt-4">Login funcionou!</p><button onclick="location.reload()" class="btn px-6 py-2 rounded mt-6">Sair</button></div></div><script>function doLogin(){try{let e=document.getElementById('empresa');let u=document.getElementById('usuario');let s=document.getElementById('senha');let empresa=(e.value||'').toString().trim();let usuario=(u.value||'').toString().trim();let senha=(s.value||'').toString().trim();if(!empresa||!usuario||!senha){alert('Preencha todos');return;}let empLow=empresa.toLowerCase();if((empLow==='empresa teste'&&usuario==='teste'&&senha==='teste123')||((empLow==='ramos'||empLow==='ramosinfotec')&&usuario==='admin'&&senha==='@Xumone@197353')){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');localStorage.setItem('logado','1');return;}alert('Login inválido');}catch(err){alert('Erro: '+err.message);}}</script></body></html>
