<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAMOS INFOTEC - LINDO ESCURO</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e2e8f0;font-family:Segoe UI,Arial}.top{background:#0f172a;border-bottom:1px solid #1e293b;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8}.nav{display:flex;gap:6px;padding:10px 14px;background:#0f172a;flex-wrap:wrap}.tab{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:none}.tab-clientes{background:#1e293b;color:#94a3b8}.tab-notas{background:#06b6d4;color:#000}.tab-boletos{background:#facc15;color:#000}.tab-chamados{background:#334155;color:#e2e8f0}.tab-rel{background:#10b981;color:#000}.tab-usuarios{background:#facc15;color:#000}.tab-contratos{background:#e2e8f0;color:#000}.tab-orc{background:#facc15;color:#000}.tab-remoto{background:#334155;color:#e2e8f0}.tab.active{box-shadow:0 0 0 2px #fff}.wrap{padding:14px;max-width:900px;margin:auto}.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;margin-bottom:14px}.card h4{margin:0 0 12px;font-size:13px;color:#facc15}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/3}.card label{font-size:9px;color:#64748b;display:block;margin-bottom:3px}.card input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:10px;color:#fff;font-size:12px}.btn-save{background:#38bdf8;color:#000;border:none;padding:8px 16px;border-radius:6px;font-weight:800;font-size:12px;cursor:pointer;margin-top:10px}.list{background:#1e293b;border-radius:8px;padding:10px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}.btn-ex{background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer}.login{height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0f172a}.box{width:360px;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px}.box input{width:100%;background:#0f172a;border:1px solid #334155;padding:12px;border-radius:8px;color:#fff;margin:6px 0}.btn-entrar{width:100%;background:#facc15;color:#000;padding:12px;border:none;border-radius:8px;font-weight:900;cursor:pointer}</style></head><body>
<div id="login" class="login"><h2 style="color:#facc15">💎 RAMOS INFOTEC<br><small style="font-size:12px;color:#94a3b8">V7.3 LINDO ESCURO</small></h2><div class="box"><input id="e" value="ramosinfotec"><input id="l" value="admin"><input id="s" value="admin"><button class="btn-entrar" onclick="entrar()">ENTRAR</button><p style="font-size:10px;color:#64748b">FÁCIL: ramosinfotec / admin / admin</p></div></div>
<div id="app" style="display:none"><div class="top"><div>RAMOS INFOTEC <span style="color:#facc15">● admin (admin)</span></div><div><button onclick="sair()" style="background:#1e293b;color:#fff;border:1px solid #334155;padding:4px 10px;border-radius:6px;cursor:pointer">SAIR</button></div></div><div class="nav"><button class="tab tab-clientes active" onclick="aba('cli',this)">👤 Clientes</button><button class="tab tab-notas" onclick="aba('notas',this)">📝 Notas</button><button class="tab tab-boletos" onclick="aba('pix',this)">💛 Boletos PIX</button><button class="tab tab-chamados" onclick="aba('cham',this)">🎫 Chamados</button><button class="tab tab-rel" onclick="aba('rel',this)">📊 Relatórios</button><button class="tab tab-usuarios" onclick="aba('user',this)">👥 Usuários</button><button class="tab tab-contratos" onclick="aba('cont',this)">📄 Contratos</button><button class="tab tab-orc" onclick="aba('orc',this)">💰 Orçamentos</button><button class="tab tab-remoto" onclick="aba('rem',this)">🖥️ Remoto</button></div><div class="wrap"><div id="p-cli" class="painel"><div class="card"><h4>👤 Novo Cliente - Completo</h4><div class="grid"><div><label>NOME COMPLETO *</label><input id="nNome" placeholder="Nome completo"></div><div><label>CPF/CNPJ</label><input id="nDoc" placeholder="CPF/CNPJ"></div><div><label>WHATSAPP</label><input id="nZap" placeholder="11 91111 1111"></div><div><label>TELEFONE</label><input id="nTel" placeholder="11 3333 4444"></div><div><label>CIDADE</label><input id="nCid" placeholder="Sao Paulo"></div><div><label>ESTADO</label><input id="nEst" placeholder="SP"></div><div><label>CEP</label><input id="nCep" placeholder="00000-000"></div><div><label>COMPLEMENTO</label><input id="nComp" placeholder="Apto"></div><div class="full"><label>ENDEREÇO COMPLETO</label><input id="nEnd" placeholder="Rua, numero, bairro"></div></div><button class="btn-save" onclick="saveCli()">💾 Salvar Cliente</button></div><div id="listaCli"></div></div><div id="p-cham" class="painel" style="display:none"><div class="card"><h4>🎫 Chamados</h4><input id="chDesc" placeholder="Descrição" style="width:100%;background:#0f172a;border:1px solid #334155;padding:10px;border-radius:6px;color:#fff"><button class="btn-save" onclick="saveCh()">+ Chamado</button><div id="listaCh"></div></div></div><div id="p-user" class="painel" style="display:none"><div class="card"><h4>👥 Usuários COM EMPRESA+TIPO</h4><input id="uEmp" placeholder="Empresa - ramosinfotec" value="ramosinfotec" style="width:100%;background:#0f172a;border:1px solid #334155;padding:10px;border-radius:6px;color:#fff;margin:4px 0"><input id="uTipo" placeholder="TIPO - CLIENTE ou DONO" value="CLIENTE - só vê dele" style="width:100%;background:#0f172a;border:1px solid #334155;padding:10px;border-radius:6px;color:#fff;margin:4px 0"><input id="uLogin" placeholder="LOGIN" style="width:100%;background:#0f172a;border:1px solid #334155;padding:10px;border-radius:6px;color:#fff;margin:4px 0"><input id="uSenha" placeholder="SENHA" style="width:100%;background:#0f172a;border:1px solid #334155;padding:10px;border-radius:6px;color:#fff;margin:4px 0"><button class="btn-save" onclick="saveUser()">+ Criar Usuário</button><div id="listaUser"></div></div></div><div id="p-notas" class="painel" style="display:none"><div class="card"><h4>📝 Notas</h4><p style="font-size:12px;color:#94a3b8">Módulo de notas</p></div></div><div id="p-pix" class="painel" style="display:none"><div class="card"><h4>💛 Boletos PIX</h4></div></div><div id="p-rel" class="painel" style="display:none"><div class="card"><h4>📊 Relatórios</h4><div id="rel"></div></div></div><div id="p-cont" class="painel" style="display:none"><div class="card"><h4>📄 Contratos</h4></div></div><div id="p-orc" class="painel" style="display:none"><div class="card"><h4>💰 Orçamentos</h4></div></div><div id="p-rem" class="painel" style="display:none"><div class="card"><h4>🖥️ Remoto</h4></div></div></div></div>
<script>
const K={cli:'cli_lindo',ch:'ch_lindo',users:'users_lindo'};
function get(k){return JSON.parse(localStorage.getItem(k)||'[]')}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function entrar(){let e=document.getElementById('e').value.toLowerCase();let l=document.getElementById('l').value;let s=document.getElementById('s').value;let us=get(K.users);if(us.length==0){us=[{empresa:'ramosinfotec',login:'admin',senha:'admin',tipo:'DONO',nome:'Admin'},{empresa:'ramosinfotec',login:'dono',senha:'@Xumone@197353',tipo:'DONO',nome:'Albert'}];set(K.users,us);}let ach=us.find(x=>x.empresa==e&&x.login==l&&x.senha==s);if(!ach&&e=='ramosinfotec'&&(l=='admin'&&s=='admin'||l=='dono'))ach=us[0];if(!ach){alert('Use ramosinfotec / admin / admin');return;}localStorage.setItem('sess_lindo',JSON.stringify(ach));document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';renderAll();}
function sair(){localStorage.removeItem('sess_lindo');location.reload();}
function aba(id,el){document.querySelectorAll('.painel').forEach(p=>p.style.display='none');document.getElementById('p-'+id).style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}
function saveCli(){let o={nome:document.getElementById('nNome').value,doc:document.getElementById('nDoc').value,zap:document.getElementById('nZap').value,tel:document.getElementById('nTel').value,cid:document.getElementById('nCid').value,est:document.getElementById('nEst').value,cep:document.getElementById('nCep').value,comp:document.getElementById('nComp').value,end:document.getElementById('nEnd').value};if(!o.nome)return;let a=get(K.cli);a.push(o);set(K.cli,a);renderCli();alert('Cliente salvo!');}
function renderCli(){let a=get(K.cli);let d=document.getElementById('listaCli');d.innerHTML='';a.forEach((c,i)=>{d.innerHTML+=`<div class="list"><div><b>${c.nome}</b><br><small>${c.zap||''} - ${c.cid||''}</small></div><button class="btn-ex" onclick="del('${K.cli}',${i})">Excluir</button></div>`});document.getElementById('rel').innerHTML=`Clientes: ${a.length} | Chamados: ${get(K.ch).length} | Usuários: ${get(K.users).length}`;}
function saveCh(){let de=document.getElementById('chDesc').value;if(!de)return;let a=get(K.ch);a.push({desc:de,data:new Date().toLocaleString()});set(K.ch,a);document.getElementById('chDesc').value='';renderCh();}
function renderCh(){let a=get(K.ch);let d=document.getElementById('listaCh');d.innerHTML='';a.forEach((c,i)=>{d.innerHTML+=`<div class="list"><div>${c.desc}<br><small>${c.data}</small></div><button class="btn-ex" onclick="del('${K.ch}',${i})">Excluir</button></div>`});}
function saveUser(){let emp=document.getElementById('uEmp').value;let tipo=document.getElementById('uTipo').value;let log=document.getElementById('uLogin').value;let sen=document.getElementById('uSenha').value;if(!log||!sen)return;let a=get(K.users);a.push({empresa:emp,tipo:tipo,login:log,senha:sen,nome:log});set(K.users,a);renderUser();alert('Usuário '+emp+'/'+log+' criado!');}
function renderUser(){let a=get(K.users);let d=document.getElementById('listaUser');d.innerHTML='';a.forEach((c,i)=>{d.innerHTML+=`<div class="list"><div><b>${c.empresa} / ${c.login}</b><br><small>${c.tipo}</small></div><button class="btn-ex" onclick="del('${K.users}',${i})">Excluir</button></div>`});}
function del(k,i){let a=get(k);a.splice(i,1);set(k,a);renderAll();}
function renderAll(){renderCli();renderCh();renderUser();}
(function(){let s=localStorage.getItem('sess_lindo');if(s){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';renderAll();}else{let us=get(K.users);if(us.length==0){us=[{empresa:'ramosinfotec',login:'admin',senha:'admin',tipo:'DONO',nome:'Admin'}];set(K.users,us);}}})();
</script></body></html>
