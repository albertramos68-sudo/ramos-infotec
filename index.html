<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAMOS INFOTEC V83 FINAL FIX</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Arial}
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#1e3a5f,#0b1220);padding:16px}
.login-box{width:100%;max-width:420px;background:#1e293b;padding:28px;border-radius:20px;border:1px solid #22d3ee;text-align:center}
.logo-hex{width:88px;height:88px;margin:0 auto 14px;border-radius:18px;background:#0f172a;border:2px solid #22d3ee;display:flex;align-items:center;justify-content:center}
.field{text-align:left;margin:10px 0}
.field input{width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff}
.btn{border:none;border-radius:12px;cursor:pointer;font-weight:bold}
.btn-p{background:#22d3ee;color:#000;width:100%;padding:13px;margin-top:10px}
.btn-s{background:#334155;color:#e2e8f0;padding:8px 12px;border-radius:10px;font-size:12px}
.hidden{display:none!important}
header{background:#1e293b;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0;border-bottom:1px solid #334155}
.card{background:#1e293b;padding:16px;border-radius:14px;border:1px solid #334155;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
@media(max-width:800px){.grid3,.grid4{grid-template-columns:1fr}}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{border-bottom:1px solid #334155;padding:6px;text-align:left}
th{color:#22d3ee}
</style>
</head>
<body>
<div id="login" class="login-bg"><div class="login-box">
<div class="logo-hex"><svg width="60" height="60" viewBox="0 0 64 64"><path d="M32 3 L57 17 V45 L32 59 L7 45 V17 Z" stroke="#22d3ee" stroke-width="2.4" fill="rgba(34,211,238,.12)"/><rect x="21" y="27" width="22" height="16" rx="4" stroke="#7dd3fc" stroke-width="2" fill="none"/><path d="M26 27 V21 C26 18 28.5 16 32 16 C35.5 16 38 18 38 21 V27" stroke="#7dd3fc" stroke-width="2" fill="none"/></svg></div>
<h2 style="color:#22d3ee;margin:0">RAMOS INFOTEC</h2>
<div style="color:#94a3b8;font-size:11px;margin:8px 0 18px">V83 FINAL FIX - LOGO HEX<br>ramosinfotec / admin / @Xumone@197353</div>
<div class="field"><label>EMPRESA</label><input id="lEmpresa" value="ramosinfotec"></div>
<div class="field"><label>USUARIO</label><input id="lUsuario" value="admin"></div>
<div class="field"><label>SENHA</label><input id="lSenha" type="password" value="@Xumone@197353"></div>
<button class="btn btn-p" onclick="fazerLogin()">ENTRAR</button>
<p id="loginMsg" style="color:#f87171;font-size:12px;margin-top:8px"></p>
</div></div>

<div id="app" class="hidden">
<header><div style="display:flex;gap:10px;align-items:center"><div style="width:36px;height:36px;border-radius:10px;background:#0f172a;border:1px solid #22d3ee;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 64 64"><path d="M32 4 L54 16 V44 L32 56 L10 44 V16 Z" stroke="#22d3ee" stroke-width="2" fill="none"/></svg></div><div><b id="hEmpresa" style="color:#22d3ee"></b><br><small id="hUsuario" style="color:#94a3b8"></small></div></div><div><span id="hPerfil" style="background:#22d3ee;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold"></span> <button class="btn btn-s" onclick="localStorage.clear();location.reload()">Sair</button></div></header>
<div style="padding:12px">
<nav style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px"><button class="btn btn-s" onclick="aba('dashboard')">Dashboard</button><button class="btn btn-s" onclick="aba('clientes')">Clientes 12</button><button class="btn btn-s" onclick="aba('usuarios')">Usuarios</button><button class="btn btn-s" style="background:#22d3ee;color:#000" onclick="aba('financeiro')">Financeiro 12</button></nav>
<div id="aba-dashboard" class="card"><h3 style="color:#22d3ee">Dashboard V83 FINAL FIX</h3><div id="dashInfo"></div></div>
<div id="aba-clientes" class="card hidden"><h3>Clientes - 12 CAMPOS</h3><div class="grid3"><input id="cRazao" placeholder="1-Razao"><input id="cCnpj" placeholder="2-CNPJ"><input id="cContato" placeholder="3-Contato"></div><div class="grid3"><input id="cEndereco" placeholder="4-Endereco"><input id="cNumero" placeholder="5-Numero"><input id="cBairro" placeholder="6-Bairro"></div><div class="grid3"><input id="cMunicipio" placeholder="7-Municipio"><input id="cEstado" placeholder="8-Estado"><input id="cCep" placeholder="9-CEP"></div><div class="grid3"><input id="cTelefone" placeholder="10-Telefone"><input id="cTelefone2" placeholder="11-WhatsApp"><input id="cEmail" placeholder="12-Email"></div><button class="btn btn-p" style="width:auto" onclick="salvarCliente()">Salvar Cliente 12</button><table id="tblClientes"><thead><tr><th>Empresa</th><th>CNPJ</th><th>Cidade</th><th>Contato</th></tr></thead><tbody></tbody></table></div>
<div id="aba-usuarios" class="card hidden"><h3>Usuarios</h3><div class="grid3"><input id="uEmpresa" placeholder="Empresa"><input id="uUsuario" placeholder="Usuario"><select id="uPerfil"><option value="cliente">Cliente</option><option value="admin">Admin</option></select></div><div class="grid3"><input id="uSenha" placeholder="Senha"><button class="btn btn-p" style="width:auto" onclick="salvarUsuario()">Salvar Usuario</button></div><table id="tblUsuarios"><thead><tr><th>Empresa</th><th>Usuario</th><th>Perfil</th></tr></thead><tbody></tbody></table></div>
<div id="aba-financeiro" class="card hidden"><h3>Financeiro - 12 CAMPOS</h3><div class="grid4"><input id="fData" type="date"><input id="fCliente" placeholder="Cliente"><input id="fCnpj" placeholder="CNPJ"><input id="fValor" type="number" placeholder="Valor"></div><div class="grid4"><select id="fTipo"><option>Entrada</option><option>Saida</option></select><select id="fForma"><option>Pix</option><option>Boleto</option><option>Cartao</option><option>Dinheiro</option></select><input id="fVenc" type="date"><select id="fStatus"><option>Pago</option><option>Pendente</option><option>Atrasado</option></select></div><div class="grid3"><input id="fCategoria" placeholder="Categoria"><input id="fComprov" placeholder="Comprovante"><input id="fDesc" placeholder="Descricao"></div><button class="btn btn-p" style="width:auto;background:#22d3ee;color:#000" onclick="salvarFinanceiro()">Lancar Financeiro</button><table id="tblFinanceiro"><thead><tr><th>Data</th><th>Cliente</th><th>Valor</th><th>Tipo</th><th>Status</th></tr></thead><tbody></tbody></table></div>
</div>
</div>

<script>
let clientes=JSON.parse(localStorage.getItem('ramos_c12')||'[]');
let usuarios=JSON.parse(localStorage.getItem('ramos_u83')||'[{"empresa_nome":"ramosinfotec","usuario_nome":"admin","senha_hash":"@Xumone@197353","perfil":"admin"},{"empresa_nome":"RAMOS INFOTEC","usuario_nome":"admin","senha_hash":"@Xumone@197353","perfil":"admin"}]');
let financeiros=JSON.parse(localStorage.getItem('ramos_f12')||'[]');
let usuarioLogado=null;

function fazerLogin(){
let e=document.getElementById('lEmpresa').value.trim();
let u=document.getElementById('lUsuario').value.trim();
let s=document.getElementById('lSenha').value.trim();
let m=document.getElementById('loginMsg');
if(!e||!u||!s){m.textContent='Preencha tudo';return;}
let ach=usuarios.find(x=>x.empresa_nome.toLowerCase()===e.toLowerCase()&&x.usuario_nome.toLowerCase()===u.toLowerCase()&&x.senha_hash===s);
if(!ach){m.textContent='Empresa, usuario ou senha invalidos';return;}
usuarioLogado=ach;
document.getElementById('login').classList.add('hidden');
document.getElementById('app').classList.remove('hidden');
document.getElementById('hEmpresa').textContent=ach.empresa_nome;
document.getElementById('hUsuario').textContent=ach.usuario_nome;
document.getElementById('hPerfil').textContent=ach.perfil.toUpperCase();
aba('dashboard');
renderTudo();
}

function aba(n){
document.querySelectorAll('[id^="aba-"]').forEach(d=>d.classList.add('hidden'));
document.getElementById('aba-'+n).classList.remove('hidden');
}

function salvarCliente(){
let c={
razao:document.getElementById('cRazao').value,
cnpj:document.getElementById('cCnpj').value,
contato:document.getElementById('cContato').value,
endereco:document.getElementById('cEndereco').value,
numero:document.getElementById('cNumero').value,
bairro:document.getElementById('cBairro').value,
municipio:document.getElementById('cMunicipio').value,
estado:document.getElementById('cEstado').value,
cep:document.getElementById('cCep').value,
telefone:document.getElementById('cTelefone').value,
telefone2:document.getElementById('cTelefone2').value,
email:document.getElementById('cEmail').value
};
if(!c.razao){alert('Informe Razao');return;}
clientes.push(c);
localStorage.setItem('ramos_c12',JSON.stringify(clientes));
renderClientes();
}

function renderClientes(){
let tb=document.querySelector('#tblClientes tbody');
tb.innerHTML='';
clientes.forEach(c=>{
tb.innerHTML+=`<tr><td>${c.razao}</td><td>${c.cnpj}</td><td>${c.municipio}/${c.estado}</td><td>${c.contato}</td></tr>`;
});
document.getElementById('dashInfo').innerHTML=`<div class="card" style="background:#0f172a">Clientes: <b style="color:#22d3ee;font-size:22px">${clientes.length}</b></div><div class="card" style="background:#0f172a">Financeiro: <b style="color:#22d3ee;font-size:22px">${financeiros.length}</b></div>`;
}

function salvarUsuario(){
let u={empresa_nome:document.getElementById('uEmpresa').value,usuario_nome:document.getElementById('uUsuario').value,senha_hash:document.getElementById('uSenha').value,perfil:document.getElementById('uPerfil').value};
if(!u.empresa_nome||!u.usuario_nome||!u.senha_hash){alert('Preencha');return;}
usuarios.push(u);
localStorage.setItem('ramos_u83',JSON.stringify(usuarios));
renderUsuarios();
}

function renderUsuarios(){
let tb=document.querySelector('#tblUsuarios tbody');
tb.innerHTML='';
usuarios.forEach(u=>{
tb.innerHTML+=`<tr><td>${u.empresa_nome}</td><td>${u.usuario_nome}</td><td>${u.perfil}</td></tr>`;
});
}

function salvarFinanceiro(){
let f={
data:document.getElementById('fData').value,
cliente:document.getElementById('fCliente').value,
cnpj:document.getElementById('fCnpj').value,
valor:document.getElementById('fValor').value,
tipo:document.getElementById('fTipo').value,
forma:document.getElementById('fForma').value,
venc:document.getElementById('fVenc').value,
status:document.getElementById('fStatus').value,
categoria:document.getElementById('fCategoria').value,
comprov:document.getElementById('fComprov').value,
desc:document.getElementById('fDesc').value
};
if(!f.cliente||!f.valor){alert('Cliente e Valor');return;}
financeiros.push(f);
localStorage.setItem('ramos_f12',JSON.stringify(financeiros));
renderFinanceiro();
}

function renderFinanceiro(){
let tb=document.querySelector('#tblFinanceiro tbody');
tb.innerHTML='';
financeiros.forEach(f=>{
tb.innerHTML+=`<tr><td>${f.data}</td><td>${f.cliente}</td><td>R$ ${f.valor}</td><td>${f.tipo}</td><td>${f.status}</td></tr>`;
});
}

function renderTudo(){renderClientes();renderUsuarios();renderFinanceiro();}
renderTudo();
</script>
</body>
</html>
