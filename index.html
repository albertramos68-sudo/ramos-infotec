<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RAMOS V62 SELECT FIX</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{background:#0a1931;color:#fff;font-family:Inter,sans-serif}.card{background:#112240;border-radius:12px;padding:16px}.input{background:#0a1931;border:1px solid #1e3a5f;color:#fff;border-radius:8px;padding:9px;width:100%;font-size:13px}.input option{background:#112240;color:#fff}.btn-blue{background:#00d1ff;color:#0a1931;font-weight:700;border-radius:8px;padding:9px 14px}.sidebar{width:220px;background:#08162e;min-height:100vh;position:fixed}.main{margin-left:220px;padding:20px}@media(max-width:768px){.sidebar{width:100%;position:relative;min-height:auto}.main{margin-left:0}}</style></head><body>

<div id="modalChamado" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center p-4"><div class="card w-full max-w-2xl max-h-[90vh] overflow-auto"><div class="flex justify-between mb-2"><h3 id="modalTitulo" class="font-bold"></h3><button onclick="fecharModal()" class="text-red-400">X</button></div><div id="modalBody"></div><div class="mt-3"><textarea id="comentNovo" placeholder="Comentario..." class="input mb-2"></textarea><div class="flex flex-wrap gap-2"><button onclick="incluirComentario()" class="btn-blue text-sm">Incluir Comentario</button><button onclick="transferirChamado()" class="bg-yellow-600 px-3 py-2 rounded text-sm">Transferir</button><button onclick="pausarChamado()" class="bg-gray-600 px-3 py-2 rounded text-sm">Pausar</button><button onclick="fecharChamado()" class="bg-red-600 px-3 py-2 rounded text-sm">Fechar</button><button onclick="reabrirChamado()" class="bg-green-600 px-3 py-2 rounded text-sm">Reabrir</button></div></div></div></div>
<script>
let db={clientes:[],chamados:[],usuarios:[],financeiro:[],meuFinanceiro:[],estoque:[]};let currentUser=null;let chamadoAtivo=null;let editFinIndex=-1;let editClienteIdx=-1;
function toggleSenha(){let i=document.getElementById('loginPass');let e=document.getElementById('eyeIcon');if(i.type==='password'){i.type='text';e.className='fa fa-eye-slash';}else{i.type='password';e.className='fa fa-eye';}}
function toggle2(id,eye){let i=document.getElementById(id);let e=document.getElementById(eye);if(i.type==='password'){i.type='text';e.className='fa fa-eye-slash';}else{i.type='password';e.className='fa fa-eye';}}
function load(){try{db.clientes=JSON.parse(localStorage.getItem('ramos_clientes')||'[]');db.chamados=JSON.parse(localStorage.getItem('ramos_chamados')||'[]');db.usuarios=JSON.parse(localStorage.getItem('ramos_usuarios')||'[]');db.financeiro=JSON.parse(localStorage.getItem('ramos_financeiro')||'[]');db.meuFinanceiro=JSON.parse(localStorage.getItem('ramos_meuFinanceiro')||'[]');db.estoque=JSON.parse(localStorage.getItem('ramos_estoque')||'[]');}catch(e){}if(db.usuarios.length==0){db.usuarios=[{empresa:'Ramos Infotec',nome:'Admin',login:'admin',senha:'@Xumone@197353',nivel:'admin_geral',perms:{dash:true,clientes:true,chamados:true,financeiro:true,meuFin:true,estoque:true,rel:true,usuarios:true}},{empresa:'Ramos Infotec',nome:'Admin',login:'admin',senha:'admin',nivel:'admin_geral',perms:{dash:true,clientes:true,chamados:true,financeiro:true,meuFin:true,estoque:true,rel:true,usuarios:true}}];save();}if(db.clientes.length==0){db.clientes=[{nome:'Ramos Infotec',cnpj:'',cidade:'Sao Paulo',estado:'SP',municipio:'SP',cep:'',endereco:'',numero:'',telefone:'',contato:'',email:'',tipo:'contrato',anexo:''},{nome:'Cliente Teste 1',cnpj:'',cidade:'Campinas',estado:'SP',municipio:'Campinas',cep:'',endereco:'',numero:'',telefone:'',contato:'',email:'',tipo:'avulso',anexo:''}];save();}}
function save(){localStorage.setItem('ramos_clientes',JSON.stringify(db.clientes));localStorage.setItem('ramos_chamados',JSON.stringify(db.chamados));localStorage.setItem('ramos_usuarios',JSON.stringify(db.usuarios));localStorage.setItem('ramos_financeiro',JSON.stringify(db.financeiro));localStorage.setItem('ramos_meuFinanceiro',JSON.stringify(db.meuFinanceiro));localStorage.setItem('ramos_estoque',JSON.stringify(db.estoque));}
function limparCache(){if(confirm('Limpar tudo e resetar?')){localStorage.clear();location.reload();}}
load();
function atualizarListas(){
 let empresasUnicas=[...new Set(db.clientes.map(c=>c.nome))];empresasUnicas.push('Ramos Infotec');empresasUnicas=[...new Set(empresasUnicas)];
 let dl=document.getElementById('empresasList');if(dl)dl.innerHTML=empresasUnicas.map(e=>`<option value="${e}">`).join('');
 let selCh=document.getElementById('chEmpresa');if(selCh){let val=selCh.value;selCh.innerHTML='<option value="">Empresa - Todas (selecione para filtrar)</option>'+empresasUnicas.map(c=>`<option value="${c}" ${val===c?'selected':''}>${c}</option>`).join('');}
 let selRel=document.getElementById('relEmpresa');if(selRel){let val=selRel.value;selRel.innerHTML='<option value="todos">Todas Empresas</option>'+empresasUnicas.map(c=>`<option value="${c}" ${val===c?'selected':''}>${c}</option>`).join('');}
 let selFinEmp=document.getElementById('finEmpresa');if(selFinEmp){let val=selFinEmp.value;selFinEmp.innerHTML='<option value="">Empresa - Todas</option>'+empresasUnicas.map(c=>`<option value="${c}" ${val===c?'selected':''}>${c}</option>`).join('');}
 let selFinCli=document.getElementById('finCliente');if(selFinCli){let val=selFinCli.value;selFinCli.innerHTML='<option value="">Cliente - Todos</option>'+db.clientes.map(c=>`<option value="${c.nome}" ${val===c.nome?'selected':''}>${c.nome}</option>`).join('');}
}
function fazerLogin(){let empRaw=document.getElementById('loginEmpresa').value.trim();let emp=empRaw.toLowerCase().replace(/\s+/g,'');let user=document.getElementById('loginUser').value.trim().toLowerCase();let pass=document.getElementById('loginPass').value.trim();if(!empRaw||!user||!pass){document.getElementById('loginMsg').innerText='Preencha tudo';return;}let u=db.usuarios.find(x=>{let empDb=x.empresa.toLowerCase().replace(/\s+/g,'');return x.login.toLowerCase()===user && x.senha===pass && (empDb===emp || x.nivel==='admin_geral' || emp==='ramosinfotec');});if(!u){u=db.usuarios.find(x=>x.login.toLowerCase()===user && x.senha===pass);}if(!u){document.getElementById('loginMsg').innerText='Usuario/senha invalidos - clique Limpar Cache';return;}currentUser=u;document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');document.getElementById('userInfo').innerText=`${u.nome} - ${u.empresa} (${u.nivel})`;atualizarListas();showPage('financeiro');renderTudo();}
function showPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));document.getElementById('page-'+name).classList.remove('hidden');atualizarListas();if(name==='dashboard')renderDashboard();if(name==='clientes')renderClientes();if(name==='chamados')renderChamados();if(name==='financeiro')renderFin('financeiro');if(name==='meuFinanceiro')renderFin('meu');if(name==='estoque')renderEstoque();if(name==='usuarios')renderUsuarios();}
function renderTudo(){renderDashboard();renderClientes();renderChamados();renderFin('financeiro');renderFin('meu');renderEstoque();renderUsuarios();}
function renderDashboard(){document.getElementById('dashClientes').innerText=db.clientes.length;document.getElementById('dashChamados').innerText=db.chamados.length;let total=db.financeiro.reduce((s,f)=>s+(f.tipo==='entrada'?f.valor:-f.valor),0);document.getElementById('dashFin').innerText='R$ '+total.toFixed(2);document.getElementById('dashEmpresaInfo').innerText=currentUser.nivel==='admin_geral'?'Admin Geral - vendo todas':'Empresa: '+currentUser.empresa;let lista='';db.financeiro.slice(-5).reverse().forEach(f=>{lista+=`<div>${f.empresa||''} - ${f.desc} - R$ ${f.valor} - ${f.status}</div>`});document.getElementById('dashLista').innerHTML=lista||'Sem lancamentos';}
function salvarCliente(){let c={nome:document.getElementById('cliNome').value,cnpj:document.getElementById('cliCnpj').value,cidade:document.getElementById('cliCidade').value,estado:document.getElementById('cliEstado').value,municipio:document.getElementById('cliMunicipio').value,cep:document.getElementById('cliCep').value,endereco:document.getElementById('cliEndereco').value,numero:document.getElementById('cliNumero').value,telefone:document.getElementById('cliTelefone').value,contato:document.getElementById('cliContato').value,email:document.getElementById('cliEmail').value,tipo:document.getElementById('cliTipo').value,anexo:document.getElementById('cliAnexo').value};if(!c.nome)return alert('Nome obrigatorio');if(editClienteIdx>=0){db.clientes[editClienteIdx]=c;editClienteIdx=-1;}else db.clientes.push(c);save();atualizarListas();renderClientes();alert('Cliente salvo! Lista atualizada - agora aparece nos selects do Financeiro');}
function renderClientes(){let busca=(document.getElementById('buscaCliente').value||'').toLowerCase();let html='';db.clientes.filter(c=>c.nome.toLowerCase().includes(busca)).forEach((c,i)=>{html+=`<div class="card flex justify-between text-sm"><div><b>${c.nome}</b> ${c.cidade||''}</div><div class="flex gap-1"><button onclick="editCliente(${i})" class="bg-yellow-600 px-2 rounded text-xs">Alterar</button><button onclick="if(confirm('Excluir?')){db.clientes.splice(${i},1);save();atualizarListas();renderClientes()}" class="bg-red-600 px-2 rounded text-xs">Excluir</button></div></div>`;});document.getElementById('listaClientes').innerHTML=html;}
function editCliente(i){let c=db.clientes[i];document.getElementById('cliNome').value=c.nome;editClienteIdx=i;window.scrollTo(0,0);}
function abrirChamado(){let emp=document.getElementById('chEmpresa').value||currentUser.empresa;let tipo=document.getElementById('chTipo').value;let titulo=document.getElementById('chTitulo').value;let desc=document.getElementById('chDesc').value;if(!emp||!titulo)return alert('Empresa e titulo obrigatorios');let ch={id:Date.now(),empresa:emp,tipo,titulo,desc,status:'aberto',usuario:currentUser.login,usuarioNome:currentUser.nome,data:new Date().toLocaleString(),comentarios:[{quem:currentUser.nome,texto:desc,data:new Date().toLocaleString()}]};db.chamados.push(ch);save();renderChamados();document.getElementById('chTitulo').value='';document.getElementById('chDesc').value='';}
function renderChamados(){let filtroEmp=document.getElementById('chEmpresa').value;let html='';let lista=db.chamados;if(filtroEmp)lista=lista.filter(c=>c.empresa===filtroEmp);lista.slice().reverse().forEach(ch=>{html+=`<div class="card text-sm"><b>${ch.titulo}</b> - ${ch.empresa} - ${ch.status} - ${ch.tipo||''}<br><span class="text-xs text-gray-400">${ch.data} por ${ch.usuarioNome}</span><br><button onclick="abrirModal(${ch.id})" class="btn-blue text-xs mt-1">Abrir / Ver</button></div>`;});document.getElementById('listaChamados').innerHTML=html||'<p class="text-xs text-gray-400">Nenhum chamado. Selecione empresa no filtro acima ou abra um novo.</p>';}
function abrirModal(id){let ch=db.chamados.find(c=>c.id===id);window.chamadoAtivo=ch;document.getElementById('modalTitulo').innerText=ch.titulo;let body=`<p class="text-xs mb-2">${ch.empresa} | ${ch.tipo} | ${ch.status}</p><p class="text-sm mb-2">${ch.desc}</p><div class="space-y-1">`;(ch.comentarios||[]).forEach(com=>{body+=`<div class="bg-[#0a1931] p-2 rounded text-xs"><b>${com.quem}</b> ${com.data}<br>${com.texto}</div>`});body+=`</div>`;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalChamado').classList.remove('hidden');document.getElementById('modalChamado').classList.add('flex');}
function fecharModal(){document.getElementById('modalChamado').classList.add('hidden');document.getElementById('modalChamado').classList.remove('flex');}
function incluirComentario(){let txt=document.getElementById('comentNovo').value;if(!txt)return;chamadoAtivo.comentarios.push({quem:currentUser.nome,texto:txt,data:new Date().toLocaleString()});document.getElementById('comentNovo').value='';save();abrirModal(chamadoAtivo.id);renderChamados();}
function transferirChamado(){let novaEmp=prompt('Nova empresa');if(!novaEmp)return;chamadoAtivo.empresa=novaEmp;save();atualizarListas();renderChamados();abrirModal(chamadoAtivo.id);}
function pausarChamado(){chamadoAtivo.status='pausado';save();renderChamados();abrirModal(chamadoAtivo.id);}
function fecharChamado(){chamadoAtivo.status='fechado';save();renderChamados();abrirModal(chamadoAtivo.id);}
function reabrirChamado(){chamadoAtivo.status='reaberto';save();renderChamados();abrirModal(chamadoAtivo.id);}
function salvarFin(tipo){
 let empresa=tipo==='financeiro'?document.getElementById('finEmpresa').value:currentUser.empresa;
 let cliente=tipo==='financeiro'?document.getElementById('finCliente').value:'';
 let desc=document.getElementById(tipo==='financeiro'?'finDesc':'mfinDesc').value;
 let valor=parseFloat(document.getElementById(tipo==='financeiro'?'finValor':'mfinValor').value)||0;
 let venc=document.getElementById(tipo==='financeiro'?'finVenc':'mfinVenc').value;
 let pag=document.getElementById(tipo==='financeiro'?'finPag':'mfinPag').value;
 let cat=document.getElementById(tipo==='financeiro'?'finCategoria':'mfinCategoria').value;
 let forma=document.getElementById(tipo==='financeiro'?'finForma':'mfinForma').value;
 let status=document.getElementById(tipo==='financeiro'?'finStatus':'mfinStatus').value;
 let tp=document.getElementById(tipo==='financeiro'?'finTipo':'mfinTipo').value;
 let anexo=tipo==='financeiro'?document.getElementById('finAnexo').value:'';
 let obs=document.getElementById(tipo==='financeiro'?'finObs':'mfinObs').value;
 if(!desc||!valor)return alert('Descricao e valor obrigatorios - Preencha!');
 let obj={empresa:empresa||currentUser.empresa,cliente,desc,valor,venc,pag,categoria:cat,forma,status:status||'pendente',tipo:tp||'entrada',anexo,obs,data:new Date().toISOString().slice(0,10),dataFull:new Date().toLocaleString(),usuario:currentUser.nome,id:Date.now()};
 let arr=tipo==='financeiro'?db.financeiro:db.meuFinanceiro;
 arr.push(obj);save();renderFin(tipo);limparFin(tipo);alert('Lancamento salvo! Agora aparece na lista abaixo');
}
function renderFin(tipo){
 let arr=tipo==='financeiro'?db.financeiro:db.meuFinanceiro;
 let busca=(tipo==='financeiro'?(document.getElementById('finBusca')?.value||''):'').toLowerCase();
 let filtroEmpresa=document.getElementById('finEmpresa')?.value||'';
 let filtroCliente=document.getElementById('finCliente')?.value||'';
 let filtroCat=document.getElementById('finCategoria')?.value||'';
 let filtroStatus=document.getElementById('finStatus')?.value||'';
 let filtroTipo=document.getElementById('finTipo')?.value||'';
 let filtroData=document.getElementById(tipo==='financeiro'?'finFiltro':'mfinFiltro')?.value||'todos';
 let listaId=tipo==='financeiro'?'listaFinanceiro':'listaMeuFinanceiro';
 let filtrada=arr.filter(f=>{
  if(busca &&!( (f.desc||'').toLowerCase().includes(busca) || (f.cliente||'').toLowerCase().includes(busca) || (f.empresa||'').toLowerCase().includes(busca) )) return false;
  if(filtroEmpresa && f.empresa!==filtroEmpresa) return false;
  if(filtroCliente && f.cliente!==filtroCliente) return false;
  if(filtroCat && f.categoria!==filtroCat) return false;
  if(filtroStatus && f.status!==filtroStatus) return false;
  if(filtroTipo && f.tipo!==filtroTipo) return false;
  if(filtroData!=='todos'){
   let hoje=new Date();
   if(filtroData==='dia' && f.data!==hoje.toISOString().slice(0,10)) return false;
   if(filtroData==='mes' && f.data.slice(0,7)!==hoje.toISOString().slice(0,7)) return false;
   if(filtroData==='ano' && f.data.slice(0,4)!==hoje.getFullYear().toString()) return false;
   if(filtroData==='semana'){let d=new Date(f.data);let diff=(hoje-d)/(1000*60*60*24);if(diff>7) return false;}
  }
  return true;
 });
 let totalEntr=filtrada.filter(f=>f.tipo==='entrada').reduce((s,f)=>s+f.valor,0);
 let totalSai=filtrada.filter(f=>f.tipo==='saida').reduce((s,f)=>s+f.valor,0);
 if(tipo==='financeiro'){
  document.getElementById('finTotal').innerText=`Mostrando: ${filtrada.length} de ${arr.length} | Saldo: R$ ${(totalEntr-totalSai).toFixed(2)} | Entradas: R$ ${totalEntr.toFixed(2)} | Saidas: R$ ${totalSai.toFixed(2)}`;
 }
 let html='';
 filtrada.slice().reverse().forEach((f)=>{
  let idx=arr.indexOf(f);
  html+=`<div class="card flex flex-col md:flex-row justify-between gap-2 text-xs mb-1 border-l-4 ${f.tipo==='entrada'?'border-green-500':'border-red-500'}"><div><b>${f.desc}</b> - <span class="text-cyan-300">${f.empresa||''}</span> ${f.cliente?'- '+f.cliente:''} | <span class="${f.tipo==='entrada'?'text-green-400':'text-red-400'}">R$ ${f.valor.toFixed(2)} (${f.tipo})</span> | ${f.categoria||''} | ${f.forma||''} | <span class="${f.status==='pago'?'text-green-400':f.status==='atrasado'?'text-red-400':'text-yellow-400'}">${f.status}</span><br>Venc: ${f.venc||'-'} Pag: ${f.pag||'-'} | Obs: ${f.obs||'-'} ${f.anexo?'| Anexo: '+f.anexo:''}<br><span class="text-[10px] text-gray-400">${f.data} - ${f.dataFull||''} por ${f.usuario}</span></div><div class="flex gap-1 h-fit"><button onclick="editarFin('${tipo}',${idx})" class="bg-yellow-600 px-2 py-1 rounded text-[11px]">Alterar</button><button onclick="excluirFin('${tipo}',${idx})" class="bg-red-600 px-2 py-1 rounded text-[11px]">Excluir</button></div></div>`;
 });
 document.getElementById(listaId).innerHTML=html||'<div class="card text-center text-xs text-gray-400 p-8">Nenhum lancamento encontrado.<br>Verifique se os filtros acima estão em "Todos" ou adicione um novo lancamento.<br>Se selecionou Empresa/Cliente/Categoria, mude para "Todas" para ver tudo.</div>';
}
function filtrarFinEmpresa(){renderFin('financeiro');}
function filtrarFinCliente(){renderFin('financeiro');}
function filtrarFinCat(){renderFin('financeiro');}
function filtrarFinStatus(){renderFin('financeiro');}
function limparFiltrosFin(){document.getElementById('finEmpresa').value='';document.getElementById('finCliente').value='';document.getElementById('finCategoria').value='';document.getElementById('finStatus').value='';document.getElementById('finTipo').value='';document.getElementById('finFiltro').value='todos';document.getElementById('finBusca').value='';renderFin('financeiro');alert('Filtros limpos! Agora deve mostrar tudo');}
function editarFin(tipo,idx){let arr=tipo==='financeiro'?db.financeiro:db.meuFinanceiro;let f=arr[idx];if(tipo==='financeiro'){document.getElementById('finEmpresa').value=f.empresa;document.getElementById('finCliente').value=f.cliente;document.getElementById('finDesc').value=f.desc;document.getElementById('finValor').value=f.valor;document.getElementById('finVenc').value=f.venc;document.getElementById('finPag').value=f.pag;document.getElementById('finCategoria').value=f.categoria;document.getElementById('finForma').value=f.forma;document.getElementById('finStatus').value=f.status;document.getElementById('finTipo').value=f.tipo;document.getElementById('finAnexo').value=f.anexo;document.getElementById('finObs').value=f.obs;}else{document.getElementById('mfinDesc').value=f.desc;document.getElementById('mfinValor').value=f.valor;document.getElementById('mfinVenc').value=f.venc;document.getElementById('mfinPag').value=f.pag;document.getElementById('mfinCategoria').value=f.categoria;document.getElementById('mfinForma').value=f.forma;document.getElementById('mfinStatus').value=f.status;document.getElementById('mfinTipo').value=f.tipo;document.getElementById('mfinObs').value=f.obs;}editFinIndex=idx;window.scrollTo(0,0);alert('Dados carregados nos campos acima - edite e clique em Alterar Selecionado');}
function alterarFin(tipo){if(editFinIndex<0)return alert('Clique em Alterar em um lancamento da lista primeiro!');let arr=tipo==='financeiro'?db.financeiro:db.meuFinanceiro;let f=arr[editFinIndex];f.empresa=document.getElementById('finEmpresa').value;f.cliente=document.getElementById('finCliente').value;f.desc=document.getElementById('finDesc').value;f.valor=parseFloat(document.getElementById('finValor').value)||0;f.venc=document.getElementById('finVenc').value;f.pag=document.getElementById('finPag').value;f.categoria=document.getElementById('finCategoria').value;f.forma=document.getElementById('finForma').value;f.status=document.getElementById('finStatus').value;f.tipo=document.getElementById('finTipo').value;f.anexo=document.getElementById('finAnexo').value;f.obs=document.getElementById('finObs').value;save();renderFin(tipo);editFinIndex=-1;limparFin(tipo);alert('Alterado com sucesso!');}
function excluirFin(tipo,idx){if(confirm('Excluir lancamento?')){let arr=tipo==='financeiro'?db.financeiro:db.meuFinanceiro;arr.splice(idx,1);save();renderFin(tipo);}}
function localizarFin(){let termo=prompt('Buscar por descricao, cliente ou empresa:');if(!termo)return;document.getElementById('finBusca').value=termo;renderFin('financeiro');}
function limparFin(tipo){if(tipo==='financeiro'){['finDesc','finValor','finVenc','finPag','finAnexo','finObs'].forEach(id=>{let el=document.getElementById(id);if(el)el.value='';});}else{['mfinDesc','mfinValor','mfinVenc','mfinPag','mfinObs'].forEach(id=>{let el=document.getElementById(id);if(el)el.value='';});}}
function relatorioFin(tipo){let arr=tipo==='financeiro'?db.financeiro:db.meuFinanceiro;let filtro=document.getElementById(tipo==='financeiro'?'finFiltro':'mfinFiltro').value;let hoje=new Date();let res=arr.filter(f=>{if(filtro==='dia')return f.data===hoje.toISOString().slice(0,10);if(filtro==='mes')return f.data.slice(0,7)===hoje.toISOString().slice(0,7);if(filtro==='ano')return f.data.slice(0,4)===hoje.getFullYear().toString();if(filtro==='semana'){let d=new Date(f.data);let diff=(hoje-d)/(1000*60*60*24);return diff<=7;}return true;});let totalEntr=res.filter(f=>f.tipo==='entrada').reduce((s,f)=>s+f.valor,0);let totalSai=res.filter(f=>f.tipo==='saida').reduce((s,f)=>s+f.valor,0);alert(`Relatorio ${filtro}: ${res.length} itens\nEntradas: R$ ${totalEntr.toFixed(2)}\nSaidas: R$ ${totalSai.toFixed(2)}\nSaldo: R$ ${(totalEntr-totalSai).toFixed(2)}`);}
function movEstoque(){let prod=document.getElementById('estProduto').value;let qtd=parseInt(document.getElementById('estQtd').value)||0;let mov=document.getElementById('estMov').value;let quem=document.getElementById('estQuem').value;let motivo=document.getElementById('estMotivo').value;if(!prod||!qtd)return alert('Produto e qtd obrigatorios');if(mov==='saida' &&!quem)return alert('Quem retirou obrigatorio!');db.estoque.push({produto:prod,qtd,mov,quem,motivo,data:new Date().toLocaleString()});save();renderEstoque();}
function renderEstoque(){let map={};db.estoque.forEach(e=>{if(!map[e.produto])map[e.produto]=0;map[e.produto]+=e.mov==='entrada'?e.qtd:-e.qtd;});let html='<div class="grid grid-cols-3 gap-2 mb-3">';for(let p in map){html+=`<div class="card text-xs"><b>${p}</b><br>Estoque: ${map[p]}</div>`;}html+='</div>';db.estoque.slice().reverse().forEach(e=>{html+=`<div class="card text-xs mb-1">${e.data} - ${e.produto} - ${e.mov} ${e.qtd} - ${e.quem||''} ${e.motivo||''}</div>`});document.getElementById('listaEstoque').innerHTML=html;}
function gerarRelatorio(){let tipo=document.getElementById('relTipo').value;let status=document.getElementById('relStatus').value;let empresa=document.getElementById('relEmpresa').value;let html=`<p class="text-sm mb-2">Relatorio: ${tipo} | Status: ${status} | Empresa: ${empresa}</p>`;if(tipo==='financeiro'){let lista=db.financeiro;if(empresa!=='todos')lista=lista.filter(f=>f.empresa===empresa);if(status!=='todos')lista=lista.filter(f=>f.status===status);let totE=lista.filter(f=>f.tipo==='entrada').reduce((s,f)=>s+f.valor,0);let totS=lista.filter(f=>f.tipo==='saida').reduce((s,f)=>s+f.valor,0);html+=`<p>Total: ${lista.length} lancamentos | Entradas: R$ ${totE.toFixed(2)} | Saidas: R$ ${totS.toFixed(2)} | Saldo: R$ ${(totE-totS).toFixed(2)}</p><div class="mt-2 space-y-1 max-h-96 overflow-auto">`;lista.slice().reverse().forEach(f=>{html+=`<div class="bg-[#0a1931] p-2 rounded text-xs">${f.data} - ${f.empresa} - ${f.cliente} - ${f.desc} - R$ ${f.valor} - ${f.status} - ${f.categoria}</div>`});html+='</div>';}if(tipo==='chamados'){let lista=db.chamados;if(empresa!=='todos')lista=lista.filter(c=>c.empresa===empresa);if(status!=='todos')lista=lista.filter(c=>c.status===status);html+=`<p>Total: ${lista.length} chamados</p><div class="mt-2 space-y-1">`;lista.forEach(c=>{html+=`<div class="bg-[#0a1931] p-2 rounded text-xs">${c.data} - ${c.empresa} - ${c.titulo} - ${c.status}</div>`});html+='</div>';}if(tipo==='clientes'){html+=`<p>Total clientes: ${db.clientes.length}</p>`;}document.getElementById('relResultado').innerHTML=html;}
function salvarUsuario(){let empresa=document.getElementById('usuEmpresa').value;let nome=document.getElementById('usuNome').value;let login=document.getElementById('usuLogin').value;let senha=document.getElementById('usuSenha').value;let troca=document.getElementById('usuTrocaSenha').value;let nivel=document.getElementById('usuNivel').value;if(!empresa||!nome||!login)return alert('Empresa, nome e login obrigatorios');let idx=db.usuarios.findIndex(u=>u.login.toLowerCase()===login.toLowerCase());if(idx>=0){if(troca)db.usuarios[idx].senha=troca;else if(senha)db.usuarios[idx].senha=senha;db.usuarios[idx].empresa=empresa;db.usuarios[idx].nome=nome;db.usuarios[idx].nivel=nivel;}else{if(!senha &&!troca)return alert('Senha obrigatoria');db.usuarios.push({empresa,nome,login,senha:troca||senha,nivel,perms:{dash:true,clientes:true,chamados:true,financeiro:true,meuFin:true,estoque:true,rel:true,usuarios:true},status:'ativo'});}save();renderUsuarios();atualizarListas();}
function renderUsuarios(){let html='';db.usuarios.forEach((u,i)=>{html+=`<div class="card flex justify-between text-xs items-center mb-1"><div><b>${u.nome}</b> (${u.login})<br>${u.empresa} - ${u.nivel} - Senha: ****</div><div><button onclick="if(confirm('Excluir?')){db.usuarios.splice(${i},1);save();renderUsuarios()}" class="bg-red-600 px-2 py-1 rounded">Excluir</button></div></div>`;});document.getElementById('listaUsuarios').innerHTML=html;}
function exportar(){let data=JSON.stringify(db,null,2);let blob=new Blob([data],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_v62_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importar(e){let file=e.target.files[0];let r=new FileReader();r.onload=function(ev){try{let d=JSON.parse(ev.target.result);Object.assign(db,d);save();atualizarListas();renderTudo();alert('Importado!');}catch(err){alert('Erro');}};r.readAsText(file);}
function logout(){location.reload();}
atualizarListas();
</script></body></html>
