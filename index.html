<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramos Tecnologia V4.1 Seguro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020617] text-white min-h-screen flex items-center justify-center p-4">

<!-- LOGIN -->
<div id="telaLogin" class="w-full max-w-sm bg-[#0f172a] p-6 rounded-2xl shadow-2xl border border-cyan-500/20 text-center">
<img src="./LogoTipo.jpg" onerror="this.style.display='none'" class="w-32 mx-auto mb-4 rounded-xl bg-black p-2">
<h1 class="text-xl font-bold text-cyan-400">Ramos Tecnologia</h1>
<p class="text-[11px] text-gray-400 mb-6">V4.1 SEGURO</p>
<input id="loginUser" placeholder="Login" class="w-full p-3 rounded bg-black border border-gray-700 mb-3 text-sm">
<input id="loginPass" type="password" placeholder="Senha" class="w-full p-3 rounded bg-black border border-gray-700 mb-4 text-sm">
<button onclick="fazerLogin()" class="w-full bg-cyan-500 text-black font-bold p-3 rounded hover:bg-cyan-400">ENTRAR</button>
<p id="msgErro" class="text-red-400 text-xs mt-3 hidden">Login ou senha inválidos!</p>
</div>

<!-- SISTEMA -->
<div id="telaSistema" class="hidden w-full max-w-6xl">
<div class="bg-[#0f172a] p-4 rounded-xl mb-4 flex justify-between items-center">
<h2 class="font-bold text-cyan-400">Dashboard V4.1 - Ramos Tecnologia</h2>
<button onclick="sair()" class="text-xs bg-red-500/20 text-red-400 px-3 py-1 rounded">Sair</button>
</div>
<div class="bg-[#0f172a] p-6 rounded-xl">
<h3 class="font-bold mb-4">✅ Sistema Perfeito - PIX Protegido</h3>
<p class="text-sm text-gray-300">Seu PIX agora só aparece no momento do pagamento e no PDF, não mais na tela principal.</p>
<div class="bg-[#020617] p-3 rounded mt-4 text-xs">Sistema seguro em coluna - Sem PIX exposto</div>
<!-- Aqui continua seus 5 campos de contrato: Inicio, Pagamento, Finalização, Valor Total, Mensal -->
</div>
</div>

<script>
const USUARIOS_PADRAO = {admin:"@Xumone@531973"};
function fazerLogin(){
let u = document.getElementById('loginUser').value;
let p = document.getElementById('loginPass').value;
let usuarios = JSON.parse(localStorage.getItem('usuarios')||'{}');
let todos = {...USUARIOS_PADRAO,...usuarios};
if(todos[u] && todos[u]===p){
document.getElementById('telaLogin').classList.add('hidden');
document.getElementById('telaSistema').classList.remove('hidden');
document.getElementById('msgErro').classList.add('hidden');
}else{
document.getElementById('msgErro').classList.remove('hidden');
}
}
function sair(){location.reload();}
</script>
</body>
</html>
